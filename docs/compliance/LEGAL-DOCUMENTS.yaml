# LEGAL-DOCUMENTS — inventaire des documents légaux, en vue du refactor modulaire
#
# CE QUE C'EST. La liste des documents qu'une entreprise émet, séparée en ce qui est COMMUN à tous
# les pays et ce qui est PROPRE à l'un d'eux. Elle prépare un refactor où chaque document devient un
# module activé selon le pays. Elle ne décrit pas le produit tel qu'il est ; elle décrit le terrain.
#
# CE QU'ELLE N'EST PAS. Une source de droit. Chaque entrée porte sa provenance :
#   repo          établi par le code de ce dépôt (profils, moteur) — vérifiable par lecture
#   sourced       établi contre une source primaire, avec URL et date de consultation
#   unverified    PERSONNE ne l'a établi. Ni le dépôt, ni une source. À ne pas coder.
#
# Un `unverified` n'est pas un trou dans ce document : c'est un trou dans ce que quelqu'un a
# vérifié, et le signaler est tout l'intérêt du fichier. Une règle inventée coûte plus cher qu'une
# règle absente — c'est le constat qui a ouvert ce chantier.
#
# COMMENT LIRE LA MODULARITÉ. La découverte structurante de la recherche EN 16931 est que les
# 62 codes de document du standard ne sont PAS 62 documents : ce sont quelques AXES orthogonaux
# croisés. Modéliser les axes et dériver les codes évite sept quasi-doublons que personne ne
# choisira jamais dans un menu. Voir `axes:` ci-dessous — c'est la partie qui devrait piloter le
# refactor.

meta:
  updated: 2026-08-29
  status: inventaire complet pour les 7 pays pivots — le refactor lui-même n'est pas commencé
  covered: [ EN16931, FR, IT, PL, DE, ES, MX, US ]
  pending: []
  # Comment reprendre si la session est interrompue — c'est déjà arrivé une fois, au milieu de six
  # recherches lancées en parallèle, dont quatre ont été perdues.
  resume: docs/compliance/LEGAL-DOCUMENTS.RESUME.md

# ─────────────────────────────────────────────────────────────────────────────────────────────
# LES AXES — la vraie structure, et ce sur quoi le refactor devrait s'appuyer
# ─────────────────────────────────────────────────────────────────────────────────────────────
axes:
  provenance: sourced
  source:
    what: "Dérivé des 62 codes UNTDID 1001 admis par EN 16931 (règle BR-CL-01, sévérité fatal)"
    urls:
      - "https://github.com/ConnectingEurope/eInvoicing-EN16931/blob/master/cii/schematron/codelist/EN16931-CII-codes.sch"
      - "https://ec.europa.eu/digital-building-blocks/sites/spaces/DIGITAL/pages/467108974/Registry+of+supporting+artefacts+to+implement+EN16931"
    consulted: 2026-08-28
    note: >
      Trois artefacts officiels indépendants concordent exactement — Schematron CEN/TC 434 UBL,
      Schematron CII, et le genericode 1001.gc de la Commission (2026-05-15). La classification en
      axes ci-dessous est en revanche une ANALYSE, pas une classification officielle : aucun
      standard ne classe les codes en « document » contre « qualificatif ».

  sign:
    description: "Facture ou avoir. Le seul axe déjà modélisé dans ce dépôt."
    values: [ invoice, credit_note ]
    note: "UBL le porte structurellement (deux types de document) ; le genericode le porte en colonne Remark."
  authorship:
    description: "Émis par le vendeur, ou auto-facturé par l'acheteur pour le compte du vendeur."
    values: [ supplier_issued, self_billed ]
    codes_touched: [ 389, 261, 527, 471, 473, 500, 501, 502 ]
  stage:
    description: "Où l'on se situe dans la séquence de facturation."
    values: [ proforma, prepayment, partial, interim, final, consolidated ]
    codes_touched: [ 325, 386, 326, 875, 211, 218, 876, 877, 385, 262 ]
  correction:
    description: "Le document corrige-t-il un document antérieur ? C'est une RELATION, pas un type."
    values: [ none, corrective ]
    codes_touched: [ 384, 471, 472, 473, 502, 503 ]
    note: >
      384 est le meilleur exemple de qualificatif traité à tort comme un type : XRechnung BR-DE-26 et
      Peppol le lient tous deux à BG-3, la référence au document précédent. Ce qui le définit est le
      lien, pas la nature.
  financing:
    description: "La créance a-t-elle été cédée ? Affacturage, del credere."
    values: [ none, factored, del_credere ]
    codes_touched: [ 393, 396, 472, 473, 501, 502, 390, 308 ]
  industry:
    description: "Variantes métier : construction, transport, assurance, énergie, douane."
    codes_touched: [ 875, 876, 877, 202, 203, 204, 211, 623, 780, 532, 553, 633, 575, 82, 387, 394, 870, 935 ]

  why_this_matters: >
    Le bloc 471–503 est la preuve. Ces sept codes n'existent que parce qu'UNTDID avait besoin d'un
    code plat par combinaison — auto-facturé × affacturé × correctif × acompte. Avec des drapeaux
    indépendants ils se DÉRIVENT au lieu de s'écrire, et le produit n'expose pas sept quasi-doublons.

# ─────────────────────────────────────────────────────────────────────────────────────────────
# CE QUE LE PRODUIT SAIT FAIRE AUJOURD'HUI — établi par lecture du code, pas par déclaration
# ─────────────────────────────────────────────────────────────────────────────────────────────
product_today:
  provenance: repo
  actually_produced:
    description: "Types que du code crée réellement. Vérifié par grep sur invoices.service.ts et lifecycle/corrections.ts."
    kinds: [ INVOICE, DEPOSIT, FINAL, PROFORMA, CREDIT_NOTE, CORRECTIVE_INVOICE ]
    note: "CREDIT_NOTE et CORRECTIVE_INVOICE ne naissent que par la voie de correction, jamais directement."
  declared_never_produced:
    description: >
      Présents dans le type DocumentKind du moteur et créés par AUCUNE ligne. Six types qui existent
      en tant que vocabulaire et pas en tant que fonctionnalité — à retirer ou à implémenter, mais
      pas à laisser croire qu'ils marchent.
    kinds: [ PREPAYMENT, SELF_BILLED, EXPORT_INVOICE, CASH_RECEIPT, WITHHOLDING_RECEIPT, PAYMENT_RECEIPT ]
    note: "DEBIT_NOTE a 2 occurrences hors type et specs — statut intermédiaire, à trancher."
  already_country_driven:
    description: "La seule dimension déjà pilotée par le pays : quel document corrige une facture."
    field: "profiles/data/<cc>.ts → lifecycle.correctionModel"
    values: { CREDIT_NOTE: "avoir", CORRECTIVE_INVOICE: "facture rectificative", CANCEL_AND_REPLACE: "aucun document de correction propre" }

  # Les deux anomalies de frontière, et elles comptent pour le refactor.
  boundary_problems:
    - id: quote_outside_compliance
      what: "Le DEVIS porte une numérotation sans trou et sa propre machine à états, et la couche conformité l'ignore totalement — zéro occurrence de Quote dans compliance/."
      why_it_matters: "Un document que le produit traite comme légal et que le moteur ne voit pas."
      provenance: repo
    - id: proforma_inside_documentkind
      what: "La PROFORMA est dans DocumentKind alors qu'elle n'entre dans aucune série légale : invoices.helpers.ts refuse de l'émettre."
      why_it_matters: "L'inverse du précédent. La frontière « document légal » ne passe pas là où le code la met."
      provenance: repo

# ─────────────────────────────────────────────────────────────────────────────────────────────
# ITALIE — le seul pays entièrement sourcé à ce stade
# ─────────────────────────────────────────────────────────────────────────────────────────────
countries:
  FR:
    provenance: sourced
    consulted: 2026-08-29
    caveat: >
      Le budget de recherche web de l'agent s'est épuisé avant d'atteindre le BOFiP : les entrées
      ci-dessous s'appuient sur Légifrance (droit primaire) et service-public.gouv.fr (doctrine
      administrative publiée). Aucun permalien BOFiP n'a pu être obtenu — voir open_questions.
    documents:
      - key: devis
        local: "Devis"
        en: "Quote"
        what: "Offre chiffrée avant commande ; engage le professionnel dès acceptation du client."
        nature: commercial
        obligation: conditional
        source: "service-public F31144 — consulté 2026-08-29"
        note: >
          Obligatoire PAR SECTEUR, pas en général : bâtiment, déménagement, location de véhicule
          < 3,5 t, optique, audioprothèse, services à la personne >= 100 EUR/mois, aides à
          l'autonomie >= 500 EUR, chirurgie esthétique >= 300 EUR, obsèques. Devient un contrat une
          fois accepté — donc pas un simple document commercial dans ces secteurs.
      - key: facture
        local: "Facture"
        en: "Invoice"
        what: "Émise dès la réalisation de la livraison ou de la prestation."
        nature: legal
        obligation: conditional
        source: "CGI art. 289 ; C. com. L441-9 ; CGI ann. II art. 242 nonies A"
        note: >
          Obligatoire en B2B, vers personne publique, et en B2C pour les services >= 25 EUR TTC ou
          sur demande. OPTIONNELLE en B2C sur les biens — nuance que le produit ne modélise pas.
          Numéro unique, séquence chronologique continue, conservation 10 ans (C. com. L123-22).
      - key: note_client
        local: "Note"
        en: "Note (hotel, restaurant, services to individuals)"
        what: "Document remis au consommateur à partir de 25 EUR TTC dans l'hôtellerie, la restauration et les services aux particuliers."
        nature: legal
        obligation: mandatory
        source: "Arrêté n° 83-50/A du 3 octobre 1983 ; service-public F18960"
        note: "SPÉCIFICITÉ FRANÇAISE sans équivalent dans les autres pays couverts. Le produit ne la connaît pas."
      - key: facture_acompte
        local: "Facture d'acompte"
        en: "Prepayment invoice"
        what: "Émise pour tout acompte encaissé avant l'opération."
        nature: legal
        obligation: mandatory
        source: "CGI art. 289 I-1-c ; CGI art. 269"
        note: >
          OBLIGATOIRE, et le produit la traite comme optionnelle (kind DEPOSIT). Elle rend la TVA
          exigible à l'encaissement. Exceptions : livraisons exonérées des art. 262 ter I et
          298 sexies II.
      - key: facture_solde
        local: "Facture de solde"
        en: "Final invoice"
        what: "Facture finale déduisant les acomptes déjà facturés."
        nature: legal
        obligation: optional
        source: unverified
        note: >
          Aucun texte ne consacre le terme : juridiquement c'est une facture ordinaire. Le produit a
          un kind FINAL distinct — utile fonctionnellement, mais ce n'est pas une catégorie
          juridique française.
      - key: document_modificatif
        local: "Avoir / facture rectificative"
        en: "Credit note / corrected invoice"
        what: "Tout document qui modifie une facture émise en y faisant référence de façon spécifique et non équivoque."
        nature: legal
        obligation: mandatory
        source: "CGI art. 289 I-5 ; service-public F23208"
        note: >
          RÉSULTAT LE PLUS UTILE POUR LE REFACTOR. Le CGI ne définit NI « avoir » NI « facture
          rectificative » : il pose une règle unique — tout document modifiant la facture initiale
          et y renvoyant est ASSIMILÉ À UNE FACTURE. Ce sont donc, en droit, un seul type, avec
          numéro dans la séquence, mentions de l'art. 242 nonies A, conservation 10 ans, et à partir
          de 2026/2027 le même canal électronique.
          La distinction est doctrinale et pratique : la rectificative corrige avant règlement et
          porte « annule et remplace la facture n° … », l'avoir constate après coup une annulation,
          un retour ou une remise. Pour le moteur : UN type de document modificatif avec un lien
          obligatoire vers la facture initiale, et un sous-type d'affichage — pas deux types.
      - key: note_de_debit
        local: "Note de débit"
        en: "Debit note"
        what: "Complément de facturation — pénalités, frais."
        nature: commercial
        obligation: optional
        source: unverified
        note: >
          Aucune consécration en droit fiscal français trouvée. Et la conséquence est nette : si
          elle modifie une facture, elle tombe sous l'art. 289 I-5 et devient une facture. Donc soit
          elle est purement commerciale, soit elle n'est pas une note de débit.
      - key: autofacturation
        local: "Autofacturation (mandat de facturation)"
        en: "Self-billing"
        what: "Le client ou un tiers émet matériellement la facture au nom et pour le compte du fournisseur."
        nature: legal
        obligation: optional
        source: "CGI art. 289 I-2 ; CGI ann. II art. 242 nonies A I-14°"
        note: >
          Trois conditions dans la loi : un mandat donné par l'assujetti-fournisseur, une
          ACCEPTATION PAR LUI DE CHAQUE FACTURE, et l'émission au nom et pour son compte — le
          fournisseur reste l'émetteur juridique. La mention « Autofacturation » est obligatoire.
          Les conditions de forme du mandat relèvent du BOFiP et ne sont pas sourcées.
      - key: facture_proforma
        local: "Facture proforma"
        en: "Pro forma invoice"
        what: "Facture simulée — douane, demande de financement."
        nature: commercial
        obligation: optional
        source: unverified
        note: "Aucun texte français trouvé. On ne peut pas dire si elle est interdite, tolérée ou simplement non réglementée."
      - key: chorus_pro
        local: "Demande de paiement Chorus Pro"
        en: "Payment request to a public entity"
        what: "Facture vers une personne publique, obligatoirement dématérialisée via Chorus Pro."
        nature: legal
        obligation: mandatory
        source: "service-public F23386 (renvoie CPP R2192-10 à R2192-12)"
        note: "SPÉCIFICITÉ FRANÇAISE. Le profil FR déclare déjà un canal GOV_PORTAL_API:choruspro."
      - key: decompte_marches_travaux
        local: "Décompte / décompte général et définitif (DGD)"
        en: "Payment statement for public works contracts"
        what: "Documents de paiement propres aux marchés publics de travaux."
        nature: legal
        obligation: mandatory
        source: "service-public F23386 — détail par document non vérifié"
        note: "SPÉCIFICITÉ FRANÇAISE. Famille entière que le produit ignore."
    open_questions:
      - id: fr_bofip_mandat
        what: "Les conditions de FORME du mandat de facturation — écrit ? préalable ? qui numérote ? — ne sont pas sourcées."
        settled_by: "BOI-TVA-DECLA-30-20-10 et suivants."
      - id: fr_tva_avoir
        what: "Le régime TVA de l'avoir (récupération, TVA facturée à tort) n'a pas été consulté."
        settled_by: "CGI art. 272-1 et 283-4-a."
      - id: fr_ordonnance_2027
        what: "L'art. 289 est abrogé au 2027-01-01 par l'ordonnance n° 2025-1247 du 17 décembre 2025, dispositions « partiellement reconduites »."
        settled_by: "Lecture de l'ordonnance."
        note: >
          MÊME ORDONNANCE que celle déjà signalée dans FR-RATTACHEMENT.md §4 pour les art. 289 bis et
          290 — et même échéance que la recodification italienne. Deux des trois marchés primaires
          voient leur numérotation d'articles périmer le même jour. À vérifier avant de figer un
          modèle de données.
      - id: fr_facture_periodique
        what: "La facture périodique / récapitulative (CGI 289 I-3 al. 2) n'a pas été lue littéralement ; son existence n'est pas affirmée."
        settled_by: "Texte intégral du CGI art. 289 I-3."

  PL:
    provenance: sourced
    consulted: 2026-08-29
    caveat: >
      Établi en lisant et en grepant les textes statutaires téléchargés (ustawa o VAT t.j. Dz.U.
      2025 poz. 775, lois KSeF Dz.U. 2023/1598 et 2025/1203, Ordynacja podatkowa), plus la FAQ
      officielle KSeF du Ministère des finances. Aucune lecture de commentaire secondaire.
    documents:
      - key: oferta
        local: "Oferta / Wycena"
        en: "Quote"
        what: "Offre de prix avant contrat. Aucune existence en droit de la TVA."
        nature: commercial
        obligation: optional
        source: "MF FAQ KSeF #7"
        note: "Hors KSeF — le système ne couvre que les faktury."
      - key: faktura_proforma
        local: "Faktura pro forma"
        en: "Pro forma invoice"
        what: "Demande de paiement ou aperçu de règlement."
        nature: commercial
        obligation: optional
        source: "MF FAQ KSeF #6 ; le mot « pro forma » apparaît 0 fois dans la loi TVA"
        note: >
          Le MF le dit en toutes lettres : « W rozumieniu ustawy o VAT "proforma" nie jest fakturą.
          Wystawianie tego typu dokumentów nie będzie odbywać się KSeF. » À comparer avec la France,
          où AUCUN texte ne la mentionne — deux silences de nature différente : ici c'est une
          exclusion explicite, là une absence de règle.
      - key: faktura
        local: "Faktura (VAT)"
        en: "Invoice"
        what: "Documente une vente B2B, une WSTO ou une WDT. Numéro séquentiel obligatoire."
        nature: legal
        obligation: mandatory
        source: "ustawa o VAT art. 106b, 106e"
        note: "Obligatoire en B2B ; sur demande sous 3 mois pour les opérations exonérées et le B2C."
      - key: faktura_zaliczkowa
        local: "Faktura zaliczkowa"
        en: "Advance invoice"
        what: "À l'encaissement de tout ou partie du prix avant la livraison."
        nature: legal
        obligation: mandatory
        source: "ustawa o VAT art. 106b ust. 1 pkt 4, art. 106f"
        note: >
          DÉROGATION que le produit ne modélise pas : non requise si le paiement et la livraison
          tombent le MÊME MOIS (art. 106b ust. 1a).
      - key: faktura_koncowa
        local: "Faktura końcowa / rozliczeniowa"
        en: "Final invoice"
        what: "Après livraison, quand les acomptes n'ont pas couvert la totalité ; déduit les acomptes."
        nature: legal
        obligation: mandatory
        source: "ustawa o VAT art. 106f ust. 3–4"
        note: "Doit porter les NUMÉROS KSEF des factures d'acompte — une contrainte de lien que le produit n'a pas."
      - key: faktura_korygujaca
        local: "Faktura korygująca"
        en: "Corrective invoice"
        what: "Émise par le VENDEUR. Corrige tout : base, taxe, retour de marchandise, remboursement d'acompte, et toute erreur sur n'importe quelle position."
        nature: legal
        obligation: mandatory
        source: "ustawa o VAT art. 106j"
        note: "Correspond au correctionModel CORRECTIVE_INVOICE que le profil PL déclare déjà."
      - key: nota_korygujaca
        local: "Nota korygująca"
        en: "Buyer's correction note"
        what: "Émise par l'ACHETEUR, avec acceptation du vendeur ; ne pouvait corriger que des données descriptives."
        nature: legal
        obligation: forbidden
        source: "ustawa o VAT art. 106k, ABROGÉ ; loi Dz.U. 2023/1598 art. 1 pkt 15 ; MF FAQ #73"
        note: >
          ABROGÉE AU 2026-02-01. Ma prémisse de recherche était « faktura korygująca contre nota
          korygująca, les confondre est une vraie erreur » — la réponse est plus radicale : la
          seconde n'existe plus. Un produit qui expédie aujourd'hui doit la modéliser comme NON
          ÉMISSIBLE en Pologne. Elle ne pouvait de toute façon jamais corriger les points 8 à 15 de
          l'art. 106e — quantités, prix unitaires, remises, valeurs nettes, taux, totaux, montant de
          taxe.
      - key: faktura_vat_rr
        local: "Faktura VAT RR"
        en: "Flat-rate farmer invoice"
        what: "L'ACHETEUR assujetti émet la facture lorsqu'il achète des produits ou services agricoles à un rolnik ryczałtowy."
        nature: legal
        obligation: mandatory
        source: "ustawa o VAT art. 116 ; loi Dz.U. 2025/1203 art. 17c"
        note: >
          JUMEAU STRUCTUREL de l'autofattura agricole italienne (DPR 633/72 art. 34 c. 6) : même
          forme — l'acheteur émet pour un producteur agricole sous seuil — deux noms, deux pays,
          aucun lien dans nos profils. C'est l'argument le plus net pour le modèle par axes :
          authorship=self_billed croisé avec industry=agriculture, plutôt que deux types nationaux.
          Dans KSeF seulement à partir du 2026-04-01, et seulement si le fermier y dépose une
          oświadczenie nommant cet acheteur.
      - key: samofakturowanie
        local: "Samofakturowanie"
        en: "Self-billing"
        what: "Pas un type de document : une faktura ordinaire émise par l'acheteur au nom du vendeur, portant la mention « samofakturowanie »."
        nature: legal
        obligation: optional
        source: "ustawa o VAT art. 106d, art. 106e ust. 1 pkt 17"
        note: >
          Même conclusion qu'en France (CGI 289 I-2) : ce n'est pas un TYPE, c'est un AXE. Exige un
          accord écrit préalable avec procédure d'approbation, et le vendeur doit d'abord accorder
          l'autorisation KSeF à l'acheteur.
      - key: paragon_fiskalny
        local: "Paragon fiskalny"
        en: "Fiscal receipt"
        what: "Enregistrement en caisse de toute vente à un consommateur ou à un rolnik ryczałtowy."
        nature: legal
        obligation: mandatory
        source: "ustawa o VAT art. 111 ust. 1 ; art. 145n pour l'exclusion KSeF"
        note: "Hors KSeF, et les reçus avec NIP <= 450 zł le restent jusqu'au 2026-12-31."
      - key: rachunek
        local: "Rachunek"
        en: "Plain bill"
        what: "Émis à la demande de l'acheteur quand aucune obligation de facture ne naît d'ailleurs ; délai 7 jours."
        nature: legal
        obligation: conditional
        source: "Ordynacja podatkowa art. 87 §§ 1–3"
        note: "SPÉCIFICITÉ : document légal qui ne relève PAS de la loi TVA mais du code de procédure fiscale. Utilisé par les non-assujettis."
      - key: nota_ksiegowa
        local: "Nota księgowa / obciążeniowa"
        en: "Accounting note"
        what: "Charge hors TVA — pénalités, dommages, refacturation de non-livraisons."
        nature: commercial
        obligation: optional
        source: "MF FAQ KSeF #49, #55"
        note: "Explicitement hors KSeF. Équivalent fonctionnel de la « note de débit » française, elle aussi hors du champ fiscal."
    open_questions:
      - id: pl_nota_korygujaca_transitoire
        what: "Aucune disposition transitoire trouvée préservant l'art. 106k pour les factures émises avant le 2026-02-01."
        settled_by: "Grep des art. 12 à 22 de la loi Dz.U. 2023/1598, ou une interpretacja ogólna du MF."
      - id: pl_rozporzadzenie_106s
        what: "Le rozporządzenie de l'art. 106s listant les livraisons exclues de KSeF n'a pas été récupéré."
        settled_by: "Le règlement lui-même."
      - id: pl_variantes_de_marquage
        what: "faktura marża, faktura VAT MP / metoda kasowa, faktura zbiorcza sont des VARIANTES DE MARQUAGE (art. 106e ust. 1 pkt 16, ust. 2–3 ; art. 106j ust. 3), pas des types distincts."
        settled_by: "Décision produit, pas juridique — les traiter comme des modules serait un choix, pas une obligation."

  DE:
    provenance: sourced
    consulted: 2026-08-29
    caveat: >
      UStG et UStDV lus sur gesetze-im-internet.de (droit primaire). L'UStAE n'a pu être atteint que
      via un miroir : l'hôte officiel du BMF est derrière un mur anti-robot. Ce miroir porte encore
      la numérotation de phrases d'avant 2025 — à revérifier avant de figer une citation.
    documents:
      - key: angebot
        local: "Angebot / Kostenvoranschlag"
        en: "Quote"
        what: "Offre de contracter ; l'offrant est lié sauf exclusion. Aucune existence en droit de la TVA."
        nature: commercial
        obligation: optional
        source: "BGB § 145"
      - key: rechnung
        local: "Rechnung"
        en: "Invoice"
        what: "Tout document par lequel une livraison ou une prestation est décomptée. Numéro séquentiel requis."
        nature: legal
        obligation: conditional
        source: "UStG § 14 (2) S. 2 Nr. 1–3, § 14 (4) Nr. 4"
        note: >
          Obligatoire sous 6 MOIS en B2B, vers une personne morale non assujettie, et pour les
          travaux immobiliers envers quiconque. Simplement PERMISE ailleurs — le verbe de la loi est
          « berechtigt ».
      - key: erechnung
        local: "eRechnung"
        en: "Structured e-invoice"
        what: "Format structuré permettant le traitement électronique, sémantique EN 16931 ; tout le reste est une « sonstige Rechnung »."
        nature: legal
        obligation: mandatory
        source: "UStG § 14, § 27 (38)"
        note: >
          Transition : papier toléré jusqu'au 2026-12-31 pour tous, jusqu'au 2027-12-31 si le
          chiffre d'affaires de l'année précédente <= 800 000 EUR ou via EDI. AUCUN report pour la
          RÉCEPTION — asymétrie identique au mandat français.
      - key: kleinbetragsrechnung
        local: "Kleinbetragsrechnung"
        en: "Small-amount invoice"
        what: "Total TTC <= 250 EUR : mentions réduites, TVA en un seul montant global."
        nature: legal
        obligation: optional
        source: "UStDV § 33"
        note: >
          INTERDITE pour les ventes à distance (§ 3c), les livraisons intracommunautaires (§ 6a) et
          l'autoliquidation (§ 13b). Et elle échappe au format eRechnung : toujours émissible en
          « sonstige Rechnung ».
      - key: anzahlungsrechnung
        local: "Anzahlungs- / Vorausrechnung"
        en: "Advance invoice"
        what: "Facture d'un montant encaissé avant la livraison ; doit être reconnaissable comme telle."
        nature: legal
        obligation: mandatory
        source: "UStG § 14 (1)–(4) ; UStAE 14.8"
      - key: schlussrechnung
        local: "Schlussrechnung / Endrechnung"
        en: "Final invoice"
        what: "Facture l'opération entière une fois exécutée."
        nature: legal
        obligation: mandatory
        source: "UStG § 14c (1) ; UStAE 14.8"
        note: >
          DOIT DÉDUIRE les acomptes déjà facturés ET leur TVA. À défaut, § 14c (1) rend redevable de
          la TVA excédentaire. Notre kind FINAL déduit les acomptes fonctionnellement mais rien
          n'impose la règle ni n'en signale la sanction.
      - key: gutschrift_selbstabrechnung
        local: "Gutschrift (Selbstabrechnung)"
        en: "Self-billed invoice"
        what: "Facture émise par le CLIENT pour la livraison du fournisseur, sur accord préalable."
        nature: legal
        obligation: optional
        source: "UStG § 14 (2) et § 14 (4) Nr. 10 ; UStAE 14c.1"
        note: >
          La MENTION « Gutschrift » est un élément obligatoire de la facture. Le document perd sa
          qualité de facture dès que le fournisseur s'y oppose, même s'il était exact sur le fond.
      - key: kaufmaennische_gutschrift
        local: "Kaufmännische Gutschrift"
        en: "Commercial credit note"
        what: "Annulation ou correction par l'émetteur de sa PROPRE facture antérieure."
        nature: commercial
        obligation: optional
        source: "UStAE 14c.1 (3) S. 3"
        note: >
          LE PIÈGE ALLEMAND, résolu. Deux documents pour un seul mot, et la loi les sépare par QUI
          décompte LA LIVRAISON DE QUI, pas par l'étiquette. L'UStAE le dit deux fois : « Keine
          Gutschrift ist die im allgemeinen Sprachgebrauch ebenso bezeichnete Stornierung oder
          Korrektur der ursprünglichen Rechnung. »
          Soupape asymétrique à modéliser : mal étiqueter un avoir « Gutschrift » ne déclenche PAS
          le § 14c — mais une vraie auto-facturation SANS le mot est une facture défectueuse.
      - key: mahnung
        local: "Mahnung"
        en: "Dunning letter"
        what: "Relance de paiement."
        nature: commercial
        obligation: optional
        source: "UStAE 14.1"
        note: >
          EXPRESSÉMENT PAS une facture, même si elle porte toutes les mentions du § 14 (4) — parce
          qu'elle relève du trafic de paiement et non du décompte d'une livraison. Utile : montre
          que le critère allemand est la FONCTION, pas le contenu.
    open_questions:
      - id: de_proformarechnung
        what: "Aucun traitement de la Proformarechnung trouvé dans l'UStG, l'UStDV ni les sections d'UStAE lues."
        settled_by: "UStAE 14.1 et 14.4 en entier, ou une lettre du BMF."
      - id: de_ustae_numerotation
        what: "Le miroir UStAE consulté porte les renvois de phrases d'avant 2025 ; l'UStG actuel lit § 14 Abs. 2 Satz 5, 6 et 7."
        settled_by: "Une édition à jour de l'UStAE depuis l'hôte officiel."

  ES:
    provenance: sourced
    consulted: 2026-08-29
    documents:
      - key: presupuesto
        local: "Presupuesto"
        en: "Quote"
        what: "Devis."
        nature: commercial
        obligation: optional
        source: "Absent de l'index complet du RD 1619/2012, art. 1 à 26"
        note: "Obligations sectorielles éventuelles en droit de la consommation : non vérifiées, et non extrapolées."
      - key: factura
        local: "Factura completa / ordinaria"
        en: "Invoice"
        what: "Facture complète ; numérotation corrélative par série."
        nature: legal
        obligation: mandatory
        source: "RD 1619/2012 art. 2, art. 6"
      - key: factura_simplificada
        local: "Factura simplificada"
        en: "Simplified invoice"
        what: "Contenu réduit. Admise jusqu'à 400 EUR TTC, ou 3 000 EUR pour une liste fermée de secteurs."
        nature: legal
        obligation: optional
        source: "RD 1619/2012 art. 7, art. 4"
        note: >
          INTERDITE pour les livraisons intracommunautaires (art. 25 LIVA), les opérations de
          l'art. 68.Tres.a), et l'autoliquidation auto-facturée. La variante « cualificada »
          (art. 7.2), qui porte le NIF du destinataire, est la SEULE simplifiée touchée par
          l'obligation de facture électronique B2B.
      - key: factura_rectificativa
        local: "Factura rectificativa"
        en: "Corrective invoice"
        what: "L'instrument de correction. Exige sa PROPRE SÉRIE dédiée."
        nature: legal
        obligation: mandatory
        source: "RD 1619/2012 art. 15, art. 6.1.a).2º"
        note: >
          SEULE VOIE au niveau facture — art. 15.4 : « La rectificación se realizará mediante la
          emisión de una nueva factura ». Il n'existe AUCUN annuler-et-remplacer d'une facture
          valablement émise en Espagne.
          Deux modalités : par différences, ou par substitution en affichant les chiffres corrigés
          tout en indiquant le montant de la rectification. Délai 4 ans.
          CONTRAINTE QUE LE PRODUIT N'A PAS : la série dédiée. Notre numérotation ne connaît pas la
          notion de série par type de document.
      - key: factura_recapitulativa
        local: "Factura recapitulativa"
        en: "Recapitulative invoice"
        what: "Une facture pour plusieurs opérations vers le même destinataire dans un mois civil."
        nature: legal
        obligation: optional
        source: "RD 1619/2012 art. 13"
      - key: recibo_reagp
        local: "Recibo (REAGP)"
        en: "Receipt to a flat-rate farmer"
        what: "L'ACHETEUR l'émet au profit d'un agriculteur ou pêcheur du régime spécial, avec le pourcentage et le montant de compensation, SIGNÉ PAR L'AGRICULTEUR."
        nature: legal
        obligation: mandatory
        source: "RD 1619/2012 art. 16"
        note: >
          TROISIÈME occurrence du même document sous un troisième nom — après l'autofattura agricole
          italienne (art. 34 c. 6) et la faktura VAT RR polonaise (art. 116). Trois pays, trois
          noms, une seule forme : l'acheteur émet pour un producteur agricole sous régime spécial.
          L'Espagne ajoute une exigence que les deux autres n'ont pas — la SIGNATURE du producteur.
      - key: autofactura_es
        local: "Autofactura / factura expedida por el destinatario"
        en: "Self-billing"
        what: "Émission par le client ou un tiers, sur accord."
        nature: legal
        obligation: optional
        source: "RD 1619/2012 art. 5, art. 6.1.a).1º"
        note: "Chaque émetteur exige une SÉRIE DISTINCTE — même contrainte de numérotation que la rectificativa."
      - key: duplicado
        local: "Duplicado"
        en: "Duplicate"
        what: "Un seul original par facture ; duplicata uniquement si plusieurs destinataires partagent une opération, ou si l'original est perdu."
        nature: legal
        obligation: conditional
        source: "RD 1619/2012 art. 14"
        note: "RESTREINT : interdit hors de ces deux cas. Doit porter le mot « duplicado »."
      - key: estados_factura
        local: "Estados de la factura"
        en: "Invoice status messages"
        what: "Le DESTINATAIRE doit signaler en retour l'acceptation ou le refus commercial, et le paiement effectif intégral, sous 4 jours ouvrables."
        nature: legal
        obligation: mandatory
        source: "RD 238/2026"
        note: >
          CLASSE D'OBLIGATION QUE LE PRODUIT N'A PAS DU TOUT. Ce n'est pas un document émis mais une
          réponse due par le receveur — proche du sens entrant de reception/, sans équivalent dans
          nos profils. Facultatifs en plus : acceptation partielle, paiement partiel, cession.
      - key: registro_verifactu
        local: "Registro de facturación de alta / de anulación"
        en: "Veri*Factu billing record"
        what: "Pas un document remis au client : un enregistrement chaîné et haché, généré avec ou juste avant chaque facture."
        nature: legal
        obligation: mandatory
        source: "RD 1007/2023 art. 9, 10, 11 ; art. 8.2.a)"
        note: >
          COUCHE DISTINCTE, et c'est le point de conception. L'ANNULATION n'existe QUE là — jamais au
          niveau de la facture — et même là c'est un enregistrement AJOUTÉ, jamais une suppression :
          les originaux restent inaltérables. Obligatoire au 2027-01-01 pour les assujettis à l'IS,
          au 2027-07-01 pour les autres. Les déclarants SII en sont exclus.
    open_questions:
      - id: es_fecha_b2b
        what: "Le mandat de facture électronique B2B (RD 238/2026) est indexé sur l'entrée en vigueur d'un arrêté ministériel non publié : 12 mois pour les entreprises > 8 M EUR, 24 mois pour les autres. AUCUNE date absolue ne peut être avancée."
        settled_by: "Publication de l'orden ministerial."
      - id: es_factura_anticipo
        what: "AUCUN type « factura de anticipo » n'existe dans le RD 1619/2012 : un acompte déclenche le devengo à l'encaissement et se facture par une factura ordinaire."
        settled_by: "Établi — consigné ici parce que c'est une DIFFÉRENCE avec l'Allemagne et la France, qui ont toutes deux un document d'acompte nommé."

  MX:
    provenance: sourced
    consulted: 2026-08-29
    caveat: >
      www.sat.gob.mx renvoie 403 depuis ce réseau (géo-blocage) ; tout vient de l'hôte d'archive
      omawww.sat.gob.mx, du DOF et d'ordenjuridico.gob.mx. Le CFF consolidé lu porte « última
      reforma DOF 12-11-2021 » — cohérent avec les renvois de la RMF 2026, mais non confirmé
      contre diputados.gob.mx, injoignable.
    documents:
      - key: cfdi_ingreso
        local: "CFDI tipo I — Ingreso"
        en: "Income invoice"
        what: "Émis pour tout revenu obtenu : services, loyers, honoraires, ventes de biens, exportations."
        nature: legal
        obligation: mandatory
        source: "Anexo 20 Guía de llenado, Apéndice 2 ; CFF art. 29, 29-A"
      - key: cfdi_egreso
        local: "CFDI tipo E — Egreso"
        en: "Credit note"
        what: "Retours, remises et rabais, et correction d'un CFDI de revenu quant aux MONTANTS qu'il documente."
        nature: legal
        obligation: mandatory
        source: "Anexo 20 Guía de llenado, Apéndice 2 p. 57 et Apéndice 5"
        note: >
          Le SAT le dit mot pour mot : « Este comprobante es conocido como nota de crédito ». Se
          relie au CFDI d'origine par CfdiRelacionado avec TipoRelacion 01 ou 03.
      - key: cfdi_traslado
        local: "CFDI tipo T — Traslado"
        en: "Transfer document"
        what: "Couvre le transport et la possession légale de marchandises en transit. Total obligatoirement zéro."
        nature: legal
        obligation: mandatory
        source: "Anexo 20 Guía de llenado, Apéndice 2"
      - key: cfdi_nomina
        local: "CFDI tipo N — Nómina"
        en: "Payroll receipt"
        what: "CFDI portant le complemento de paie, pour les salaires et rémunérations assimilées."
        nature: legal
        obligation: mandatory
        source: "RMF 2026 regla 2.7.5.1 (LISR 99 fr. III)"
        note: "Le produit ne fait pas de paie — mais c'est un document du même système, et il compte pour l'inventaire."
      - key: cfdi_pago
        local: "CFDI tipo P + Complemento para recepción de pagos (REP)"
        en: "Payment receipt"
        what: "Émis quand le prix est réglé en plusieurs fois ou n'était pas payé à la facturation. Total zéro."
        nature: legal
        obligation: mandatory
        source: "Guía de llenado Pagos ; CFF art. 29-A fr. VII b) ; RMF 2.7.1.29 et 2.7.1.32"
        note: >
          ÉCHÉANCE FERME : le 5 du mois civil suivant le paiement, sous peine d'amende (CFF 83-VII /
          84-IV). Un document DÉCLENCHÉ PAR LE PAIEMENT — le produit n'a rien de tel, et notre
          PAYMENT_RECEIPT déclaré n'est produit par aucune ligne.
      - key: cfdi_retenciones
        local: "CFDI de Retenciones e información de pagos"
        en: "Withholding statement"
        what: "Déclare les retenues, y compris les paiements à des non-résidents."
        nature: legal
        obligation: mandatory
        source: "Anexo 20, rubro II"
        note: "PAS dans c_TipoDeComprobante : c'est un standard séparé. Notre WITHHOLDING_RECEIPT déclaré n'est produit nulle part."
      - key: carta_porte
        local: "Complemento Carta Porte v3.1"
        en: "Bill of lading complement"
        what: "Complément sur un CFDI I ou T : marchandises, origine, destination, mode de transport. Porte son propre folio IdCCP et un QR."
        nature: legal
        obligation: mandatory
        source: "RMF 2026 reglas 2.7.7.1.1, 2.7.7.1.2, 2.7.7.2.1"
        note: "Le transport LOCAL hors routes fédérales en est exempté."
      - key: cfdi_global
        local: "CFDI global / operaciones con el público en general"
        en: "Aggregate retail invoice"
        what: "CFDI agrégé quotidien, hebdomadaire ou mensuel vers le RFC générique, listant les tickets de caisse."
        nature: legal
        obligation: optional
        source: "RMF 2026 regla 2.7.1.21"
        note: "Mécanisme optionnel — mais les tickets de caisse sous-jacents, eux, sont obligatoires."
      - key: cancelacion_sustitucion
        local: "Solicitud de cancelación + sustitución (TipoRelacion 04)"
        en: "Cancellation with substitution"
        what: "Pas un document : une demande signée contre un folio existant. Le destinataire a 3 jours pour accepter ou refuser ; le silence vaut acceptation."
        nature: legal
        obligation: conditional
        source: "CFF art. 29-A ¶4 et ¶6 ; RMF 2026 reglas 2.7.1.34, 2.7.1.35"
        note: >
          LA LIGNE DE PARTAGE MEXICAINE, et elle est nette : E quand les MONTANTS sont faux ou ont
          changé — le document reste valide ; annulation-substitution quand le DOCUMENT lui-même est
          faux. Ordre imposé par le SAT : émettre d'abord le CFDI correct avec TipoRelacion 04 et le
          folio remplacé, PUIS demander l'annulation avec le motif 01.
          CONTRAINTE TEMPORELLE que rien chez nous n'exprime : l'annulation n'est possible QUE
          pendant l'exercice d'émission. Le E, lui, n'est pas borné.
    open_questions:
      - id: mx_motivos_cancelacion
        what: "Seul le motif 01 est sourcé. Les valeurs 02, 03 et 04 de c_MotivoCancelacion n'ont PAS été trouvées — absentes du catalogue catCFDI_V_4 (48 Mo, 28 feuilles énumérées) et de la RMF 2026."
        settled_by: "La page sat.gob.mx/consultas/91447 ou la documentation technique du service d'annulation — toutes deux en 403 depuis ce réseau."
        note: "NE PAS coder 02/03/04 de mémoire."
      - id: mx_e_pour_erreur_non_monetaire
        what: "Aucune source n'INTERDIT explicitement d'utiliser un E pour corriger une donnée non monétaire (RFC erroné, code d'usage)."
        settled_by: "Une règle SAT explicite ; en l'absence, ne pas présumer."

  US:
    provenance: sourced
    consulted: 2026-08-29
    headline: >
      IL N'EXISTE AUCUNE FACTURE FÉDÉRALE AMÉRICAINE. Pas de TVA fédérale, et aucun texte fédéral ne
      prescrit un document, son contenu, sa numérotation ni son format pour une vente commerciale
      intérieure. L'obligation porte sur les REGISTRES, pas sur un DOCUMENT : 26 U.S.C. § 6001
      impose de tenir des registres, et l'IRS Publication 583 dit « Except in a few cases, the law
      does not require any specific kind of records. » La facture n'y figure que comme UNE preuve
      possible de recettes, à côté des bandes de caisse et des bordereaux de dépôt.
      Un négatif bien établi est ici la bonne réponse, pas un échec de recherche.
    documents:
      - key: sales_invoice
        local: "Sales invoice / bill"
        en: "Invoice"
        what: "Demande de paiement commerciale. Aucun contenu, numéro, séquence, langue, devise, signature ni format d'archivage prescrits."
        nature: commercial
        obligation: optional
        source: "IRS Pub 583 ; 26 U.S.C. § 6001"
      - key: invoice_ny_sales_tax
        local: "Invoice with separately stated sales tax (New York)"
        en: "Invoice showing sales tax separately"
        what: "Un vendeur new-yorkais DOIT toujours indiquer séparément le montant de la taxe sur la facture ou le reçu remis au client."
        nature: legal
        obligation: mandatory
        source: "NY TB-ST-770"
        note: >
          LIMITE ARCHITECTURALE, et c'est le résultat le plus utile de la partie américaine : nos
          profils sont indexés PAR PAYS, et ici la règle est INFRA-NATIONALE. New York l'impose, la
          Californie ne l'impose pas — CDTFA Regulation 1700 : l'affichage n'est qu'une des trois
          façons d'établir l'accord de l'acheteur, et l'ajout de la taxe « depends solely upon the
          terms of the agreement of sale ». Deux États, deux règles, un seul countryCode.
      - key: exemption_certificate
        local: "Resale / exemption certificate"
        en: "Exemption certificate"
        what: "Émis par l'ACHETEUR au vendeur. Sans lui, le vendeur est redevable de la taxe non collectée ; reçu de bonne foi, il transfère la charge."
        nature: legal
        obligation: mandatory
        source: "NY TB-ST-240 ; Texas Comptroller"
        note: "Document émis par l'acheteur VERS le vendeur — direction que notre modèle ne connaît pas, et qui n'est ni de l'auto-facturation ni de la réception."
      - key: commercial_invoice_cbp
        local: "Commercial invoice (import)"
        en: "Customs commercial invoice"
        what: "Déposée par l'IMPORTATEUR pour chaque envoi. Contenu fixé par règlement : parties, description détaillée, quantités, prix, devise, charges, PAYS D'ORIGINE."
        nature: legal
        obligation: mandatory
        source: "19 CFR 141.83, 141.86 ; 19 U.S.C. 1481"
        note: "La seule facture fédérale américaine obligatoire — et elle est douanière, pas fiscale, et à l'IMPORT."
      - key: proper_invoice_far
        local: "Proper invoice (FAR)"
        en: "Federal contractor invoice"
        what: "Contenu prescrit : nom, date, NUMÉRO de facture, numéro de contrat et de poste, quantités, conditions, TIN, données de virement."
        nature: legal
        obligation: mandatory
        source: "FAR 32.905(b)"
        note: >
          LE SEUL ENDROIT où le droit américain impose un numéro de facture — et seulement pour les
          fournisseurs de l'État fédéral. Une facture incomplète est renvoyée sous 7 jours, 3 pour
          les denrées périssables.
      - key: credit_memo_us
        local: "Credit memo / debit memo"
        en: "Credit / debit memo"
        what: "Ajuste une vente antérieure."
        nature: commercial
        obligation: optional
        source: "Aucun instrument fédéral ni d'État trouvé — négatif"
        note: "Aucune identité fiscale, aucune déclaration à une autorité."
    open_questions:
      - id: us_retention_profil
        what: "Notre profil us.ts déclare retentionYears: 7. La réponse sourcée est un ÉVENTAIL : 3 ans en principe, 6 si plus de 25 % des revenus sont omis, 7 pour créances irrécouvrables, 4 pour les taxes sur salaires, indéfini si aucune déclaration ou déclaration frauduleuse. Et les États ont leur propre horloge — NY 3 ans, TX 4."
        settled_by: "Décision produit : 7 est le maximum d'une branche, pas la règle. Le conserver sur-couvre, ce qui est le sens sûr, mais l'affirmer comme LA durée américaine est faux."
      - id: us_numerotation_etats
        what: "Aucune obligation de numérotation séquentielle trouvée — mais seuls NY, CA et TX ont été vérifiés."
        settled_by: "Les 47 autres juridictions. Ne pas généraliser « aucun État n'impose de numérotation » à partir de trois."
      - id: us_facture_export
        what: "Aucun instrument américain n'impose à l'exportateur d'émettre une facture à l'acheteur étranger."
        settled_by: "Probablement réellement absent — c'est le pays d'IMPORT qui l'exige — mais consigné comme non vérifié plutôt qu'affirmé."

  IT:
    provenance: sourced
    consulted: 2026-08-28
    documents:
      - key: fattura
        local: "Fattura (TD01)"
        en: "Invoice"
        what: "La facture ordinaire. Émise dans les 12 jours suivant l'effettuazione de l'opération."
        nature: legal
        obligation: mandatory
        source: "DPR 633/1972 art. 21 c. 4 — normattiva.it"
      - key: fattura_differita
        local: "Fattura differita (TD24 / TD25)"
        en: "Deferred invoice"
        what: "Une facture unique récapitulant les opérations du mois vers un même client, émise jusqu'au 15 du mois suivant. Exige un DDT pour les biens, une « idonea documentazione » pour les services."
        nature: legal
        obligation: optional
        source: "DPR 633/1972 art. 21 c. 4 lett. a) — quatre dérogations a) à d), pas davantage"
        note: "La TVA reste liquidée au mois de l'opération, SAUF pour la lett. b) où l'exigibilité glisse au mois suivant (art. 6 c. 5)."
      - key: nota_di_credito
        local: "Nota di credito (TD04)"
        en: "Credit note"
        what: "Variation à la baisse de la base ou de la taxe."
        nature: legal
        obligation: optional
        source: "DPR 633/1972 art. 26 c. 2"
        note: >
          C'est une FACULTÉ, pas une obligation — l'article dit « ha diritto » et emploie trois fois
          « la facoltà di cui al comma 2 ». Asymétrie à modéliser : une fois exercée, elle crée une
          OBLIGATION corrélative chez l'acheteur (c. 5), sauf en procédure collective.
      - key: nota_di_debito
        local: "Nota di debito (TD05)"
        en: "Debit note"
        what: "Variation à la hausse. Le miroir de la nota di credito."
        nature: legal
        obligation: mandatory
        source: "DPR 633/1972 art. 26 c. 1 — « devono essere osservate »"
        note: "Obligatoire là où l'avoir est facultatif. C'est l'asymétrie centrale du droit italien sur ce point."
      - key: autofattura_agricola
        local: "Autofattura per agricoltore esonerato (TD01)"
        en: "Self-billed invoice for an exempt farmer"
        what: "L'ACHETEUR émet la facture pour le compte d'un producteur agricole sous le seuil de 7 000 €, aux pourcentages de compensation."
        nature: legal
        obligation: mandatory
        source: "DPR 633/1972 art. 34 c. 6 ; AdE FAQ n. 85 du 19/07/2019 pour le code TD01"
        note: >
          PIÈGE DE MODÉLISATION : malgré son nom courant d'« autofattura », c'est de
          l'AUTO-FACTURATION au nom du vendeur, pas une autofattura propre. Le CedentePrestatore
          porte les données du FERMIER. La modéliser à côté des TD16–TD21 remplirait ce bloc avec la
          mauvaise partie.
      - key: documento_commerciale
        local: "Documento commerciale"
        en: "Commercial document (retail receipt)"
        what: "Ce que reçoit un client au détail depuis que les corrispettivi sont télématiques. Numéroté, contenu obligatoire, mais sans valeur fiscale pour l'acheteur sauf s'il porte son code fiscal."
        nature: legal
        obligation: mandatory
        source: "DM MEF 7 dicembre 2016, art. 2 lett. b) pour la numérotation"
        note: "L'émetteur n'a AUCUNE obligation de conserver les copies — contrairement aux anciennes ricevute."
      - key: ricevuta_scontrino
        local: "Ricevuta fiscale / scontrino fiscale"
        en: "Fiscal receipt / till receipt"
        what: "Les anciens justificatifs de détail."
        nature: legal
        obligation: mandatory
        source: "L. 249/1976 art. 8 ; L. 18/1983 ; DM 10 maggio 2019 art. 1 c. 2"
        note: >
          À NE PAS MODÉLISER COMME ABOLIS. Aucune norme ne les abroge : D.Lgs. 127/2015 art. 2 c. 5
          substitue le MODE d'accomplissement, et le DM 10 maggio 2019 les maintient en obligation
          vivante pour les catégories exonérées b-bis), c) et d). « Supprimés en 2020 » est faux aux
          bords.
      - key: ddt
        local: "Documento di trasporto (DDT)"
        en: "Delivery note"
        what: "Accompagne les biens. Contenu minimal : date, parties, éventuel transporteur, nature/qualité/quantité."
        nature: legal
        obligation: conditional
        source: "DPR 472/1996 art. 1 c. 3"
        note: "Non obligatoire en général depuis 1996 — mais NÉCESSAIRE pour avoir droit à la facturation différée et pour renverser les présomptions de l'art. 53."
      - key: fattura_proforma
        local: "Fattura proforma"
        en: "Pro forma invoice"
        what: "Demande de paiement commerciale, sans effet fiscal."
        nature: commercial
        obligation: optional
        source: "AdE FAQ n. 22 du 27/11/2018 — la présuppose comme « idonea documentazione » justifiant le report"
        note: >
          Sa non-fiscalité n'est affirmée EN TOUTES LETTRES par aucun document AdE trouvé ; elle
          découle de l'art. 21 c. 1 (un document est une facture par sa substance, pas par son titre)
          et de l'art. 6 c. 4 (émettre une facture rend la TVA exigible). Marqué comme inféré.
      - key: preventivo
        local: "Preventivo"
        en: "Quote / estimate"
        what: "Devis."
        nature: commercial
        obligation: conditional
        source: "DL 1/2012 art. 9 c. 4, modifié par L. 124/2017 art. 1 c. 150"
        note: >
          OBLIGATOIRE, par écrit ou sous forme numérique, pour les PROFESSIONS RÉGLEMENTÉES depuis
          le 29/08/2017. Aucune obligation trouvée en commerce B2B général, ni dans le Codice del
          consumo — dont le texte intégral a été recherché : le mot « preventivo » n'y apparaît
          jamais comme substantif.
      - key: fattura_accompagnatoria
        local: "Fattura accompagnatoria"
        en: "Invoice serving as transport document"
        what: "Une facture faisant office de document d'accompagnement."
        nature: legal
        obligation: forbidden
        source: "Circolare 225/E del 16/09/1996 §2.1 — « non avente peraltro natura accompagnatoria »"
        note: >
          A perdu sa fonction fiscale en 1996, PAS en 2019 comme le disent les sources secondaires.
          Aucun code TD ne lui correspond. Aucune décision AdE postérieure à 2019 ne la nomme :
          conclusion construite, non citée.
    open_questions:
      - id: it_testo_unico_2027
        what: "TOUT le DPR 633/1972 cité ci-dessus est abrogé au 2027-01-01 par le Testo Unico IVA (D.Lgs. 19 gennaio 2026, n. 10)."
        impact: "art. 21 → art. 72 ; art. 23 → art. 86 ; art. 26 → art. 92 ; art. 34 → art. 133 ; art. 19 → art. 56."
        note: >
          Recodification et non réforme — mais toute citation d'article du dépôt périmera à cette
          date, exactement comme les art. 289 bis / 290 français signalés dans FR-RATTACHEMENT.md §4.
          Deux changements de fond survivent au passage : « decreto che omologa » devient
          « sentenza », et « fallimento » devient « liquidazione giudiziale ».
      - id: it_percentuali_compensazione
        what: "Les pourcentages de compensation agricoles (art. 34 c. 1) n'ont PAS été sourcés."
        settled_by: "Texte consolidé du DM 26 gennaio 2016 et de ses modificatifs, plus la loi de finances de l'année de référence pour les majorations temporaires."
