# CORRECTION-ROUTES — P3-T01 : les voies de correction, par pays, chacune statuée et sourcée
#
# CE QUE C'EST. Une facture émise est immuable ; la corriger, c'est émettre un AUTRE document. Ce
# fichier recense LESQUELS, pays par pays, et pour chacun s'il est ouvert, requis ou interdit.
# Il alimente P3-T02 (portage dans le schéma de profil) et conditionne P3-T03 à P3-T05.
#
# CE QU'IL N'EST PAS. Une source de droit. Chaque case porte sa provenance :
#   repo          établi par le code de ce dépôt — vérifiable par lecture, PAS par le droit
#   sourced       établi contre une source primaire, avec référence, URL et date de consultation
#   unverified    PERSONNE ne l'a établi. À ne pas coder.
#
# Un `repo` n'est PAS un `sourced`. Sept profils sur huit portent aujourd'hui la même valeur
# `CREDIT_NOTE`, et la recherche documentaire en contredit déjà plusieurs : ce que le dépôt affirme
# est une donnée sur le dépôt, pas sur le droit.

meta:
  task: P3-T01
  updated: 2026-08-29
  status: en cours
  covered: []
  pending: [ FR, IT, PL, DE, ES, MX, US ]

# ─────────────────────────────────────────────────────────────────────────────
# LE VOCABULAIRE DES VOIES
#
# Abstrait par construction : aucune voie ne porte de nom de pays. `faktura korygująca` et
# `factura rectificativa` sont le MÊME axe (CORRECTIVE_INVOICE) sous deux droits ; les distinguer
# par leur nom local ramènerait un pays dans le code, ce que l'architecture interdit.
# ─────────────────────────────────────────────────────────────────────────────

routes:
  CREDIT_NOTE:
    what: Document séparé qui RÉDUIT ou annule, portant son propre numéro, transmis au destinataire.
    exists_in_code: true
    strategy: lifecycle/corrections.ts → CreditNoteStrategy

  DEBIT_NOTE:
    what: Document séparé qui AUGMENTE le montant dû.
    exists_in_code: false
    note: >
      DEBIT_NOTE existe comme DocumentKind mais PAS comme CorrectionModel. Si un pays le REQUIERT
      à la hausse — hypothèse à vérifier pour l'Italie — l'asymétrie hausse/baisse est inexprimable
      aujourd'hui.

  CORRECTIVE_INVOICE:
    what: Document qui AMENDE l'original par référence, sans être un avoir.
    exists_in_code: true
    strategy: lifecycle/corrections.ts → CorrectiveInvoiceStrategy
    note: Seule voie réellement construite de bout en bout (PL, mode KOR de fa-vat.ts).

  CANCEL_AND_REPLACE:
    what: Annuler l'original auprès de l'autorité, puis émettre un remplaçant.
    exists_in_code: true
    strategy: lifecycle/corrections.ts → CancelAndReplaceStrategy
    note: >
      DÉFAUT ÉTABLI PAR LECTURE. La stratégie est un `log.todo`, et AUCUN profil livré ne déclare
      `CANCEL_AND_REPLACE`. Or invoices.helpers.ts calcule
      `cancelAndReplace: canCancel && correctionModel === 'CANCEL_AND_REPLACE'` — donc l'affordance
      vaut `false` pour tous les pays, alors que le type est exporté, que le front le consomme et
      que les traductions existent. Le Mexique est justement le pays qui en a besoin, et son profil
      déclare `CREDIT_NOTE`.

  INTERNAL_CREDIT_NOTE:
    what: >
      Annulation purement comptable, NON transmise à l'autorité NI à l'acheteur. Ce n'est pas un
      avoir discret : c'est un avoir dont la transmission est INTERDITE.
    exists_in_code: false
    note: >
      Inexprimable aujourd'hui. Le modèle suppose qu'une correction produit un document qui part ;
      cette voie produit un document qui ne part pas. C'est l'objet de P3-T03.

  AUTHORITY_ANNULMENT:
    what: Demande d'annulation adressée à l'autorité contre un document déjà déposé ou dédouané.
    exists_in_code: partial
    note: >
      Porté par `cancellation: { allowed, requiresAuthorityAck, requiresBuyerConsent }`, PAS par
      `correctionModel`. C'est donc déjà un second axe — la preuve qu'un enum unique ne suffisait
      pas, faite par le code lui-même avant que la question soit posée.

  RESUBMIT_SAME_IDENTITY:
    what: Après rejet, renvoyer le document sous LES MÊMES date et numéro.
    exists_in_code: false
    note: >
      Ni une correction ni une annulation : le document rejeté n'a jamais existé en droit. C'est la
      sortie de `REJECTED`, aujourd'hui terminal (`REJECTED: {}`). Objet de P3-T04.

  ANNOTATED_DUPLICATE:
    what: >
      Le MÊME document, réémis surchargé d'une mention. Ni un avoir, ni une rectificative : la
      facture initiale reste la facture, on la renvoie annotée.
    exists_in_code: false
    discovered_by: recherche FR (2026-08-29)
    note: >
      Trouvée hors de la liste du plan. La France l'IMPOSE pour l'impayé — et y INTERDIT l'avoir.
      Inexprimable aujourd'hui : le modèle suppose qu'une correction crée un NOUVEAU document.

  LEDGER_ANNOTATION:
    what: Correction opérée dans les registres, SANS émettre aucun document.
    exists_in_code: false
    discovered_by: recherche IT (2026-08-29)
    note: >
      Trouvée hors de la liste du plan. Distincte de INTERNAL_CREDIT_NOTE, qui suppose au moins un
      document interne. Ici il n'y a aucun document du tout.

  NO_DOCUMENT_BY_LAW:
    what: >
      La taxe s'ajuste DE PLEIN DROIT au changement de base imposable. Aucun document n'est émis,
      aucun registre n'est annoté, et la position TVA bouge quand même.
    exists_in_code: false
    discovered_by: recherche DE (2026-08-29)
    note: >
      Distincte de LEDGER_ANNOTATION, qui suppose au moins une écriture. C'est la voie PAR DÉFAUT
      en Allemagne pour remises, rabais, créances irrécouvrables et annulations — et la modéliser
      en CREDIT_NOTE serait faux.

  COUNTERPARTY_OBJECTION:
    what: >
      La CONTREPARTIE détruit unilatéralement un document déjà émis en s'y opposant. Le document
      « perd l'effet d'une facture ».
    exists_in_code: false
    discovered_by: recherche DE (2026-08-29)
    note: >
      Sans analogue dans le vocabulaire du plan : ce n'est pas l'émetteur qui corrige. Et en
      Allemagne c'est « grundsätzlich unbefristet » — sans limite de temps.

# ─────────────────────────────────────────────────────────────────────────────
# CE QUE LE DÉPÔT DÉCLARE AUJOURD'HUI  (provenance: repo — lu, non établi en droit)
# ─────────────────────────────────────────────────────────────────────────────

product_today:
  provenance: repo
  read_at: 2026-08-29
  source: backend/src/compliance/profiles/data/*.ts
  shape: >
    `correctionModel` est UNE valeur par pays et par période, choisie dans un enum de trois. Le
    modèle ne peut pas dire « deux voies ouvertes », ni « celle-ci requise dans ce cas », ni
    « celle-là interdite ». P3-T01 part du principe inverse — c'est l'écart que la table mesure.
  declared:
    FR: { pre: CREDIT_NOTE, post_2026_09_01: CREDIT_NOTE, cancellation: allowed }
    IT: { pre: CREDIT_NOTE, post_2019_01_01: CREDIT_NOTE, cancellation: allowed + authorityAck }
    PL: { pre: CREDIT_NOTE, post_2026_02_01: CORRECTIVE_INVOICE, cancellation: forbidden + authorityAck }
    DE: { all: CREDIT_NOTE, cancellation: allowed }
    ES: { all: CREDIT_NOTE, cancellation: allowed }
    MX: { post_2022_01_01: CREDIT_NOTE, cancellation: allowed + authorityAck + buyerConsent }
    US: { all: CREDIT_NOTE, cancellation: allowed, immutableAfter: NEVER }
  already_contradicted:
    - country: ES
      by: LEGAL-DOCUMENTS.yaml (sourced 2026-08-29)
      what: >
        L'Espagne n'a PAS de cancel-and-replace (art. 15.4 RD 1619/2012) et corrige par
        `factura rectificativa` — un CORRECTIVE_INVOICE, pas un avoir. `CREDIT_NOTE` est douteux.
    - country: MX
      by: LEGAL-DOCUMENTS.yaml (sourced 2026-08-29)
      what: >
        DEUX voies, non interchangeables : le CFDI tipo E pour les MONTANTS, l'annulation avec
        substitution (TipoRelacion 04 puis motif 01) quand le DOCUMENT est faux. Et l'annulation
        est bornée à l'exercice d'émission. Une seule valeur ne peut pas porter ça.
    - country: US
      by: LEGAL-DOCUMENTS.yaml (sourced 2026-08-29)
      what: >
        Aucun instrument fédéral ni d'État trouvé pour la correction. Le credit memo américain est
        COMMERCIAL, sans identité fiscale. Déclarer `CREDIT_NOTE` donne à une pratique le statut
        d'une règle.

countries:

  FR:
    provenance: sourced
    consulted: 2026-08-29
    caveat: >
      Legifrance renvoie 403 aux requêtes automatisées : tout le CGI cité ici l'est via sa
      reproduction dans le BOFiP (doctrine opposable DGFiP), jamais de mémoire.
    headline: >
      L'avoir interne français est PROUVÉ, mot pour mot, et c'est la trouvaille qui commande P3-T03.
      Dossier de spécifications externes DGFiP/AIFE v3.2 du 30/04/2026, § 3.6.4 p. 60 :
      « Dans les cas des statuts "Refusée" ou "Rejetée", le fournisseur doit procéder à une
      annulation comptable (avoir interne). Cette opération ne doit pas générer de flux de données
      réglementaires (F1) au PPF. »
      La règle est RÉCENTE : absente de la v3.0 (18/12/2024), apparue en v3.1 (30/10/2025).
    routes:
      CREDIT_NOTE:
        status: open
        applies_to: Ventes résiliées ou annulées, rabais, remises, ristournes.
        basis: >
          Alternative explicite, pas voie unique : « la rectification des factures s'entend
          généralement SOIT de l'envoi d'une facture nouvelle annulant et remplaçant la précédente,
          SOIT [...] de l'envoi d'une note d'avoir ».
        source: "CGI art. 272, 1 ; CGI art. 289, I, 5 ; BOI-TVA-DED-40-10-20 § 60 et § 80"
      CREDIT_NOTE_ON_UNPAID:
        status: forbidden
        applies_to: Impayé pur — défaillance du débiteur.
        basis: >
          « ne saurait conduire [...] à notifier à son client défaillant un nouveau document
          mentionnant une somme différente de celle qui figure sur la facture initiale ».
          Et § 60 : « le non-paiement d'une facture n'appelle [...] aucune rectification ».
        source: "BOI-TVA-DED-40-10-20 § 110"
      DEBIT_NOTE:
        status: open
        caveat: Ouverte comme mécanisme ; son caractère OBLIGATOIRE est unverified.
        basis: >
          Pas d'instrument distinct en droit français : tout document qui augmente est une
          rectificative assimilée à une facture.
        source: "CGI art. 289, I, 5 ; BOI-TVA-DECLA-30-20-20-20 § 180"
      CORRECTIVE_INVOICE:
        status: open
        applies_to: Toute modification référencée de la facture initiale.
        basis: >
          « tout document ou message qui modifie la facture initiale et qui y fait référence de
          façon spécifique et non équivoque est assimilé à une facture ».
        source: "CGI art. 289, I, 5 ; mentions CGI ann. II art. 242 nonies A, I ; BOI-TVA-DECLA-30-20-20-20 § 180 et § 220"
      CANCEL_AND_REPLACE:
        status: open
        applies_to: Ventes annulées ou résiliées, rabais.
        basis: >
          Doit porter « référence exacte à la facture initiale et la mention expresse de
          l'annulation de celle-ci ».
        source: "BOI-TVA-DED-40-10-20 § 70 ; BOI-TVA-DECLA-30-20-20-20 § 240"
        gap: >
          La France l'autorise — et AUCUN profil du dépôt ne déclare CANCEL_AND_REPLACE, donc le
          bouton n'apparaît jamais.
      INTERNAL_CREDIT_NOTE:
        status: required
        transmission: forbidden
        applies_to: Statuts Refusée (210) et Rejetée (213).
        basis: Voir headline — citation intégrale.
        source: "Spécifications externes DGFiP v3.2, 30/04/2026, § 3.6.4 p. 60"
        caveat: >
          NUANCE QUI COMPTE, et qui n'a pas été comblée : la v3.2 prouve le non-envoi au PPF, PAS le
          non-envoi à l'ACHETEUR. Le volet acheteur n'est explicite que dans l'annexe Chorus Pro
          v1.1 (B2G) — « un avoir interne (à ne pas transmettre à l'acheteur) » — et dans les
          versions archivées v2.3/v2.4. Pour le B2B pur, la source qui trancherait est AFNOR
          XP Z12-014, payante et non lue.
      AUTHORITY_ANNULMENT:
        status: forbidden
        basis: >
          Inexistant : aucun flux « demande d'annulation ». L'annulation du F1 est une CONSÉQUENCE
          tirée par l'administration du statut du cycle de vie — « Le refus [...] est également
          transmis à l'administration fiscale, qui annule les données réglementaires ».
          Le statut AFNOR 220 « Annulée » est facultatif, hors socle obligatoire, et Chorus Pro ne
          le relaie pas : ce n'est PAS une voie de correction.
        source: "Spécifications externes v2.4 p. 56/59/61 ; annexe Chorus Pro v1.1 p. 46-47"
      RESUBMIT_SAME_IDENTITY:
        status: open
        scope: Étroit — deux cas seulement, et pour le NUMÉRO ; la DATE est unverified.
        applies_to: >
          (a) rejet portant sur la constitution du F1 à partir d'une facture conforme ;
          (b) refus pour erreur de routage seulement. Hors ces cas, NOUVEAU numéro imposé.
        basis: >
          « peut alors générer à nouveau le fichier [...] portant alors le même numéro de facture ».
        source: "Spécifications externes v3.2 § 3.6.9 p. 62 ; v2.4 p. 58 (routage) ; v2.4 p. 56 et 59 (nouveau numéro sinon)"
      ANNOTATED_DUPLICATE:
        status: required
        applies_to: Impayé — c'est la contrepartie du CREDIT_NOTE interdit ci-dessus.
        basis: >
          La rectification « consiste OBLIGATOIREMENT dans l'envoi d'un duplicata de la facture
          initiale [...] surchargées de la mention "Facture demeurée impayée pour la somme de ……
          euros (prix net) et pour la somme de …… euros (TVA correspondante) qui ne peut faire
          l'objet d'une déduction (CGI, art. 272)" ». Variante admise : un état récapitulatif des
          factures impayées par client. Le débiteur doit reverser la taxe dès réception.
        source: "CGI art. 272, 1 et al. 3 ; BOI-TVA-DED-40-10-20 § 110"
        gap: Voie inexprimable — le modèle suppose qu'une correction crée un nouveau document.
      LEDGER_ANNOTATION:
        status: unverified
        settled_by: Non recherchée pour la France.
    temporal:
      - date: 2026-09-01
        what: >
          Réception obligatoire pour TOUTES les entreprises ; émission pour les assujettis hors
          micro/TPE/PME. Le droit matériel TVA (CGI 272, 289 I 5, 242 nonies A) est INCHANGÉ —
          aucune disposition transitoire trouvée. Ce qui change est la couche de FLUX.
        source: "Spécifications externes v3.2 § 2.3.5 p. 10, visant l'art. 91 de la loi de finances pour 2024 n° 2023-1322"
      - date: 2027-09-01
        what: Émission obligatoire pour tous les assujettis.
    mandatory_statuses:
      set: [ 200 Déposée, 210 Refusée, 212 Encaissée, 213 Rejetée ]
      note: >
        Tout le reste est facultatif et « ne doit pas être transmis à l'administration fiscale ».
        Clé d'unicité : numéro de facture + SIREN + ANNÉE DE PRODUCTION.
        Notre profil déclare ['déposée','rejetée','refusée','encaissée'] — le même socle, en minuscules
        et sans les codes.
      source: "Spécifications externes v3.2, Tableau 8, p. 59-60 et note 109"
    open_questions:
      - id: fr_avoir_interne_acheteur_b2b
        what: Le volet « non transmis à l'acheteur » n'est établi qu'en B2G et dans des versions archivées.
        settled_by: AFNOR XP Z12-014 « Cas d'usage B2B » — payante ; un compte AFNOR gratuit suffirait peut-être.
      - id: fr_date_au_renvoi
        what: La DATE de la facture lors d'un renvoi après rejet n'est abordée par aucune version des spécifications.
        settled_by: XP Z12-014, ou une FAQ DGFiP/AIFE.
      - id: fr_debit_note_obligatoire
        what: Aucune disposition trouvée qui IMPOSE d'émettre un rectificatif à la hausse, contrairement au comma 1 italien.
        settled_by: BOI-TVA-DECLA-30-20-10 dans son intégralité, ou CGI art. 283.
      - id: fr_statuts_exhaustifs
        what: Les codes de statut 214-228 ne sont visibles que par la table de transcodage Chorus Pro.
        settled_by: AFNOR XP Z12-012 — même paywall.

  IT:
    provenance: sourced
    consulted: 2026-08-29
    headline: >
      L'ASYMÉTRIE EST CONFIRMÉE, et elle est inexprimable chez nous. Art. 26 DPR 633/72 comma 1 :
      « Le disposizioni degli articoli 21 e seguenti DEVONO ESSERE OSSERVATE, in relazione al
      maggiore ammontare » — la HAUSSE est une OBLIGATION. Comma 2 : « il cedente HA DIRITTO DI
      portare in detrazione » — la BAISSE est une FACULTÉ, que les commas 9 et 10 qualifient
      rétrospectivement de « facoltà ».
      Et l'Italie a AUSSI son avoir interne, après scarto : le piège n'était pas franco-français.
    routes:
      CREDIT_NOTE:
        status: open
        nature: Faculté, jamais obligation.
        applies_to: >
          Nullité, annulation, révocation, résolution, rescission « e simili » ; abbuoni et sconti
          contractuels ; impayé en procédure collective ou exécution infructueuse (comma 3-bis).
        basis: "« ha diritto di portare in detrazione » ; commas 9 et 10 : « la facoltà di cui al comma 2 »"
        source: "Art. 26 DPR 633/72, comma 2"
        deadlines:
          one_year: >
            Un an à compter de l'opération SI l'événement résulte d'un « sopravvenuto accordo fra
            le parti », ou s'il s'agit d'une rectification d'inexactitudes ayant donné lieu à
            l'art. 21 comma 7.
          unlimited: >
            Aucune limite pour nullité, annulation, révocation, résolution, rescission NON
            conventionnelles, ni pour le comma 3-bis.
          source: "Art. 26 comma 3"
      DEBIT_NOTE:
        status: required
        applies_to: TOUTE hausse de la base ou de la taxe, « per qualsiasi motivo », y compris rectification d'inexactitudes.
        basis: "« Le disposizioni degli articoli 21 e seguenti devono essere osservate, in relazione al maggiore ammontare »"
        source: "Art. 26 DPR 633/72, comma 1"
        gap: >
          DEBIT_NOTE existe comme DocumentKind mais PAS comme CorrectionModel. Une obligation
          déclenchée par la hausse est aujourd'hui inexprimable.
      CORRECTIVE_INVOICE:
        status: forbidden
        basis: >
          Inexistant. Aucun instrument d'amendement par référence : le provvedimento ne cadre les
          variations que comme note di credito ou di debito ex art. 26.
        source: "Provv. 89757/2018, punto 6.1"
        gap: >
          Notre profil italien déclare CREDIT_NOTE, ce qui n'est pas faux — mais il ne dit pas que
          la rectificative, elle, n'existe pas.
      CANCEL_AND_REPLACE:
        status: open
        scope: Après scarto UNIQUEMENT ; inexistant après livraison au destinataire.
        applies_to: >
          Si la réémission sous identité d'origine est impossible : soit nouvelle facture avec
          nouveaux numéro et date, liée à la facture scartata « stornata con variazione contabile
          interna » ; soit numérotation sectionnelle « 1/R », « 50/R ».
        source: "Circolare 13/E du 02/07/2018, § 1.6 p. 12"
      INTERNAL_CREDIT_NOTE:
        status: required
        transmission: forbidden
        applies_to: Après scarto SdI, si la facture avait déjà été comptabilisée.
        basis: >
          « viene effettuata – se necessario – una variazione contabile valida ai soli fini interni
          SENZA LA TRASMISSIONE DI ALCUNA NOTA DI VARIAZIONE AL SdI ».
        source: "Provv. 89757/2018, punto 6.3 ; repris circolare 13/E § 1.6 p. 11"
      AUTHORITY_ANNULMENT:
        status: forbidden
        basis: >
          Aucune procédure d'annulation dans le provvedimento — zéro occurrence de « annull- ».
          Punto 6.2 : « Le richieste del cessionario/committente [...] di variazioni [...] non sono
          gestite dal SdI ».
        source: "Provv. 89757/2018, punti 6.1 et 6.2"
        caveat: >
          Conclusion tirée par EXHAUSTIVITÉ du texte, pas par une phrase d'interdiction. Une
          risoluzione AdE explicite la confirmerait.
      RESUBMIT_SAME_IDENTITY:
        status: open
        nature: RECOMMANDÉ, PAS requis — « preferibilmente ».
        applies_to: Après scarto, dans les 5 jours de la notifica di scarto, sous les date et numéro d'origine.
        basis: >
          « la fattura [...] vada PREFERIBILMENTE emessa (ossia nuovamente inviata tramite SdI entro
          cinque giorni dalla notifica di scarto) con la data ed il numero del documento originario ».
          Rendu possible par le contrôle d'unicité : le doublon (00404/00409) n'est déclenché que si
          aucune ricevuta di scarto n'a été émise.
        source: "Circolare 13/E § 1.6 ; specifiche tecniche allegato A v1.6.3 p. 150"
        scarto_effect: >
          « La fattura elettronica [...] di cui al file scartato dal SdI SI CONSIDERA NON EMESSA ».
          La ricevuta di scarto arrive dans les 5 jours.
          Source : Provv. 89757/2018, punti 2.4 et 4.1.
      LEDGER_ANNOTATION:
        status: open
        applies_to: >
          Erreurs matérielles ou de calcul dans les registres et liquidations ; et les variations
          des commas 2, 3, 3-bis et 5 peuvent être opérées ainsi.
        basis: >
          « deve essere fatta mediante annotazione delle variazioni » (comma 7) ; « possono essere
          effettuate [...] anche mediante apposite annotazioni in rettifica [...] sui registri »
          (comma 8). Une correction SANS AUCUN DOCUMENT émis ni transmis.
        source: "Art. 26 DPR 633/72, commas 7 et 8"
      ANNOTATED_DUPLICATE:
        status: unverified
        settled_by: Non recherchée pour l'Italie.
    temporal:
      - date: 2027-01-01
        what: >
          BASCULE MAJEURE, non demandée mais décisive : l'art. 26 DPR 633/72 est ABROGÉ, remplacé
          par l'art. 92 de l'allegato au Testo unico IVA, au TEXTE IDENTIQUE — même asymétrie.
          Un profil temporel italien doit porter ce changement de référence.
        source: "D.Lgs. 19 gennaio 2026 n. 10, art. 170 (abrogation) et art. 171 (« si applicano a decorrere dal 1° gennaio 2027 »)"
    b2g_refusal:
      what: >
        Le refus B2G est SUBSIDIAIRE à la nota di variazione : « Le pubbliche amministrazioni non
        possono comunque rifiutare la fattura nei casi in cui gli elementi informativi possono
        essere corretti mediante le procedure di variazione di cui all'articolo 26 ». Et il est
        limité à 5 motifs énumérés.
      source: "DM 24 agosto 2020 n. 132, insérant l'art. 2-bis au DM 55/2013"
      note: >
        Asymétrie B2B/B2G à retenir : en B2B il n'y a PAS de rifiuto. Le contrôle d'unicité B2B ne
        rouvre le couple numéro/année qu'après une ricevuta di scarto, là où le B2G le rouvre aussi
        après une notifica di rifiuto.
    open_questions:
      - id: it_cinq_jours_forclusion
        what: Les « 5 jours » sont-ils un délai de forclusion ou une recommandation ? Aucune sanction rattachée trouvée.
        settled_by: Une risoluzione ou un interpello AdE postérieur, ou l'art. 6 comma 5-bis D.Lgs. 472/97.
      - id: it_delai_nota_di_debito
        what: >
          Le comma 1 renvoie aux « articoli 21 e seguenti » sans préciser de délai. Les 12 jours de
          l'art. 21 comma 4 seraient une DÉDUCTION, pas une lecture — donc non affirmés.
        settled_by: Une source AdE qui énonce le délai applicable à la nota di debito.
      - id: it_specs_version
        what: La version 1.6.3 des specifiche tecniche a été lue ; une plus récente peut exister.
        settled_by: La page AdE « fatturazione elettronica » — rendue en JS, non exploitable par requête simple.
      - id: it_circolare_apres_2027
        what: La circolare 13/E interprète des articles renumérotés (21→72, 26→92). Aucun acte de coordination lu.
        settled_by: Les dispositions de coordination du D.Lgs. 10/2026 art. 169, ou une circolare AdE de transition.


  PL:
    provenance: sourced
    consulted: 2026-08-29
    headline: >
      LA NOTA KORYGUJĄCA EST BIEN SUPPRIMÉE, au 2026-02-01, et la chaîne est complète : l'ustawa du
      16/06/2023 (Dz.U. 2023 poz. 1598) art. 1 pkt 15 dit « uchyla się art. 106k » ; l'ustawa du
      09/05/2024 (Dz.U. 2024 poz. 852) art. 1 pkt 6 lit. a remplace « z dniem 1 lipca 2024 r. » par
      « z dniem 1 lutego 2026 r. » ; et le texte consolidé imprime les DEUX versions avec la note
      « Art. 106k. (uchylony) ».
      CONSÉQUENCE POUR LE MOTEUR : à partir du 2026-02-01, l'ACHETEUR polonais n'a plus AUCUN
      instrument de correction. Tout part du vendeur.
    routes:
      CREDIT_NOTE:
        status: forbidden
        nature: Interdite EN TANT QUE DOCUMENT DISTINCT — pas interdite en substance.
        basis: >
          Il n'existe pas d'instrument séparé. L'art. 106j ust. 1 donne UN instrument pour les deux
          sens, et l'énumération FA(3) `RodzajFaktury` est fermée — {VAT, KOR, ZAL, ROZ, UPR,
          KOR_ZAL, KOR_ROZ} — sans type « avoir ».
        source: "Art. 106j ust. 1 ustawy o VAT ; broszura FA(3), Ministerstwo Finansów"
      DEBIT_NOTE:
        status: forbidden
        nature: Idem — même instrument unique.
        basis: >
          « podstawa opodatkowania lub kwota podatku wskazana w fakturze uległa zmianie » —
          neutre quant au SENS de la variation. Le remède est un KOR.
        source: "Art. 106j ust. 1 pkt 1"
        contrast: >
          Symétrie exactement inverse de l'Italie : la Pologne traite hausse et baisse par le MÊME
          document, l'Italie par deux documents dont un obligatoire et l'autre facultatif.
      CORRECTIVE_INVOICE:
        status: required
        applies_to: Les 5 cas de l'art. 106j ust. 1, dont pkt 5 — « stwierdzono pomyłkę w jakiejkolwiek pozycji faktury ».
        basis: >
          « podatnik WYSTAWIA fakturę korygującą » — obligation, pas faculté. Deux verrous de forme
          s'y ajoutent : ust. 2 pkt 2a impose d'y porter le numéro KSeF de la facture corrigée, et
          ust. 4 impose la forme structurée.
        source: "Art. 106j ust. 1, ust. 2 pkt 2a, ust. 4 (remplacé au 2026-02-01 par Dz.U. 2025 poz. 1203 art. 1 pkt 4)"
      CANCEL_AND_REPLACE:
        status: required
        applies_to: NIP de l'acheteur erroné.
        basis: >
          « należy wystawić fakturę korygującą "do zera" i nową fakturę pierwotną zawierającą
          poprawne dane ». À NOTER : exécuté AU MOYEN de factures correctives, jamais par une
          annulation. La voie existe, le mécanisme d'annulation non.
        source: "Podręcznik KSeF 2.0 cz. II, § 1.6.4 (06/08/2026)"
      INTERNAL_CREDIT_NOTE:
        status: forbidden
        applies_to: Toute facture acceptée par KSeF.
        basis: >
          « Po przesłaniu pliku faktury do KSeF nie jest możliwe jej edytowanie… Jedyną formą
          poprawienia błędu… jest wystawienie faktury korygującej w KSeF ».
        source: "Podręcznik KSeF 2.0 cz. II, § 1.6.2"
        contrast: >
          Opposé exact de la France et de l'Italie, qui l'IMPOSENT dans leurs cas de rejet. La même
          voie est requise ici et interdite là — c'est la meilleure justification du statut par
          pays plutôt que d'un modèle unique.
      AUTHORITY_ANNULMENT:
        status: forbidden
        basis: >
          « W KSeF nie jest możliwe anulowanie wystawionej faktury ». Corroboré par un NÉGATIF
          VÉRIFIÉ : la chaîne « anulow » apparaît ZÉRO fois dans le texte consolidé de l'ustawa o
          VAT (~1 Mo), et zéro fois dans la broszura FA(3). Aucun type d'annulation dans FA(3).
        source: "Podręcznik KSeF 2.0 cz. II, § 1.6.3 ; tekst jednolity Dz.U. 2025 poz. 775"
      RESUBMIT_SAME_IDENTITY:
        status: open
        applies_to: Après rejet du XML.
        basis: >
          Documenté par un EXEMPLE de l'administration : facture 7/02/2026 rejetée, corrigée,
          renvoyée le même jour sous le MÊME numéro, acceptée hors ordre chronologique — et
          « nie jest to… przesłanka zobowiązująca podatnika do wystawienia faktury korygującej, w
          celu poprawienia nadanego pierwotnie numeru faktury, wskazanego w polu P_2 ».
        source: "Podręcznik KSeF 2.0 cz. II, § 1.6.7 et Przykład 5"
      BUYER_CORRECTION_NOTE:
        status: forbidden
        since: 2026-02-01
        was: >
          Jusqu'au 2026-01-31 : ouverte, pour toute pomyłka SAUF les champs monétaires de l'art.
          106e ust. 1 pkt 8-15 (quantité, prix unitaire, remises, valeur nette, taux, totaux, taxe,
          total TTC), et sous réserve de l'acceptation de l'émetteur (art. 106k ust. 2).
        basis: Voir headline — chaîne complète en trois textes.
        source: "Dz.U. 2023 poz. 1598 art. 1 pkt 15 ; Dz.U. 2024 poz. 852 art. 1 pkt 6 lit. a ; Podręcznik § 1.6.2 ; FAQ Q73"
        transitional: >
          Art. 15 de l'ustawa de 2023 : les notes émises et non encore acceptées avant l'entrée en
          vigueur restent sous l'ancien régime.
      LEDGER_ANNOTATION:
        status: unverified
        settled_by: Non recherchée pour la Pologne.
    temporal:
      - date: 2026-02-01
        what: >
          Entrée en vigueur générale de la loi KSeF : c'est la bonne date pour le MODÈLE DE
          CORRECTION — abrogation de l'art. 106k et nouvelle rédaction de l'art. 106j ust. 4.
      - date: 2026-04-01
        what: >
          Mais PAS pour le canal de transmission. L'art. 145l laisse les assujettis dont les ventes
          2024 TTC n'excédaient pas 200 000 000 zł émettre encore en électronique ou papier du
          2026-02-01 au 2026-03-31. Le mandat ne mord vraiment qu'ici pour eux.
        source: "Dz.U. 2025 poz. 1203, art. 2 pkt 1 lit. o et pkt 5, remplaçant les art. 145l-145n"
      - date: 2026-12-31
        what: >
          Art. 145m : jusqu'à cette date, les assujettis facturant 10 000 zł ou moins par mois
          peuvent encore émettre en électronique ou papier — droit perdu « począwszy od faktury,
          którą przekroczono wartość ». Art. 145n : factures de caisse sur la même période.
      - date: 2027-01-01
        what: Entrée en vigueur des sanctions (art. 106ni ust. 1-3 et 5-7).
    repo_deltas:
      - flag: "cancellation.allowed: false depuis 2026-02-01"
        verdict: correct
        now_sourced_by: "Podręcznik § 1.6.3 + le négatif vérifié sur « anulow » + l'énumération fermée FA(3)"
      - flag: "cancellation.requiresAuthorityAck: true"
        verdict: infondé
        what: >
          Il n'existe aucune procédure d'annulation en Pologne, donc aucun accusé à attendre.
          NUANCE VÉRIFIÉE DANS LE CODE, contre l'analyse du sous-agent : le garde n'est PAS armé,
          car contributors.ts ne le monte que derrière `if (lc.cancellation?.allowed)` — et
          `allowed` est false. Le runtime n'attend donc rien et ne se bloque pas.
          Le défaut réel est ailleurs, et il est pire. invoices.service.ts:2172 pousse la
          condition `authorityAck` SANS vérifier `allowed`, et compliance-panels.tsx:76 rend toutes
          les conditions. L'écran polonais affiche donc, ensemble :
            « Cancellation is not available in this country — issue a credit note instead. »
            « It is not final until the tax authority acknowledges it. »
          Les DEUX sont fausses pour la Pologne. La première conseille un avoir, que la Pologne
          INTERDIT comme document distinct — le bon instrument est la faktura korygująca. La seconde
          promet un accusé d'autorité qui n'arrivera jamais.
          Et la première enferme un remède national dans une chaîne générique — un pays dans le
          code, ce que l'architecture interdit.
      - flag: "correctionModel: 'CORRECTIVE_INVOICE' depuis 2026-02-01"
        verdict: correct mais incomplet
        what: >
          C'est `required`, pas seulement disponible. Et il manque les deux verrous de forme :
          art. 106j ust. 4 (forme structurée imposée) et ust. 2 pkt 2a (numéro KSeF de l'original).
      - flag: "bascule temporelle unique au 2026-02-01"
        verdict: juste pour la correction, faux pour le canal
        what: >
          Une seule coupure force le canal KSeF sur des assujettis qui n'y étaient pas encore
          tenus — art. 145l jusqu'au 2026-03-31, art. 145m jusqu'au 2026-12-31.
    out_of_vocabulary:
      - name: "modes offline24 / awaria / niedostępność"
        what: >
          Voie légale d'émettre hors KSeF et de transmettre ensuite, où la date d'émission est le
          P_1 de l'assujetti, PAS la date de transmission. Fait doublon avec une resoumission sous
          même identité : un P_1 ANTÉRIEUR n'est pas un motif de rejet — la facture est reclassée
          offline24 — alors qu'un P_1 FUTUR l'est.
        source: "Art. 106nda, 106nf, 106nh ; Podręcznik § 1.6.1"
      - name: "nota księgowa"
        what: >
          Survit à KSeF mais reste hors TVA et hors KSeF. N'est PAS une voie de correction TVA —
          négatif explicite qui mérite d'être porté, car c'est précisément ce qu'on confondrait
          avec un INTERNAL_CREDIT_NOTE.
        source: "FAQ KSeF Q49, Q55"
      - name: "faktura korygująca zbiorcza"
        what: >
          Correction collective : l'élément DaneFaKorygowanej se répète jusqu'à 50 000 fois et peut
          couvrir des originaux émis dans ET hors KSeF dans un seul document.
        source: "Art. 106j ust. 3 ; FAQ Q24"
      - name: "TypKorekty"
        what: >
          Champ de cycle de vie sans équivalent ailleurs : 1 = la correction prend effet à la date
          de la facture ORIGINALE, 2 = à celle de la corrective, 3 = à une autre date, possiblement
          différente par ligne. Le document déclare lui-même sa période d'effet comptable.
    open_questions:
      - id: pl_anulowanie_pre_ksef
        what: >
          Le profil affirme `cancellation.allowed: true` AVANT le 2026-02-01. Négatif vérifié :
          « anulow » n'apparaît nulle part dans l'ustawa consolidée. La pratique pré-KSeF repose sur
          une doctrine administrative et jurisprudentielle (factures « nie wprowadzone do obrotu
          prawnego ») qui n'a pas pu être atteinte.
        settled_by: "Une interpretacja ogólna ou indywidualna sur eureka.mf.gov.pl, ou un arrêt NSA — bases en JS, non interrogeables."
      - id: pl_p1_en_mode_degrade
        what: Interaction entre le P_1 d'une corrective émise en awaria et l'art. 29a ust. 13b-13c non vérifiée.
        settled_by: "Art. 29a ust. 13a-13c dans sa version au 2026-02-01, lu autrement que sous forme modificative."

  DE:
    provenance: sourced
    consulted: 2026-08-29
    headline: >
      NOTRE PROFIL ALLEMAND EST FAUX SUR LES DEUX TABLEAUX. `de.ts:57` déclare `CREDIT_NOTE` ; or la
      voie allemande est la `Rechnungsberichtigung` — un document qui RÉFÉRENCE l'original et qui,
      détail révélateur, n'a même pas besoin de son propre numéro. Et pour un simple changement de
      base imposable, AUCUN document n'est requis du tout : la taxe s'ajuste de plein droit.
      UStAE 14.11 Abs. 4 : « Bei einer Änderung der Bemessungsgrundlage im Sinne von § 17 UStG…
      ist KEINE RECHNUNGSBERICHTIGUNG ERFORDERLICH ».
    routes:
      CREDIT_NOTE:
        status: open
        nature: Ouverte, jamais requise.
        applies_to: Réduction de la base imposable — Skonti, Nachlässe, Rückgängigmachung.
        basis: >
          « Ein Belegaustausch ist NUR für die in § 17 Abs. 4 UStG bezeichneten Fälle
          vorgeschrieben. Ein Beleg… KANN, MUSS ABER NICHT als umsatzsteuerliche Rechnung
          ausgestellt werden. »
        source: "UStAE 14.11 Abs. 4 S. 1 ; UStAE 17.1 Abs. 3a S. 4-5"
      CREDIT_NOTE_ALLOCATION:
        status: required
        applies_to: >
          Contrepartie modifiée conjointement sur des opérations taxées à des taux différents —
          Jahresboni. Un Beleg montrant la ventilation est alors imposé.
        source: "§ 17 Abs. 4 UStG"
      DEBIT_NOTE:
        status: unverified
        what: >
          Aucune catégorie allemande distincte trouvée. La voie opérante est § 17 Abs. 1 S. 1
          (neutre : « geändert ») plus une Rechnungsberichtigung. À noter côté acheteur : avec une
          taxe indiquée trop basse, il ne peut déduire la différence qu'une fois qu'il DÉTIENT une
          facture portant le montant correct.
        settled_by: "UStAE Abschnitt 17.1 dans son intégralité, ou un BMF-Schreiben sur les Entgelterhöhungen."
        source: "UStAE 15.2a Abs. 7 S. 16"
      CORRECTIVE_INVOICE:
        status: required
        nature: C'EST la voie allemande.
        applies_to: Facture à laquelle manquent les mentions des § 14 Abs. 4 / § 14a, ou dont les mentions sont `unzutreffend`.
        basis: >
          Seuls les éléments manquants ou faux doivent être envoyés. « Die Berichtigung muss durch
          ein Dokument erfolgen, das SPEZIFISCH UND EINDEUTIG AUF DIE RECHNUNG BEZOGEN ist » — et
          « EINE NEUE RECHNUNGSNUMMER FÜR DIESES DOKUMENT IST NICHT ERFORDERLICH ». Le renvoi de
          l'original n'est pas exigé. Seul l'émetteur peut corriger.
        source: "§ 31 Abs. 5 UStDV ; UStAE 14.11 Abs. 1 S. 2, 4, 5, 11 et Abs. 2 S. 1"
        gap: >
          Le fait que le document correctif n'ait PAS besoin d'un numéro propre est inexprimable :
          notre correctInvoice() appelle systématiquement numberingService.nextNumber().
      CANCEL_AND_REPLACE:
        status: open
        nature: Ouverte, et rétroactive.
        basis: >
          « Auch der Stornierung einer Rechnung nebst Neuausstellung einer sie ersetzenden Rechnung
          kann eine Rückwirkung beim Vorsteuerabzug zukommen » (BFH 22/01/2020 - XI R 10/17).
          LIMITE : plusieurs factures pour une même opération non marquées « Duplikat » ou « Kopie »
          entraînent la responsabilité § 14c sur CHACUNE.
        source: "UStAE 15.2a Abs. 7 S. 5 ; UStAE 14c.1 Abs. 4 S. 5"
      INTERNAL_CREDIT_NOTE:
        status: forbidden
        applies_to: Correction § 14c, lorsque la taxe a été mentionnée et la facture délivrée.
        basis: >
          La correction « erfolgt durch Berichtigungserklärung GEGENÜBER DEM LEISTUNGSEMPFÄNGER » et
          « Dem Leistungsempfänger muss eine hinreichend bestimmte, schriftliche Berichtigung
          TATSÄCHLICH ZUGEHEN ». Une correction qui ne parvient pas au destinataire ne vaut rien.
        source: "UStAE 14c.1 Abs. 7 S. 1-2"
      AUTHORITY_ANNULMENT:
        status: required
        nature: LA SURPRISE ALLEMANDE — un cas étroit, mais une vraie autorisation préalable.
        applies_to: >
          `Unberechtigter Steuerausweis` ; étendu au § 14c Abs. 1 S. 3. Également § 1 Abs. 1a et
          révocation de l'option § 9.
        basis: >
          Le montant dû « kann berichtigt werden, soweit die GEFÄHRDUNG DES STEUERAUFKOMMENS
          BESEITIGT worden ist », et « Die Berichtigung… ist beim FINANZAMT GESONDERT SCHRIFTLICH
          ZU BEANTRAGEN UND NACH DESSEN ZUSTIMMUNG… vorzunehmen ».
          Elle annule la TAXE, pas la facture — mais c'est bien une autorisation d'autorité qui
          conditionne le cycle de correction.
        source: "§ 14c Abs. 2 S. 3-5 UStG ; UStAE 14c.1 Abs. 11"
        gap: >
          Notre profil allemand déclare `requiresAuthorityAck: false`. Pour ce cas précis, c'est
          l'inverse — et l'Allemagne était le pays qu'on croyait sans autorité.
      RESUBMIT_SAME_IDENTITY:
        status: open
        basis: >
          « Es ist unschädlich, wenn die Datei zu einer E-Rechnung MEHRFACH ÜBERSANDT wird, solange
          es sich um dieselbe Rechnung handelt und die Übermittlung nur als inhaltlich identisches
          Mehrstück erfolgt. »
        source: "UStAE 14c.1 Abs. 4 S. 7 ; S. 6 pour les Mehrstücke identiques"
      NO_DOCUMENT_BY_LAW:
        status: open
        nature: C'est la voie PAR DÉFAUT en Allemagne, pas un cas marginal.
        applies_to: Remises, rabais, créances irrécouvrables, annulations — tout changement de base imposable.
        basis: >
          § 17 Abs. 1 UStG ajuste la taxe DE PLEIN DROIT, et l'UStAE dit expressément qu'aucune
          correction de facture n'est requise. Rien n'est émis, rien n'est transmis, et la position
          TVA bouge.
        source: "§ 17 Abs. 1 UStG ; UStAE 14.11 Abs. 4 ; UStAE 17.1 Abs. 3a"
        gap: La modéliser en CREDIT_NOTE serait faux — c'est exactement ce que fait le profil actuel.
      COUNTERPARTY_OBJECTION:
        status: open
        applies_to: Gutschrift — auto-facturation.
        basis: >
          Le FOURNISSEUR peut détruire une facture auto-émise en s'y opposant : elle « verliert die
          Wirkung einer Rechnung ». Effet à réception par l'émetteur de la Gutschrift, ex nunc pour
          la déduction, et « grundsätzlich UNBEFRISTET möglich » — sans limite de temps.
        source: "§ 14 Abs. 2 Satz 6 UStG ; UStAE 14.3 Abs. 4 S. 7, 8, 9"
      LEDGER_ANNOTATION:
        status: unverified
        settled_by: Non recherchée pour l'Allemagne — mais NO_DOCUMENT_BY_LAW en couvre l'essentiel du besoin.
    gutschrift_trap:
      correction_to_our_own_brief: >
        La référence § 14 Abs. 2 Satz 2 UStG, que j'avais donnée au sous-agent, est PÉRIMÉE. Depuis
        la refonte du § 14 Abs. 2 par le Wachstumschancengesetz, l'auto-facturation est au
        § 14 Abs. 2 SATZ 5. Le BMF-Schreiben du 15/10/2025 ne fait rien d'autre, sur une douzaine de
        sections de l'UStAE, que remplacer l'une par l'autre. Vérifié : le dépôt ne cite nulle part
        l'ancienne référence.
      rule: >
        « Unbeschadet der Verpflichtungen nach Satz 2 kann eine Rechnung von einem… LEISTUNGS-
        EMPFÄNGER FÜR EINE LIEFERUNG ODER SONSTIGE LEISTUNG DES UNTERNEHMERS ausgestellt werden,
        sofern dies VORHER VEREINBART wurde (Gutschrift). »
      the_two_meanings: >
        Séparées mot pour mot par l'UStAE 14.3 Abs. 2 S. 5 : « KEINE GUTSCHRIFT ist die im
        allgemeinen Sprachgebrauch ebenso bezeichnete Stornierung oder Korrektur der ursprünglichen
        Rechnung ».
      asymmetric_safety_valve: >
        « Wird in einem Dokument der Begriff "Gutschrift" verwendet, obwohl keine Gutschrift im
        umsatzsteuerrechtlichen Sinne… vorliegt (z. B. kaufmännische Gutschrift), führt ALLEIN DIE
        BEZEICHNUNG… NICHT zur Anwendung des § 14c UStG. »
        Donc : mal étiqueter un avoir commercial « Gutschrift » est inoffensif ; mais une vraie
        Gutschrift porte une mention OBLIGATOIRE (§ 14 Abs. 4 S. 1 Nr. 10), et l'obligation
        e-facturation s'y applique intégralement.
      two_engine_constraints: >
        UStAE 14.3 Abs. 2 S. 7 impose des factures électroniques SÉPARÉES quand un document mixte
        Gutschrift/Rechnung ne peut techniquement être combiné. Et S. 9 interdit la compensation :
        « In dem Dokument sind Saldierung und Verrechnung der gegenseitigen Leistungen UNZULÄSSIG. »
      source: "§ 14 Abs. 2 S. 5 et 6, § 14 Abs. 4 S. 1 Nr. 10 UStG ; UStAE 14.3 Abs. 2 et 14c.1 Abs. 3 S. 4 ; BMF-Schreiben 15/10/2025"
    retroactivity:
      verdict: OBLIGATOIRE, pas optionnelle — et c'est une donnée de cycle de vie, pas de forme.
      what: >
        « Eine Rechnungsberichtigung KANN auf den Zeitpunkt zurückwirken, in dem die Rechnung
        erstmals ausgestellt wurde », indépendamment du fait qu'elle joue au profit ou au détriment
        du destinataire — et surtout : « Sind diese Anforderungen erfüllt, entfaltet die
        Rechnungsberichtigung IMMER Rückwirkung. » Ce n'est pas un choix.
      threshold: Émetteur, destinataire, désignation de la prestation, contrepartie, TVA mentionnée séparément.
      exceptions: >
        Pas de rétroactivité : (a) facture émise sans TVA allemande sur l'hypothèse d'une opération
        étrangère (BFH 07/07/2022 - V R 33/20) ; (b) facture d'opération triangulaire à laquelle
        manquent les mentions du § 14a Abs. 7 (BFH 17/07/2024 - XI R 35/22).
      do_not_conflate: >
        DEUX rétroactivités distinctes. Le § 14 Abs. 4 Satz 4 UStG dit l'INVERSE pour la procédure :
        « Die Berichtigung einer Rechnung… ist KEIN RÜCKWIRKENDES EREIGNIS im Sinne von § 175… und
        § 233a… der Abgabenordnung. » Déduction TVA : rétroactive. Réouverture d'imposition et
        intérêts : non.
      source: "UStAE 15.2a Abs. 7 S. 4, 6, 8, 10, 14, 15 ; § 14 Abs. 4 S. 4 UStG ; BMF-Schreiben 18/09/2020"
    temporal:
      - date: 2025-01-01
        what: Réception obligatoire — le régime transitoire n'est rédigé que pour l'ÉMETTEUR.
      - date: 2027-01-01
        what: >
          Émission obligatoire pour tous, SAUF les émetteurs dont le Gesamtumsatz de l'année
          précédente n'excède pas 800 000 € (§ 27 Abs. 38 Nr. 2), et l'EDI sous consentement du
          destinataire (Nr. 3).
        source: "§ 27 Abs. 38 UStG"
      - date: 2028-01-01
        what: Émission obligatoire pour le palier des 800 000 € et pour l'EDI.
    format_lock:
      what: >
        LA CORRECTION D'UNE FACTURE ÉLECTRONIQUE DOIT ÊTRE ÉLECTRONIQUE, au même type de document :
        « Daher muss die Berichtigung einer E-Rechnung ebenfalls IN DER FÜR DIESE VORGESCHRIEBENEN
        FORM (unter Verwendung des entsprechenden Rechnungstyps) erfolgen. Eine Übermittlung der
        fehlenden oder unzutreffenden Angaben IN EINER ANDEREN FORM IST NICHT AUSREICHEND. »
        Symétrique du verrou polonais de l'art. 106j ust. 4 — deux pays, même contrainte, formulée
        dans des instruments de nature très différente.
      source: "UStAE 14.11 Abs. 1 S. 7-9, inséré par le BMF-Schreiben du 15/10/2025"
    repo_deltas:
      - flag: "correctionModel: 'CREDIT_NOTE' (de.ts:57)"
        verdict: faux sur deux points
        what: >
          La voie allemande est une Rechnungsberichtigung qui référence l'original — donc
          CORRECTIVE_INVOICE — et pour un pur changement de base imposable, aucun document n'est
          requis. `CREDIT_NOTE` décrit une voie qui est ouverte mais jamais obligatoire, et masque
          celle qui l'est.
      - flag: "cancellation.requiresAuthorityAck: false"
        verdict: faux dans le cas du § 14c Abs. 2
        what: >
          La correction d'un Steuerausweis injustifié exige une demande écrite au Finanzamt et son
          accord préalable. L'Allemagne, qu'on classait sans autorité, en a une.
    open_questions:
      - id: de_delai_accord_finanzamt
        what: Le § 14c Abs. 2 S. 5 pose l'exigence d'accord sans fixer de délai ni d'accord tacite.
        settled_by: "UStAE Abschnitt 14c.2 Abs. 5 et suivants — le besonderes Berichtigungsverfahren, localisé mais non lu intégralement."
      - id: de_bmf_18_09_2020
        what: Le BMF-Schreiben du 18/09/2020 sur la correction rétroactive n'est connu que par le renvoi de l'UStAE.
        settled_by: "Le PDF du BMF-Schreiben, ou BStBl I 2020, 976."

  US:
    provenance: sourced
    consulted: 2026-08-29
    headline: >
      Il n'existe AUCUNE voie de correction de droit aux États-Unis, parce qu'il n'existe aucune
      facture de droit. 26 U.S.C. § 6001 impose des REGISTRES, pas un DOCUMENT ; l'IRS écrit que la
      loi n'exige aucun type de registre particulier. Le credit memo américain est un usage
      commercial, sans identité fiscale, non déclaré à aucune autorité.
      C'est un négatif ÉTABLI, pas une recherche qui a échoué — et il vaut mieux que le
      `CREDIT_NOTE` que notre profil affirme aujourd'hui, qui donne à une pratique le rang de règle.
    routes:
      CREDIT_NOTE:
        status: open
        applies_to: Tout ajustement d'une vente antérieure.
        basis: >
          Aucun instrument fédéral ni d'État trouvé qui l'impose ou le régisse. Ouverte au sens où
          rien ne l'interdit, pas au sens où un texte l'organise.
        source: "IRS Pub 583 ; 26 U.S.C. § 6001 — négatif"
      DEBIT_NOTE:
        status: open
        applies_to: Idem, à la hausse.
        basis: Même négatif.
        source: "négatif"
      CORRECTIVE_INVOICE:
        status: open
        basis: Aucune forme prescrite, donc aucune forme interdite.
        source: "négatif"
      CANCEL_AND_REPLACE:
        status: open
        basis: >
          Rien à annuler auprès de personne : aucun document n'a été déposé. Réémettre est un acte
          purement privé.
        source: "négatif"
      INTERNAL_CREDIT_NOTE:
        status: open
        basis: >
          C'est en réalité le cas NORMAL aux États-Unis : toute correction est interne, puisque
          rien n'est transmis à une autorité.
        source: "négatif"
      AUTHORITY_ANNULMENT:
        status: forbidden
        basis: >
          Sans objet, et c'est un `forbidden` structurel, pas une interdiction : il n'existe aucune
          autorité destinataire à qui adresser une annulation.
        source: "absence de tout portail fiscal de facturation — négatif"
      RESUBMIT_SAME_IDENTITY:
        status: forbidden
        basis: Sans objet — aucun rejet possible, aucun système ne reçoit la facture.
        source: "négatif"
    caveats:
      - >
        Le négatif fédéral est solide. Le négatif INFRA-NATIONAL ne l'est pas : seuls New York, la
        Californie et le Texas ont été vérifiés sur la question de la facture. New York impose
        d'afficher la taxe séparément là où la Californie ne l'impose pas — deux États, deux règles,
        un seul `countryCode`. Rien ne dit qu'aucun des 47 autres n'organise la correction.
      - >
        La facture douanière à l'IMPORT (19 CFR 141.83) est le seul document facture obligatoire de
        droit fédéral. Sa correction n'a pas été recherchée et sort du périmètre de P3-T01.
    open_questions:
      - id: us_correction_etats
        what: Aucun des 47 États non vérifiés n'a été examiné sur la correction de facture.
        settled_by: Un balayage des codes de vente-taxe des États restants — hors périmètre de P3-T01.

