# FRONT-CONTRACT — what the interface must do, per country
#
# GENERATED FILE. Do not edit by hand; run:
#     cd backend && npx ts-node scripts/front-contract.ts
#
# WHAT THIS IS. Input to the front-end design, and to phase 3. It answers, per country, "what must
# the screen do differently here?" — ordered by how much this product needs the country, France
# first.
#
# WHERE THE VALUES COME FROM. Every one is READ from src/compliance/profiles/data/*.ts, the sourced
# and temporal country rules the engine itself uses, resolved as of 2026-10-01
# (post-mandate, so France shows its e-invoicing shape). `from:` names the exact field. Nothing here
# is typed in from memory, because a second hand-written per-country document would drift from the
# profiles the day after it was written — and would invite filling forty countries with plausible
# prose nobody sourced, which is the failure this audit exists to correct.
#
# HOW TO READ AN ENTRY
#   value:          the machine answer, from the profile
#   ui:             what the screen must therefore do. This sentence is a DESIGN statement, derived
#                   mechanically from the value. It is not legal advice.
#   from:           provenance — a profile field, or one of:
#                     unverified    nobody has established this; the profile has no rule
#                     not-modelled  the schema cannot express it yet
#                     fallback-profile  this country has no real profile, only the generic fallback
#   open_question:  present whenever value is null. THESE ARE THE POINT. A null is not a gap in this
#                   document, it is a gap in what anyone has verified, and no screen may be designed
#                   against it until it is sourced (P3-T01).
#
# A WARNING ABOUT CONFIDENCE. `profile.confidence` below is the profile's own self-assessment.
# OFFICIAL means the rules were sourced; anything else means they were inferred from an archetype.
# Five countries are bespoke (FR, IT, PL, MX, US); the rest inherit defaults that are plausible and
# largely unverified. Treat a non-OFFICIAL country as a starting point for research, not an answer.
as_of: "2026-10-01"
countries:
  FR:
    priority: 1
    why_this_rank: primary market; mandate 2026-09-01 reception, staged issuance
    display_name: France
    profile:
      confidence: OFFICIAL
      is_fallback: false
    invoice_modification:
      value: CREDIT_NOTE
      ui: >-
        An issued invoice is never edited. Correcting it means issuing a separate credit note that
        references it, so the screen needs a dedicated credit-note flow and must refuse in-place
        edits.
      from: profiles/data/fr.ts → lifecycle.correctionModel
    editable_after_issue:
      value: ISSUE
      ui: >-
        The document freezes at issue. After that the edit form must be closed and replaced by the
        correction flow above.
      from: profiles/data/fr.ts → lifecycle.immutableAfter
    invoice_cancellation:
      value:
        allowed: true
        requiresAuthorityAck: false
      ui: Cancellation exists as its own action, distinct from correction.
      from: profiles/data/fr.ts → lifecycle.cancellation
    numbering_control:
      value: GAPLESS_SELF
      ui: >-
        The app allocates the number and the series must have no holes. The user must NOT be able to
        type, skip or reuse a number, and a failed issuance must not burn one silently. The series
        is hash-chained, so any renumbering after the fact is impossible by design.
      from: profiles/data/fr.ts → numbering.model
    zero_rate_declaration:
      value: false
      ui: >-
        There is no zero rate, so a 0% line is an exemption or out of scope. The screen MUST let the
        user state which, and a reason, or issuance is refused (BR-E-10).
      from: profiles/data/fr.ts → taxSystem.hasDomesticZeroRate
    archival:
      value:
        years: 10
        residency: null
        form: BOTH
      ui: >-
        Documents are kept 10 years. The screen should say so where a user might otherwise delete
        something.
      from: profiles/data/fr.ts → archival
    transmission:
      value:
        - PDP
        - GOV_PORTAL_API:choruspro
        - PEPPOL
        - EMAIL
        - PDP
        - EMAIL
      ui: >-
        The user must connect these channels in settings before an invoice can leave the product. A
        country whose channel is not connected should say so before issuance, not at send time.
      from: profiles/data/fr.ts → transmission[].channels
    regime:
      value: REAL_TIME_REPORTING
      ui: Regime model in force at 2026-10-01.
      from: profiles/data/fr.ts → regime.model
    obligation_layers:
      value:
        - layer: ISSUANCE
          deadline:
            value: 24
            unit: HOURS
        - layer: RECEPTION
          deadline:
            value: 24
            unit: HOURS
        - layer: ARCHIVAL
          deadline:
            value: 6
            unit: YEARS
      ui: >-
        Issuance, reception and archival have separate triggers and deadlines; the screen must not
        present them as one switch.
      from: profiles/data/fr.ts → obligations[]
    rejection_recovery:
      value: null
      ui: null
      from: not-modelled
      open_question: >-
        What may a user do after the authority REJECTS an invoice — resubmit under the same number,
        correct, or cancel? `REJECTED` is a terminal state in the runtime today (F-007 / D1), so no
        screen can be designed for this until the routes are sourced per country (P3-T01).
    buyer_identifiers_required:
      value:
        - LEGAL_ID
      ui: The client form must require these before an invoice can be issued to that client.
      from: profiles/data/fr.ts → requiredIdentifiers
