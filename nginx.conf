server {
    listen 80;

    # Defense-in-depth headers absent until now — neither Nest (no `helmet()`, see main.ts) nor this
    # file added any. Set once at the `server` level, not per-`location`: nginx does NOT merge
    # `add_header` from an outer block into an inner one that declares its own, so every `location`
    # below (the SPA and the `/api` proxy alike) would need its own copy if declared there instead.
    # Applying to `/api` too is deliberate, not incidental: the invoice/quote PDF routes
    # (`documents.controller.ts`, `client-portal/portal.controller.ts`,
    # `documents/public/public-documents.controller.ts`) serve `Content-Disposition: inline` under
    # this same prefix, and those are exactly the responses `frame-ancestors`/`X-Frame-Options` below
    # need to reach — a signing/portal page framed by a third-party site is the clickjacking risk this
    # closes, not merely the SPA shell.
    #
    # CSP directives, and why each one is what it is — read against how this SPA actually loads
    # (dist/index.html has no inline <script>, frontend/src/index.css self-hosts every font, nothing
    # in frontend/src calls a third-party API directly):
    #   default-src 'self'   — safe fallback for any directive not listed below.
    #   script-src 'self'    — the Vite production build emits ONLY external, hashed `<script>` tags
    #                          (verified in dist/index.html) — no inline script, so no `unsafe-inline`
    #                          needed, and none of the CDN allowances an artifact page would need: this
    #                          is a same-origin single-page app, not a page pulling in the sanctioned
    #                          CDNs elsewhere in this stack's tooling.
    #   style-src 'self' 'unsafe-inline' — Radix UI's positioning/animation primitives and plain React
    #                          `style={{...}}` usage across the app write inline `style="..."`
    #                          attributes at runtime; banning them outright (nonces/hashes for every
    #                          such attribute) is not realistic for a component library this app
    #                          doesn't own. Inline STYLE injection cannot execute script, unlike
    #                          `script-src`, which stays locked down with no such exception.
    #   font-src 'self'      — every font is self-hosted via @fontsource, bundled into dist/assets by
    #                          Vite (see frontend/src/index.css) — no Google Fonts, no other font CDN.
    #   img-src 'self' data: blob: — the branding logo and any downloaded document preview are
    #                          fetched authenticated then rendered via `URL.createObjectURL` (a
    #                          `blob:` src, see branding.settings.tsx); `data:` covers any inline
    #                          raster/SVG a component embeds directly.
    #   connect-src 'self'   — every `fetch`/`EventSource` (the document-events and log SSE streams)
    #                          targets this SAME origin's `/api/...`; nothing in the frontend calls out
    #                          to a third-party API directly (Stripe/PayPal/Mollie/Polar checkout is a
    #                          full top-level `window.location`/`window.open` redirect, never an
    #                          in-page `fetch` — see billing.settings.tsx/portal/index.tsx — so it is
    #                          NOT a `connect-src`/`frame-src` concern at all).
    #   frame-src 'self'     — the one iframe this app renders (the branding HTML preview) uses
    #                          `srcDoc` with `sandbox="allow-same-origin"` and no `allow-scripts`; no
    #                          page here embeds a cross-origin URL in a frame.
    #   worker-src 'self'    — the PWA service worker (vite-plugin-pwa/workbox, dist/sw.js) is
    #                          same-origin; stated explicitly rather than relied on via fallback.
    #   frame-ancestors 'none' — this app (and the PDF/portal routes above) must never be embeddable
    #                          BY another site — the actual clickjacking fix; `X-Frame-Options: DENY`
    #                          below is the same rule for browsers that predate CSP's own directive.
    #   object-src 'none'    — no <object>/<embed>/plugin content anywhere in this app.
    #   base-uri 'self'      — a `<base>` tag injected by a future XSS could otherwise redirect every
    #                          relative script/asset URL on the page to an attacker's origin.
    #   form-action 'self'   — every real <form> in this app posts to itself; nothing here submits a
    #                          form cross-origin (payment/billing redirects are JS navigation, not a
    #                          form submit, so they are unaffected by this directive).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    # Legacy fallback for the same anti-clickjacking rule `frame-ancestors` above already states —
    # browsers that support CSP Level 2 use `frame-ancestors` and ignore this; kept for the ones that
    # don't.
    add_header X-Frame-Options "DENY" always;
    # Stops a browser from re-interpreting a response's declared Content-Type (e.g. a user-uploaded
    # attachment or the branding logo) as something executable — the classic MIME-sniffing XSS vector.
    add_header X-Content-Type-Options "nosniff" always;
    # Never leaks this app's own URLs (which carry cuids, tokens in query strings on a few legacy
    # links) to a THIRD-PARTY destination's server logs via the Referer header on an outbound link;
    # still sent in full between pages on this SAME origin, where it is harmless.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # This app uses none of these browser features anywhere — denying them outright is a no-op for
    # normal use and closes off a class of embedding-abuse (a framed page silently turning on a
    # visitor's camera/mic/geolocation) that `frame-ancestors` alone doesn't address for every browser.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS is opt-in via ENABLE_HSTS at container start (entrypoint.sh rewrites the line below),
    # never hard-coded here: this same nginx.conf ships to every self-hosted instance, and a chunk of
    # them sit behind Cloudflare or another reverse proxy terminating TLS in front of this container —
    # nginx itself then only ever sees plain HTTP from that proxy. Sending HSTS unconditionally from a
    # container that cannot know whether HTTPS is actually reachable on this host risks locking out an
    # instance's own domain if TLS is misconfigured or ever needs to be temporarily disabled — HSTS has
    # no per-request undo. `preload` is deliberately never added: submission to the browser preload
    # list is a one-way door this image has no business opting an operator's domain into.
    # __HSTS_HEADER__

    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:3000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The "second proxy hop" fix: APPEND via $proxy_add_x_forwarded_for rather than overwrite
        # with bare $remote_addr. This container's
        # nginx is not always the ONLY hop any more (a self-hosted operator's own reverse proxy/CDN,
        # or the Helm chart's own Ingress both add one) — overwriting would DESTROY whatever a real
        # upstream proxy already recorded as the true client address, replacing it with that
        # proxy's own address instead, which is exactly the bug this whole fix exists to close.
        # Appending is NOT a spoofing regression: Express's own `trust proxy` count
        # (TRUST_PROXY_HOPS, backend/src/lib/trust-proxy.ts, read in create-app.ts) decides how many
        # entries of this chain are trusted, walking BACKWARD from the entry nginx itself appends
        # here (always last, always nginx's own directly-observed peer — never something a client
        # can inject). With the default count of 1 hop (no extra proxy in front), that walk reads
        # ONLY this last entry, so a client attempting to prefix a fake address into
        # X-Forwarded-For before it ever reaches nginx has exactly as little effect as it did when
        # this line overwrote the header outright — the difference only matters, and only helps,
        # once TRUST_PROXY_HOPS is raised to match a real additional hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }
}