# Scaled ("giga") deployment overlay — adds a dedicated, horizontally-scalable compliance
# worker service and flips the API container to WORKER_INLINE=false so it only *enqueues*
# (never consumes) queue jobs.
#
# Same image as the API (no second Dockerfile — the entrypoint.sh ROLE switch picks the
# worker code path, see QUEUE_IMPL_PLAN.md §7.3/§7.4). Migrations remain API-only
# (backend/src/prisma/sync-schema.ts, ROLE=api); the worker waits on the API's healthcheck
# so it never races a migration.
#
# Usage (merge on top of the base compose file):
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --scale worker=3
#
# Or with Swarm/`deploy.replicas`, run `docker stack deploy` instead of `up`.

services:
  invoicerr:
    environment:
      - WORKER_INLINE=false
      - BETTER_AUTH_SECRET="your_better_auth_secret" # Required, generate with: openssl rand -base64 32, falls back to JWT_SECRET if unset
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  worker:
    image: ghcr.io/invoicerr-app/invoicerr:latest
    environment:
      - ROLE=worker
      - DATABASE_URL=postgresql://invoicerr:invoicerr@invoicerr_db:5432/invoicerr_db
      - BETTER_AUTH_SECRET="your_better_auth_secret" # Required, generate with: openssl rand -base64 32, falls back to JWT_SECRET if unset
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      invoicerr:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3001"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    restart: unless-stopped
    deploy:
      replicas: 3
