# Scaled ("giga") deployment overlay — adds a dedicated, horizontally-scalable document-action
# queue worker service and flips the API container to WORKER_INLINE=false so it
# only *enqueues* (never consumes) queue jobs.
#
# Same image as the API (no second Dockerfile — the entrypoint.sh ROLE switch picks the
# worker code path). Migrations remain API-only (backend/src/prisma/sync-schema.ts, ROLE=api);
# the worker waits on the API's healthcheck so it never races a migration.
#
# Usage (merge on top of the base compose file):
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --scale worker=3
#
# Or with Swarm/`deploy.replicas`, run `docker stack deploy` instead of `up`.

services:
  invoicerr:
    environment:
      - WORKER_INLINE=false
      - BETTER_AUTH_SECRET=CHANGE_ME_generate_with_openssl_rand_hex_32 # Required; the backend refuses to boot in production on a placeholder. Falls back to JWT_SECRET if unset.
      # Same value as the worker below — see that service's own comment for why it must match.
      - CREDENTIALS_ENCRYPTION_KEY=CHANGE_ME_generate_with_openssl_rand_hex_32
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  worker:
    image: ghcr.io/invoicerr-app/invoicerr:latest
    environment:
      - ROLE=worker
      - DATABASE_URL=postgresql://invoicerr:invoicerr@invoicerr_db:5432/invoicerr_db
      - BETTER_AUTH_SECRET=CHANGE_ME_generate_with_openssl_rand_hex_32 # Required; falls back to JWT_SECRET if unset.
      # MUST be byte-for-byte the same value as the `invoicerr` service above. This container is the
      # one that actually runs a queued "send", and a send reads the company's own channel
      # credentials — which are encrypted at rest with this key. A worker without it, or with a
      # different one, cannot decrypt them: the API would accept the credentials and the worker
      # would fail to use them, which is the worst place for the two halves to disagree.
      - CREDENTIALS_ENCRYPTION_KEY=CHANGE_ME_generate_with_openssl_rand_hex_32
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      invoicerr:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3001"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    restart: unless-stopped
    deploy:
      replicas: 3
