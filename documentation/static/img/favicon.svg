<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16" fill="none"><!-- Same rule BrandMark's currentColor already applies in-app (brand-mark.tsx): ink on a light
     ground, écume (foam) on a dark one, never azure-on-azure. This file is fetched by the browser
     chrome directly as a favicon, outside the page's DOM, so it can't read index.css's foreground
     custom properties and needs its own literal light/dark pair instead. #0f1f2a is the fixed brand
     ink already used across brand/*.svg (kept exact, not redrawn); #ebeff2 is dark mode's
     foreground/sidebar-foreground tokens (oklch(0.950 0.006 230), computed OKLCH to sRGB, not
     eyeballed, same method as the theme-color meta pair below in index.html) so a dark browser tab
     still gets a legible mark without ever landing on pure white. --><style>.fv-mark{fill:#0f1f2a}@media (prefers-color-scheme: dark){.fv-mark{fill:#ebeff2}}</style><defs><clipPath id="fv-a-fav" transform="translate(32 32) rotate(19.3)"><rect x="-1000" y="-1000" width="995" height="2000"/></clipPath><clipPath id="fv-b-fav" transform="translate(32 32) rotate(19.3)"><rect x="-1" y="-1000" width="1001" height="2000"/></clipPath></defs><g clip-path="url(#fv-a-fav)"><path class="fv-mark" d="M20 10H44A10 10 0 0 1 54 20V44A10 10 0 0 1 44 54H20A10 10 0 0 1 10 44V20A10 10 0 0 1 20 10Z"/></g><g clip-path="url(#fv-b-fav)"><path class="fv-mark" d="M20 10H44A10 10 0 0 1 54 20V44A10 10 0 0 1 44 54H20A10 10 0 0 1 10 44V20A10 10 0 0 1 20 10Z"/></g></svg>
