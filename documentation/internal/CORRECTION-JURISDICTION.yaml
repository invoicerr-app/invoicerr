# CORRECTION-JURISDICTION — P3-U01 : quelle loi gouverne une correction transfrontalière ?
#
# CE QUE C'EST. P3-T01 a sourcé chaque pays ISOLÉMENT. Dès que l'émetteur et le destinataire
# diffèrent, aucune de ces réponses ne dit laquelle s'applique. Ce fichier comble ce trou — et sans
# lui, composer deux profils reviendrait à inventer une règle fiscale.
#
# CE QU'IL N'EST PAS. Une matrice de code. 7 pivots font 49 paires ; 108 pays en feraient 11 664,
# qu'aucun relecteur ne pourrait auditer. L'énumération ci-dessous est une ANALYSE ; le moteur devra
# composer, comme tax-engine.ts compose déjà vendeur et acheteur.

meta:
  task: P3-U01
  updated: 2026-08-29
  status: règle de rattachement établie ; PL et DE tranchés ; MX corroboré mais non établi
  covered: [ UE, FR, IT, PL, DE ]
  pending: [ ES, MX ]
  access_note: >
    eur-lex et curia sont derrière un WAF depuis ce réseau. Les textes UE viennent du CELLAR de
    l'Office des publications — même contenu officiel, autre point d'entrée. Legifrance renvoie 403 ;
    le CGI est cité via le BOFiP, doctrine opposable, recoupé sur deux versions.

# ─────────────────────────────────────────────────────────────────────────────
# LA TROUVAILLE QUI COMMANDE LE MODÈLE
# ─────────────────────────────────────────────────────────────────────────────

four_attachments:
  headline: >
    IL Y A QUATRE RATTACHEMENTS DISTINCTS, ET NOTRE MOTEUR N'EN CONNAÎT QU'UN. Ils divergent
    systématiquement dès qu'il y a autoliquidation : le document se rédige selon le droit du
    FOURNISSEUR, mais le droit de réduire la base et son délai relèvent de l'État D'IMPOSITION.
  layers:
    A_invoicing_rules:
      what: Obligation d'émettre, contenu, délais, simplifications — et le document de correction.
      attached_to: Art. 219 bis — le plus souvent l'État du FOURNISSEUR en B2B transfrontalier.
      source: "Directive 2006/112/CE art. 219 bis"
      our_engine: >
        VÉRIFIÉ DANS LE CODE : compliance-engine.ts:333 fait
        `pickByDate(sp.lifecycle, ...)` où `sp` est le profil du FOURNISSEUR (ligne 231).
        Nos correctionRoutes suivent donc déjà le fournisseur — correct sur le cas dominant, et par
        construction, pas par chance.
    B_substantive_vat:
      what: Réduction de la base imposable, ses conditions et ses DÉLAIS ; régularisation chez le client.
      attached_to: L'État D'IMPOSITION de l'opération.
      source: "Art. 90 §1 (« dans les conditions déterminées par les États membres ») ; art. 185 §1"
      our_engine: >
        ÉCART RÉEL. Le délai d'un an italien pour une nota di credito résultant d'un accord (art. 26
        comma 3) est une règle de BASE IMPOSABLE, donc de l'État d'imposition — et nous le portons
        sur le profil du fournisseur avec le reste. Pour une prestation IT→DE en autoliquidation,
        c'est l'Allemagne qui commande ce délai, pas l'Italie.
    C_channel_and_mandate:
      what: Mandat de facturation électronique, canal national (SdI, PPF, KSeF), reporting.
      attached_to: L'ÉTABLISSEMENT — ni A, ni B.
      source: >
        Décisions d'exécution : FR (UE) 2022/133 art. 1er « taxable persons ESTABLISHED in the
        French territory » ; IT (UE) 2018/593 modifiée par 2021/2251, même formule ; PL (UE)
        2022/1003 ; DE idem. Et ViDA (dir. (UE) 2025/516 art. 1 pt 2) pérennise la borne :
        « exiger des assujettis ÉTABLIS SUR LEUR TERRITOIRE… pour les opérations effectuées SUR LEUR
        TERRITOIRE, AUTRES QUE CELLES VISÉES À L'ARTICLE 262 ».
      rule_we_can_use: >
        RÈGLE EXPLOITABLE, ET NETTE : un fournisseur NON ÉTABLI n'est jamais dans le champ du canal
        national. Et un mandat domestique ne peut pas couvrir les opérations intra-UE de l'art. 262.
      our_engine: >
        Le canal vient aussi du profil fournisseur, ce qui coïncide avec l'établissement dans le cas
        courant. Mais nous n'avons aucune notion d'« établi » distincte de « pays de la société », ni
        d'exclusion des opérations intra-UE du canal domestique.
    D_archival:
      what: Conservation des factures.
      attached_to: HORS du champ de 219 bis — son §3 l'exclut expressément.
      source: "Art. 219 bis §3 renvoyant aux art. 244-248 ; art. 247 §1"
      our_engine: >
        Nous le prenons sur le profil fournisseur (compliance-engine.ts:334). Ce n'est pas ce que dit
        l'art. 247 §1. Écart à instruire, pas encore chiffré.

# ─────────────────────────────────────────────────────────────────────────────
# LA RÈGLE DE RATTACHEMENT
# ─────────────────────────────────────────────────────────────────────────────

rule:
  article: "Directive 2006/112/CE art. 219 bis"
  history: >
    Inséré par la directive 2010/45/UE (applicable 2013-01-01), puis ENTIÈREMENT REMPLACÉ par la
    directive (UE) 2017/2455 art. 2 pt 2, dont l'application a été repoussée au 2021-07-01 par la
    décision (UE) 2020/1109 (COVID). Version consolidée 02006L0112-20250101, marqueur M16.
  rationale: >
    Considérant 5 de la directive 2010/45/UE : « To provide legal certainty for businesses regarding
    their invoicing obligations, it should be clearly stated which Member State's invoicing rules
    apply. »
  principle:
    id: P
    basis: "219 bis §1"
    condition: Cas général.
    governs: État membre du LIEU DE L'OPÉRATION (titre V).
  exceptions:
    - id: E1
      basis: "219 bis §2 a) i)"
      condition: >
        Fournisseur non établi dans l'État d'imposition (ou son établissement local n'intervient pas,
        art. 192 bis b) ET le preneur est le redevable (autoliquidation).
      governs: État du SIÈGE ou de l'établissement stable du FOURNISSEUR.
    - id: E1bis
      basis: "219 bis §2 a) i), in fine"
      condition: Même cas, mais AUTOFACTURATION par le client.
      governs: Retour au principe — État du lieu de l'opération.
    - id: E2
      basis: "219 bis §2 a) ii)"
      condition: Opération réputée NON effectuée dans l'UE.
      governs: État du siège ou de l'établissement stable du fournisseur.
    - id: E3
      basis: "219 bis §2 b)"
      condition: Fournisseur usant d'un régime particulier du titre XII ch. 6 — OSS UE, non-UE, IOSS.
      governs: État membre d'IDENTIFICATION au régime.
      note: >
        Ajoutée en 2017. Les notes explicatives de la Commission datent de 2011 et ne la couvrent
        donc PAS — aucune version mise à jour trouvée.
    - id: E5
      basis: A contrario
      condition: Fournisseur NON ÉTABLI DANS L'UE, opération située dans un État membre.
      governs: >
        Aucune exception ne peut désigner d'État — retour au principe §1, État du lieu.
        Notes explicatives : « For suppliers not established in the EU […] the exceptions do not
        apply and the basic invoicing rule always applies. »
    - id: E6
      basis: A contrario
      condition: IMPORTATION — fournisseur hors UE, lieu de livraison hors UE.
      governs: >
        AUCUN État membre. « no Member State's invoicing rules will apply. Additionally, there is no
        invoicing obligation relating to the importation of goods into the EU. »
  why_it_binds:
    what: >
      Art. 273 al. 2 : « La faculté prévue au premier alinéa ne peut être utilisée pour imposer des
      obligations de facturation SUPPLÉMENTAIRES à celles fixées au chapitre 3. »
    consequence: >
      Un État membre qui n'est pas celui désigné par 219 bis ne peut pas imposer ses propres mentions
      ni son propre document de correction. C'est ce qui rend le rattachement opposable et non
      facultatif. ViDA le conserve mot pour mot à compter du 2030-01-01.

correction_follows_the_invoice:
  verdict: OUI
  article_219: >
    « Est assimilé à une facture tout document ou message qui modifie la facture initiale et y fait
    référence de façon spécifique et non équivoque. » Jamais modifié depuis 2006.
  established_how: >
    PAR CONSTRUCTION, pas par une phrase unique — et il faut le dire, parce que c'est le maillon le
    plus faible de la chaîne. Quatre points, tous lus dans le texte :
      1. Art. 219 est en section 2 du chapitre 3 « Facturation » ; 219 bis ouvre la section 3 du MÊME
         chapitre et vise « la facturation », objet du chapitre entier.
      2. Le §3 le prouve a contrario : il exclut expressément les art. 244-248, qui sont en SECTION 6.
         Si 219 bis ne portait que sur sa propre section, il n'y aurait rien à exclure ailleurs.
      3. Art. 220 bis §1 b) fait porter une option d'État membre nommément sur « un document ou un
         message assimilé à une facture conformément à l'article 219 » — et les notes explicatives
         disent que l'État qui exerce ces options est celui désigné par 219 bis.
      4. Art. 226 ter e) impose au document de correction ses propres mentions.
  legislative_confirmation_2025: >
    ViDA (dir. (UE) 2025/516 art. 3 pt 8, applicable 2030-07-01) ajoute un art. 226 point (16)
    nommant « la FACTURE RECTIFICATIVE, TELLE QUE VISÉE À L'ARTICLE 219 » et l'insère dans la liste
    des mentions de la facture. Le législateur qualifie donc lui-même le document de correction par
    renvoi à l'art. 219.
  national_confirmations:
    FR: >
      CGI art. 289 I-5 : « Tout document ou message qui modifie la facture initiale, ÉMISE EN
      APPLICATION DE CET ARTICLE… est assimilé à une facture. Il doit comporter l'ensemble des
      mentions prévues au II. » Et l'art. 289-0 rattache « les règles de facturation prévues à
      l'article 289 » — donc l'article en BLOC, I-5 compris.
      La clause « émise en application de cet article » arrime en outre le rectificatif au régime de
      la facture initiale, ce que le texte UE ne fait pas.
    IT: >
      L'art. 26 ne crée aucune règle documentaire propre : « Le disposizioni degli articoli 21 e
      seguenti DEVONO ESSERE OSSERVATE ». Et l'art. 21-bis nomme « la FATTURA RETTIFICATIVA di cui
      all'articolo 26 ».

