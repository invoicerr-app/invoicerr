pairs:
  caveat: >
    LA PAIRE DE PAYS NE SUFFIT JAMAIS À DÉCIDER, et c'est l'avertissement le plus important du
    fichier. Le rattachement dépend de trois choses : le lieu de l'opération, l'établissement du
    fournisseur dans l'État d'imposition, et l'identité du redevable. Les colonnes ci-dessous donnent
    les deux cas B2B dominants ; les bascules sont listées après.
  legend:
    S: Prestation de services B2B générale — lieu = preneur, autoliquidation → exception E1.
    G: Livraison de biens expédiés depuis le pays du fournisseur (LIC ou exportation) → principe P.
  structural_result: >
    EN B2B TRANSFRONTALIER, C'EST PRESQUE TOUJOURS LE PAYS DU FOURNISSEUR. Par le principe pour les
    biens (le départ est chez lui), par la dérogation pour les services (parce que le client
    autoliquide). Le pays de l'ACHETEUR n'est quasiment jamais le facteur de rattachement.
  table:
    "FR→IT": { S: FR, G: FR, basis: "CGI 289-0 II-1° / 289-0 I" }
    "IT→FR": { S: IT, G: IT, basis: "DPR 633/72 art. 21 c. 6-bis a) / art. 21 c. 1" }
    "FR→DE": { S: FR, G: FR, basis: "CGI 289-0 II-1° — BOFiP § 70 exemple 2" }
    "DE→FR": { S: DE, G: DE, basis: "CGI 289-0 I dérogation — BOFiP § 20 exemple 1" }
    "FR→PL": { S: FR, G: FR, basis: "CGI 289-0 II-1° / I" }
    "PL→FR": { S: PL, G: PL, basis: "CGI 289-0 I dérogation" }
    "FR→ES": { S: FR, G: FR, basis: "CGI 289-0 II-1° / I" }
    "ES→FR": { S: ES, G: ES, basis: "CGI 289-0 I dérogation" }
    "IT→DE": { S: IT, G: IT, basis: "DPR art. 21 c. 6-bis a)" }
    "DE→IT": { S: DE, G: DE, basis: "219 bis §2 a) i) ; côté IT, art. 17 c. 2 — intégration par le client" }
    "IT→PL": { S: IT, G: IT, basis: "DPR art. 21 c. 6-bis a)" }
    "PL→IT": { S: PL, G: PL, basis: "219 bis §2 a) i) + art. 17 c. 2" }
    "IT→ES": { S: IT, G: IT, basis: "DPR art. 21 c. 6-bis a)" }
    "ES→IT": { S: ES, G: ES, basis: "219 bis §2 a) i) + art. 17 c. 2" }
    "FR→MX": { S: FR, G: FR, basis: "289-0 II-2° (lieu hors UE) / 289-0 I (exportation)" }
    "FR→US": { S: FR, G: FR, basis: "idem" }
    "IT→MX": { S: IT, G: IT, basis: "DPR art. 21 c. 6-bis b) / art. 21 c. 1" }
    "IT→US": { S: IT, G: IT, basis: "idem" }
    "MX→FR": { S: FR, G: AUCUN, basis: "E5 pour les services ; E6 pour les biens — importation, BOFiP § 120" }
    "US→FR": { S: FR, G: AUCUN, basis: "idem" }
    "MX→IT": { S: IT, G: AUCUN, basis: "219 bis §1 ; obligations exécutées par le client — autofattura TD17/TD19" }
    "US→IT": { S: IT, G: AUCUN, basis: "idem" }
  switches_to_wire:
    - rank: 1
      what: AUTOFACTURATION ou mandat de facturation donné au client.
      effect: Retour au principe — règles de l'État du LIEU de l'opération.
      source: "CGI 289-0 I et II-1° in fine ; BOFiP § 30 et § 90"
      trap: >
        La SOUS-TRAITANCE de la fabrication de la facture n'a PAS cet effet. « L'établissement
        matériel des factures par un tiers n'a pas pour effet de modifier le champ d'application
        territorial » (BOFiP § 30, remarque).
    - rank: 2
      what: Pas d'autoliquidation dans l'État d'imposition — le fournisseur y est immatriculé et redevable.
      effect: Principe — règles de CET État.
      source: "BOFiP § 80, avec l'exemple des travaux immobiliers"
      note: >
        Le périmètre dépend de l'usage que l'État de DESTINATION a fait de l'art. 194. C'est une
        donnée par pays de destination, pas une constante — ce qui interdit de figer la paire.
    - rank: 3
      what: OSS / IOSS.
      effect: Règles de l'État membre d'IDENTIFICATION, quel que soit le lieu d'imposition.
      source: "CGI 289-0 III ; BOFiP § 40 et § 100"
    - rank: 4
      what: Ventes à distance B2C hors OSS.
      effect: Règles de l'État de DESTINATION.
    - rank: 5
      what: Services liés à un immeuble (art. 47), livraison avec montage (art. 36), gaz et électricité (art. 38-39).
      effect: Le lieu n'est ni chez le fournisseur ni chez l'acheteur — recalculer.
  third_countries:
    what: >
      POINT D'ARCHITECTURE : l'art. 219 bis n'alloue qu'ENTRE ÉTATS MEMBRES. Face à un État tiers il
      n'y a pas allocation mais CUMUL — le Mexique applique ses règles CFDI à son assujetti et l'UE
      les siennes au sien, en parallèle. Le moteur ne doit pas modéliser MX et US comme des branches
      de 219 bis, mais comme un régime distinct.

# ─────────────────────────────────────────────────────────────────────────────
# LES DEUX RÉSULTATS QUI CHANGENT LE PRODUIT  (recherche DE / PL / ES / MX / US)
# ─────────────────────────────────────────────────────────────────────────────

national_scope:
  PL:
    headline: >
      KSEF S'APPLIQUE AUX FACTURES VERS L'ÉTRANGER. C'est le résultat qui a le plus d'effet pratique
      de toute la recherche, et il est tranché par le texte de loi, pas par de la doctrine.
    basis: >
      Art. 106ga ust. 1 ustawy o VAT. Ses SIX exemptions ne visent jamais le pays de l'acheteur —
      donc une facture d'un assujetti polonais vers un client français passe par KSeF comme une
      facture domestique.
    delivery: >
      L'acheteur étranger n'a pas accès à KSeF : la facture lui est remise HORS KSeF avec un code QR
      (art. 106gb ust. 4-5). Le document reste la faktura ustrukturyzowana ; ce qui change est le
      canal de remise, pas la nature.
    correction: La faktura korygująca suit exactement le même chemin — art. 106j ust. 4.
    our_gap: >
      Notre modèle choisit le canal par le profil du fournisseur, ce qui donne la bonne réponse ici.
      Mais nous n'avons AUCUNE notion de « remise hors canal avec QR » : pour un acheteur étranger,
      le produit devrait déposer dans KSeF ET remettre autrement. C'est une action de plus, pas un
      canal de moins.
  DE:
    headline: >
      LE MANDAT ALLEMAND EXIGE QUE LES DEUX PARTIES SOIENT ÉTABLIES EN ALLEMAGNE — pas seulement
      l'émetteur, contrairement à ce que la formule des décisions d'exécution laissait attendre.
    basis: >
      § 14 Abs. 2 Satz 2 Nr. 1 UStG : « der leistende Unternehmer UND der Leistungsempfänger …
      ansässig ». Le « und » est la règle.
    consequence: >
      Une facture allemande vers un acheteur français sort du mandat de facturation électronique
      allemand — tout en restant soumise au droit allemand de la FACTURATION (219 bis §2 a) i)).
      Les deux rattachements se séparent ici de la façon la plus visible.
  MX:
    headline: >
      LE CFDI VERS UN CLIENT ÉTRANGER EST PROBABLE MAIS N'EST PAS ÉTABLI — et c'est consigné comme
      tel plutôt que corroboré en douce.
    verified: >
      RMF 2026 regla 2.7.1.23 (DOF 28/12/2025) : « cuando se trate de operaciones efectuadas con
      residentes en el extranjero, que no se encuentren inscritos en el RFC, se señalará la clave
      genérica en el RFC: XEXX010101000 ». La règle PRÉSUPPOSE l'émission d'un CFDI vers un
      destinataire étranger : elle en règle le COMMENT, jamais le SI.
    not_verified: >
      Le texte du CFF art. 29 et 29-A n'a PAS de source vérifiable depuis ce réseau. La copie
      utilisée se déclare arrêtée à la réforme DOF du 12/11/2021 et son URL n'a pas pu être
      rétablie. diputados.gob.mx refuse la connexion, sat.gob.mx renvoie 403, et omawww.sat.gob.mx
      redirige en 301 vers www.sat.gob.mx — ce n'est donc PAS un hôte d'archive indépendant en HTTPS,
      contrairement à ce que supposaient les consignes précédentes.
    verdict: >
      NE PAS ENCODER EN `verified`. Le faisceau est cohérent — l'art. 29 rattacherait l'obligation
      aux actes de l'émetteur sans condition territoriale, et zéro occurrence de
      « residente|extranjero|territorio » n'y figure — mais un faisceau n'est pas une source.
    settled_by: >
      La recherche DOF, qui FONCTIONNE : POST `textobusqueda` sur dof.gob.mx/busqueda_detalle.php,
      avec la contrainte que seuls des termes UNIQUES ACCENTUÉS donnent des résultats (une requête
      multi-mots renvoie silencieusement zéro). Même voie pour le complemento de comercio exterior
      et pour le catalogue des motivos de cancelación.

temporal_bombs:
  - country: FR
    date: 2027-01-01
    what: >
      L'ordonnance n° 2025-1247 du 17/12/2025 portant recodification de la TVA, art. 9, ABROGE les
      CGI art. 289 et 289-0 — les deux articles sur lesquels repose tout le rattachement français.
      La page Legifrance de 289-0 porte « Version en vigueur du 01/07/2021 au 01/01/2027 ».
    status: UNVERIFIED au-delà
    settled_by: >
      Le Rapport au Président de la République (table de correspondance CGI→CIBS), ou l'ordonnance
      n° 2026-671 du 27/07/2026 qui modifie la recodification et n'a pas été lue. Le successeur n'a
      PAS été identifié dans le CIBS.
  - country: IT
    date: 2027-01-01
    what: >
      Le D.Lgs. 19/01/2026 n. 10 abroge TOUT LE BLOC facturation — art. 21, 21-bis ET 26 — pas
      seulement l'art. 26 comme noté en P3-T01.
    verdict: >
      MAIS LA RÈGLE NE BASCULE PAS. Le TU art. 72 c. 7 reprend l'art. 21 c. 6-bis à l'identique,
      l'art. 92 reprend l'art. 26 avec le même renvoi (« Le disposizioni degli articoli 72 e seguenti
      devono essere osservate »), l'art. 73 nomme « la fattura rettificativa di cui all'articolo 92 »
      et l'art. 64 c. 2 reproduit l'art. 17 c. 2. Renumérotation, pas changement de fond.
    for_the_engine: "Un profil IT `validFrom` au 2027-01-01, mêmes règles, nouvelles références."

open_questions:
  - id: pu01_date_du_rattachement
    what: >
      À QUELLE DATE SE LIT LE RATTACHEMENT POUR UNE CORRECTION ? L'art. 219 bis désigne un État à
      partir de « la livraison ou la prestation ». Un document de correction n'a pas d'opération
      propre. Date de l'opération d'origine, de la facture d'origine, ou de la correction ?
      AUCUN texte, aucune note explicative, aucune ligne directrice ne le dit.
    why_it_matters: >
      Si le fournisseur déplace son siège entre les deux dates, ou si l'État de destination
      introduit ou supprime l'autoliquidation entre-temps — et le BOFiP § 80 fait précisément de ce
      paramètre le pivot — la réponse change.
    settled_by: Un arrêt CJUE, une ligne directrice du Comité TVA, ou un rescrit national.
    note: >
      La clause française « émise en application de cet article » plaide pour la date de la facture
      initiale, mais c'est du droit français et cela ne lie pas les autres États membres.
  - id: pu01_correction_qui_change_le_rattachement
    what: >
      Et si la correction modifie les faits qui fixaient le rattachement — le client se révèle non
      assujetti, donc pas d'autoliquidation, donc principe au lieu de dérogation ?
    settled_by: Même chose qu'au point précédent. Aucune source.
  - id: pu01_portee_226
    what: >
      L'art. 226 vise « les factures émises en application des articles 220 et 221 » ; un document de
      correction est ASSIMILÉ par l'art. 219, il n'est pas ÉMIS EN APPLICATION de l'art. 220.
      Tension non résolue avec l'art. 273 al. 2. La France et l'Italie tranchent chacune chez elles,
      mais il n'y a pas de règle UE explicite avant le point 226(16) de ViDA au 2030-07-01.
    settled_by: Une ligne directrice du Comité TVA ou un arrêt.
  - id: pu01_jurisprudence_cjue
    what: >
      La jurisprudence CJUE sur l'art. 219 bis n'a PAS été recherchée à fond — curia est une SPA non
      exploitable, eur-lex renvoie un challenge WAF, le budget de recherche était épuisé.
      Ne pas conclure qu'il n'y en a pas.
    settled_by: InfoCuria depuis un vrai navigateur, ou une session avec budget de recherche.
  - id: pu01_prassi_italienne_sens_sortant
    what: >
      Aucun document de l'Agenzia delle Entrate n'aborde le SENS SORTANT — fournisseur italien,
      client étranger, obligation de nota di variazione. Le sens ENTRANT, lui, est couvert par la
      risposta a interpello n. 308 du 30/04/2021, qui précise que la faculté de l'art. 26 c. 2
      « prescinde dalla natura del cedente/prestatore » et « si tratta di una possibilità e non di
      un obbligo ».
    settled_by: Une prassi AdE sur le sens sortant ; constat négatif sur le corpus atteignable.
  - id: pu01_mandat_sdi_2025
    what: >
      Base juridique du mandat SdI italien entre le 2025-01-01 et le 2025-04-14 : la décision (UE)
      2018/593 s'appliquait « until 31 December 2024 » et le nouvel art. 218 al. 2 de ViDA n'est en
