apiVersion: v2
name: invoicerr
description: >-
  Self-hosted invoicing and per-country e-invoicing compliance. One image, two roles
  (api: nginx + Nest API; worker: BullMQ document-action queue consumer), optional
  bundled Postgres/Redis for dev/kind installs, and S3-compatible legal archive storage
  for production.
