{{/*
Single host -> single Service. nginx INSIDE the api pod already splits /api (proxied to the Nest
process) from / (the SPA, see the repo's nginx.conf) — this Ingress just needs to get traffic to
that Service on port 80.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "invoicerr.fullname" . }}
  labels:
    {{- include "invoicerr.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.host }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "invoicerr.componentFullname" (dict "context" . "component" "api") }}
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
