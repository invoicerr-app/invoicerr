apiVersion: v1
kind: Service
metadata:
  name: {{ include "invoicerr.componentFullname" (dict "context" . "component" "api") }}
  labels:
    {{- include "invoicerr.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "invoicerr.componentSelectorLabels" (dict "context" . "component" "api") | nindent 4 }}
