{{- if .Values.ocr.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "invoicerr.componentFullname" (dict "context" . "component" "ocr") }}
  labels:
    {{- include "invoicerr.componentLabels" (dict "context" . "component" "ocr") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ocr.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "invoicerr.componentSelectorLabels" (dict "context" . "component" "ocr") | nindent 4 }}
{{- end }}
