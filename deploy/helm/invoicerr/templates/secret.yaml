{{/*
Chart-generated Secret — DEV/KIND-ONLY, rendered ONLY when generateSecret.enabled is explicitly
turned on (default OFF). See values.yaml's own header on generateSecret for why this is unsafe for
anything but a disposable local install: these values land here in plaintext (base64 is encoding,
not encryption) and in `helm get values`/`helm template` output. The production path is
`existingSecret` — a Secret you create and manage yourself, which this template never touches.
*/}}
{{- if .Values.generateSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "invoicerr.secretName" . }}
  labels:
    {{- include "invoicerr.labels" . | nindent 4 }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ .Values.generateSecret.betterAuthSecret | quote }}
  {{- if .Values.generateSecret.credentialsEncryptionKey }}
  CREDENTIALS_ENCRYPTION_KEY: {{ .Values.generateSecret.credentialsEncryptionKey | quote }}
  {{- end }}
  {{- if not .Values.postgresql.enabled }}
  DATABASE_URL: {{ .Values.generateSecret.databaseUrl | quote }}
  {{- if .Values.generateSecret.databaseUrlUnpooled }}
  DATABASE_URL_UNPOOLED: {{ .Values.generateSecret.databaseUrlUnpooled | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.generateSecret.redisPassword }}
  REDIS_PASSWORD: {{ .Values.generateSecret.redisPassword | quote }}
  {{- end }}
  {{- if eq .Values.archive.storage "s3" }}
  ARCHIVE_S3_ACCESS_KEY_ID: {{ .Values.generateSecret.archiveS3AccessKeyId | quote }}
  ARCHIVE_S3_SECRET_ACCESS_KEY: {{ .Values.generateSecret.archiveS3SecretAccessKey | quote }}
  {{- end }}
{{- end }}
