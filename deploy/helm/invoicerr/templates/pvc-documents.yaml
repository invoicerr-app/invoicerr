{{/*
Shared local storage for /data, mounted on BOTH api and worker — see values.yaml's own `documents`
header for what it's for (DOCUMENTS_INBOUND_DIR when documents.inbound.storage=local,
DOCUMENTS_ARCHIVE_DIR when archive.storage=local) and its ReadWriteOnce-at-replicaCount-1 caveat.
Rendered only when BOTH `persistence.enabled` is true AND at least one of those two stores still
needs local disk (`invoicerr.documentsVolumeNeeded`, templates/_helpers.tpl) — once both move to
`s3`, nothing reads or writes `/data` any more and this PVC would just be dead weight.
*/}}
{{- if and .Values.documents.persistence.enabled (eq (include "invoicerr.documentsVolumeNeeded" .) "true") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "invoicerr.componentFullname" (dict "context" . "component" "documents") }}
  labels:
    {{- include "invoicerr.componentLabels" (dict "context" . "component" "documents") | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.documents.persistence.accessMode }}
  {{- if .Values.documents.persistence.storageClassName }}
  storageClassName: {{ .Values.documents.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.documents.persistence.size }}
{{- end }}
