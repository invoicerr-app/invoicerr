{{/*
DEV/KIND-ONLY bundled Postgres — rendered ONLY when postgresql.enabled=true. Single replica, no HA,
no backups, no point-in-time recovery. Production default is an external, managed Postgres
(Neon.tech, decided by the product owner) via existingSecret's DATABASE_URL — see values.yaml's own
postgresql.* header. Never use this for anything but a local kind/minikube proof.
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "invoicerr.componentFullname" (dict "context" . "component" "postgres") }}
  labels:
    {{- include "invoicerr.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Same reasoning as the bundled Redis Deployment: one replica, one RWO PVC — Recreate avoids two
    # Postgres processes racing over the same data directory during a rollout.
    type: Recreate
  selector:
    matchLabels:
      {{- include "invoicerr.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invoicerr.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            {{- if .Values.postgresql.persistence.enabled }}
            # The PVC is mounted at /var/lib/postgresql/data itself, NOT at PGDATA — `initdb` refuses
            # to initialize a directory that already has anything in it, and every real block-storage
            # provisioner (Scaleway included) hands out a volume that already contains a `lost+found`
            # directory at its root. HIT FOR REAL on a Scaleway Kapsule cluster, 2026-09-22:
            # `initdb: error: directory "/var/lib/postgresql/data" exists but is not empty ... It
            # contains a lost+found directory`. kind's local-path provisioner does not create
            # `lost+found`, which is why this never showed up there. Pointing PGDATA at a fresh
            # subdirectory of the mount gives `initdb` something genuinely empty to work with,
            # regardless of what the provisioner already put at the mount point's own root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- end }}
          {{- if .Values.postgresql.persistence.enabled }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          {{- end }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 15
            # OBSERVED on a real Scaleway Kapsule cluster during a load test, 2026-09-22: at the
            # Kubernetes default timeoutSeconds of 1s, `pg_isready` running against a genuinely
            # saturated (not dead) Postgres missed that window, Kubernetes counted it as a failed
            # probe, and — with no failureThreshold cushion either — restarted Postgres mid-load-test,
            # wiping the database it was testing against. A busy database is not a dead database:
            # give `pg_isready` real headroom to answer, and require several consecutive misses, not
            # one, before concluding the process is actually gone.
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      {{- if .Values.postgresql.persistence.enabled }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "invoicerr.componentFullname" (dict "context" . "component" "postgres") }}
      {{- end }}
{{- end }}
