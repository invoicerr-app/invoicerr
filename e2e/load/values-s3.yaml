# Object storage for the multi-node runs. NOT an optimisation: the chart's documents PVC is
# ReadWriteOnce, so a pod scheduled on a second node cannot attach it and stays stuck on
# FailedAttachVolume - measured on 2026-09-22 with two and three nodes. archive.storage=s3 plus
# documents.inbound.storage=s3 is the only combination that drops that volume entirely, which is
# also the production shape.
#
# NEITHER THE ENDPOINT NOR THE CREDENTIALS ARE IN THIS FILE, and the credentials must never be:
# loadtest.js writes <run>/s3-credentials.yaml (git-ignored) from S3_ENDPOINT, S3_REGION,
# S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY, and passes it to Helm as one more -f. A key was
# committed here once, on 2026-09-23, and had to be revoked - see the .gitignore next to this file.
#
# Bucket names come from --s3-bucket-prefix (default invoicerr-lt): <prefix>-archive and
# <prefix>-inbound, created by you before the run.
archive:
  storage: s3
  s3:
    forcePathStyle: false
documents:
  inbound:
    storage: s3
    s3:
      forcePathStyle: false
  persistence:
    enabled: false
