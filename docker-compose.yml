services:
  invoicerr:
    image: ghcr.io/invoicerr-app/invoicerr:latest
    ports:
      - "80:80"
    environment:
      - DATABASE_URL=postgresql://invoicerr:invoicerr@invoicerr_db:5432/invoicerr_db

      - APP_URL=https://invoicerr.example.com # Required for email templates, as it redirects to the app
      - CORS_ORIGINS=http://localhost:5173,https://invoicerr.example.com # Comma-separated list of allowed origins for CORS

      # Required for email features - choose ONE provider below
      # Option 1: SMTP (default, MAIL_PROVIDER can be omitted)
      - MAIL_PROVIDER=smtp
      - SMTP_HOST=smtp-relay.example.com
      - SMTP_USER="username@example.com"
      - SMTP_FROM="user-from@example.com" # Not required if SMTP_USER is the same as SMTP_FROM
      - SMTP_PASSWORD="your_smtp_password"
      - SMTP_PORT=587 # Change this to your SMTP port (default is 587 for TLS)
      - SMTP_SECURE=false # Set to true if your SMTP server requires a secure connection (default is false)

      # Option 2: Brevo (set MAIL_PROVIDER=brevo and comment out the SMTP_* variables above)
      # - MAIL_PROVIDER=brevo
      # - BREVO_API_KEY="your_brevo_api_key"
      # - MAIL_FROM="user-from@example.com" # Sender address, falls back to SMTP_FROM/SMTP_USER if unset

      # OIDC Configuration (example for Authentik)
      - OIDC_ISSUER="https://auth.chevrier.dev"
      - OIDC_NAME="Pocket ID"
      # Endpoints for OIDC
      - OIDC_AUTHORIZATION_ENDPOINT="https://auth.chevrier.dev/authorize"
      - OIDC_TOKEN_ENDPOINT="https://auth.chevrier.dev/token"
      - OIDC_USERINFO_ENDPOINT="https://auth.chevrier.dev/userinfo"
      - OIDC_TOKEN_REVOKE_ENDPOINT="https://auth.chevrier.dev/revoke"
      - OIDC_END_SESSION_ENDPOINT="https://auth.chevrier.dev/end_session"
      - OIDC_JWKS_URI="https://auth.chevrier.dev/.well-known/jwks.json"
      # Client ID and Secret for OIDC. OIDC_CLIENT_ID is what decides whether the environment provider
      # is registered at all; OIDC_NAME above is its id, which lands in a URL path segment
      # (/api/auth/callback/<id>) and is sanitised to URL-safe characters, defaulting to "oidc".
      - OIDC_CLIENT_ID="your-client-id"
      - OIDC_CLIENT_SECRET="your-client-secret"

      # OIDC_ONLY: "1"/"true" makes this instance SINGLE-SIGN-ON ONLY — no email/password sign-in or
      # sign-up, and set-password is refused server-side. DEFAULT OFF. Works with the provider above
      # and/or with the per-company ones customers register themselves (company settings -> SSO). The
      # backend refuses to boot if it is set while NO provider exists, since nobody could then sign in.
      # - OIDC_ONLY=true

      # REQUIRED. Generate a real value with: openssl rand -hex 32 — the backend now REFUSES to
      # boot in production (SECURITY_AUDIT.md finding #3) if this is left empty or set to an
      # obvious placeholder, specifically so an unmodified copy-paste of this file cannot start
      # with a PUBLIC secret (this file is committed to the open-source repository, so any string
      # left here is known to everyone). BETTER_AUTH_SECRET signs every session cookie/JWT; a
      # deployment running on a known secret lets anyone forge a valid session for any userId.
      - BETTER_AUTH_SECRET=CHANGE_ME_generate_with_openssl_rand_hex_32
      # Optional: falls back to BETTER_AUTH_SECRET's value above if unset, kept only for
      # deployments that already set JWT_SECRET separately. Same rule applies if you do set it.
      # - JWT_SECRET=CHANGE_ME_generate_with_openssl_rand_hex_32

      # Document-action async queue (BullMQ/Redis, TODO.md item 22 — an async "send" and, later,
      # recurring documents both go through it). Redis is REQUIRED for the backend to boot at all,
      # never an optional extra. WORKER_INLINE=true (default here) makes this single container also
      # consume its own queue jobs (mono/self-host deployment). For a scaled deployment with a
      # dedicated worker service, see docker-compose.scale.yml.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - WORKER_INLINE=true

      # TODO_PRODUIT.md T5(c) — OCR of unstructured received-invoice PDFs. OPTIONAL: absent (the
      # default) means this instance runs full-local, self-host — a plain scanned PDF stores with
      # empty fields for a human to fill in, exactly as before this feature existed. This backend
      # NEVER sees a Mistral API key, and never talks to the local engine directly either — it only
      # ever knows this ONE URL; the real engine's own credential/container lives entirely in
      # whichever service below is actually enabled. Pick EXACTLY ONE of the two modes:
      #
      #   CLOUD — Mistral Document AI (needs YOUR OWN Mistral API key, structured extraction, the
      #   more accurate of the two): uncomment this line + the "ocr" service below, then
      #   `docker compose --profile ocr up`.
      # - OCR_SERVICE_URL=http://ocr:3002
      #
      #   LOCAL — MANDANT DECISION (verbatim, follow-up to the above): "J'ai pas de clé Mistral,
      #   pour moi en local faut lancer un service Docker qui fait ça." Zero API key, zero data ever
      #   leaving this machine — a heuristic text-scrape, meaningfully weaker than the cloud path
      #   (see `backend/src/ocr-service/local-client.ts`'s own header for the full, honest account
      #   of what that costs). Uncomment this line + BOTH the "ocr-local" and "ocr-local-engine"
      #   services below, then `docker compose --profile ocr-local up`.
      # - OCR_SERVICE_URL=http://ocr-local:3002
    depends_on:
      - invoicerr_db
      - redis

  invoicerr_db:
    image: postgres:15
    environment:
      POSTGRES_USER: invoicerr
      POSTGRES_PASSWORD: invoicerr
      POSTGRES_DB: invoicerr_db
    volumes:
      - db_data:/var/lib/postgresql/data

  # TODO_PRODUIT.md T5(c) — OPT-IN, CLOUD mode (Compose `profiles`: only starts with
  # `docker compose --profile ocr up`, never with a plain `docker compose up`). The ONLY process in
  # this whole deployment that ever holds a real Mistral API key — the main "invoicerr" service above
  # only ever knows OCR_SERVICE_URL. Same image, third ROLE (see entrypoint.sh's own "one image, N
  # roles" switch) — no new Dockerfile, no new dependency.
  #
  # SaaS mode: an operator enables this ONE service, ONCE, with THEIR OWN Mistral key — every company
  # on the instance then gets OCR with nothing further to configure ("personne a besoin de le
  # configurer" — the mandant's own wording). Self-host mode: leave this service (and
  # OCR_SERVICE_URL above) commented out — full local, no data ever leaves the instance for OCR — or
  # use the "ocr-local"/"ocr-local-engine" pair below for full-local OCR instead of no OCR at all.
  ocr:
    image: ghcr.io/invoicerr-app/invoicerr:latest
    profiles: ["ocr"]
    environment:
      - ROLE=ocr
      - OCR_ENGINE=mistral # the default even if omitted — explicit here for symmetry with "ocr-local" below
      - MISTRAL_API_KEY=your_mistral_api_key # https://console.mistral.ai — NEVER commit a real value
    restart: unless-stopped

  # TODO_PRODUIT.md T5(c) follow-up — MANDANT DECISION (verbatim): "J'ai pas de clé Mistral, pour moi
  # en local faut lancer un service Docker qui fait ça." OPT-IN, LOCAL mode (Compose profile
  # "ocr-local": only starts with `docker compose --profile ocr-local up`, together with the
  # "ocr-local-engine" service right below it). ZERO API key anywhere, ZERO data leaving this
  # machine — every byte of every received PDF stays on this instance, reaching only the
  # "ocr-local-engine" container over the internal compose network. Meaningfully WEAKER than the
  # cloud "ocr" service above: a heuristic text-scrape, not a model reading the invoice —
  # `backend/src/ocr-service/local-client.ts`'s own header documents exactly what that can and cannot
  # get right (a wrong/missing field only ever lands on an EDITABLE proposal, never silently accepted
  # downstream).
  ocr-local:
    image: ghcr.io/invoicerr-app/invoicerr:latest
    profiles: ["ocr-local"]
    environment:
      - ROLE=ocr
      - OCR_ENGINE=local
      - LOCAL_OCR_URL=http://ocr-local-engine:9998
    depends_on:
      - ocr-local-engine
    restart: unless-stopped

  # The local OCR engine itself — MANDANT DECISION (verbatim): "pour l'OCR on peut faire notre propre
  # image et notre propre serveur: FROM jbarlow83/ocrmypdf:latest + RUN apt-get install
  # tesseract-ocr-{ita,nld,rus,equ}…" — OUR OWN image (`docker/ocr-local/Dockerfile` + `server.py`,
  # this repo, not a third party), replacing the `apache/tika:latest-full` this service originally
  # ran. Tika's own disqualifying limit — a language set BAKED IN at build time, not
  # operator-configurable without a custom image anyway (verified: Polish/Dutch silently
  # mis-recognized on the stock image) — is exactly what this switch fixes: `docker/ocr-local/
  # Dockerfile`'s own comment block installs this app's primary markets plus major world languages,
  # and adding one more is a single `RUN apt-get install tesseract-ocr-<code>` line in that file, not
  # a new image entirely. `jbarlow83/ocrmypdf:latest` (the `ocrmypdf` tool's own official image)
  # reads the PDF NATIVELY the same way Tika did — it rasterizes any page and OCRs it with its own
  # bundled Tesseract, zero extra code either side of this HTTP call — see `local-client.ts`'s and
  # `docker/ocr-local/server.py`'s own headers for the full account, including a real, verified
  # finding on why the server force-OCRs every page rather than skipping pages that already have
  # text.
  # NOTE (2026-09-11) : l'image vit désormais dans SON PROPRE repo — github.com/invoicerr-app/ocr-image —
  # et est publiée sur GHCR. Les chemins `docker/ocr-local/...` du commentaire ci-dessus sont
  # HISTORIQUES : le Dockerfile + server.py ont été déplacés là-bas (le raisonnement Tika→ocrmypdf,
  # langues et force-OCR reste valable). Ce service ne fait que TIRER l'image publiée.
  ocr-local-engine:
    image: ghcr.io/invoicerr-app/ocr-image:latest
    profiles: ["ocr-local"]
    restart: unless-stopped

  redis:
    image: bitnami/redis:latest
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # bitnami/redis refuses to start with an empty REDIS_PASSWORD unless this is set.
      # Self-host default is no password (single-host docker network); set REDIS_PASSWORD
      # to enable auth.
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_AOF_ENABLED: "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - redis-data:/bitnami

volumes:
  db_data:
    driver: local
  redis-data:
    driver: local
