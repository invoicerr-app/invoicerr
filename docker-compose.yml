services:
  invoicerr:
    image: ghcr.io/invoicerr-app/invoicerr:latest
    ports:
      - "80:80"
    environment:
      - DATABASE_URL=postgresql://invoicerr:invoicerr@invoicerr_db:5432/invoicerr_db

      - APP_URL=https://invoicerr.example.com # Required for email templates, as it redirects to the app
      - CORS_ORIGINS=http://localhost:5173,https://invoicerr.example.com # Comma-separated list of allowed origins for CORS

      # Required for email features - choose ONE provider below
      # Option 1: SMTP (default, MAIL_PROVIDER can be omitted)
      - MAIL_PROVIDER=smtp
      - SMTP_HOST=smtp-relay.example.com
      - SMTP_USER="username@example.com"
      - SMTP_FROM="user-from@example.com" # Not required if SMTP_USER is the same as SMTP_FROM
      - SMTP_PASSWORD="your_smtp_password"
      - SMTP_PORT=587 # Change this to your SMTP port (default is 587 for TLS)
      - SMTP_SECURE=false # Set to true if your SMTP server requires a secure connection (default is false)

      # Option 2: Brevo (set MAIL_PROVIDER=brevo and comment out the SMTP_* variables above)
      # - MAIL_PROVIDER=brevo
      # - BREVO_API_KEY="your_brevo_api_key"
      # - MAIL_FROM="user-from@example.com" # Sender address, falls back to SMTP_FROM/SMTP_USER if unset

      # OIDC Configuration (example for Authentik)
      - OIDC_ISSUER="https://auth.chevrier.dev"
      - OIDC_NAME="Pocket ID"
      # Endpoints for OIDC
      - OIDC_AUTHORIZATION_ENDPOINT="https://auth.chevrier.dev/authorize"
      - OIDC_TOKEN_ENDPOINT="https://auth.chevrier.dev/token"
      - OIDC_USERINFO_ENDPOINT="https://auth.chevrier.dev/userinfo"
      - OIDC_TOKEN_REVOKE_ENDPOINT="https://auth.chevrier.dev/revoke"
      - OIDC_END_SESSION_ENDPOINT="https://auth.chevrier.dev/end_session"
      - OIDC_JWKS_URI="https://auth.chevrier.dev/.well-known/jwks.json"
      # Client ID and Secret for OIDC
      - OIDC_CLIENT_ID="your-client-id"
      - OIDC_CLIENT_SECRET="your-client-secret"

      # Optional, but recommended for docker deployments
      - JWT_SECRET="your_jwt_secret" # Used for JWT authentication, can be any random string
      - BETTER_AUTH_SECRET="your_better_auth_secret" # Required, generate with: openssl rand -base64 32, falls back to JWT_SECRET if unset

      # Document-action async queue (BullMQ/Redis, TODO.md item 22 — an async "send" and, later,
      # recurring documents both go through it). Redis is REQUIRED for the backend to boot at all,
      # never an optional extra. WORKER_INLINE=true (default here) makes this single container also
      # consume its own queue jobs (mono/self-host deployment). For a scaled deployment with a
      # dedicated worker service, see docker-compose.scale.yml.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - WORKER_INLINE=true

      # TODO_PRODUIT.md T5(c) — OCR of unstructured received-invoice PDFs. OPTIONAL: absent (the
      # default) means this instance runs full-local, self-host — a plain scanned PDF stores with
      # empty fields for a human to fill in, exactly as before this feature existed. This backend
      # NEVER sees a Mistral API key, and never talks to the local engine directly either — it only
      # ever knows this ONE URL; the real engine's own credential/container lives entirely in
      # whichever service below is actually enabled. Pick EXACTLY ONE of the two modes:
      #
      #   CLOUD — Mistral Document AI (needs YOUR OWN Mistral API key, structured extraction, the
      #   more accurate of the two): uncomment this line + the "ocr" service below, then
      #   `docker compose --profile ocr up`.
      # - OCR_SERVICE_URL=http://ocr:3002
      #
      #   LOCAL — MANDANT DECISION (verbatim, follow-up to the above): "J'ai pas de clé Mistral,
      #   pour moi en local faut lancer un service Docker qui fait ça." Zero API key, zero data ever
      #   leaving this machine — a heuristic text-scrape, meaningfully weaker than the cloud path
      #   (see `backend/src/ocr-service/local-client.ts`'s own header for the full, honest account
      #   of what that costs). Uncomment this line + BOTH the "ocr-local" and "tika" services below,
      #   then `docker compose --profile ocr-local up`.
      # - OCR_SERVICE_URL=http://ocr-local:3002
    depends_on:
      - invoicerr_db
      - redis

  invoicerr_db:
    image: postgres:15
    environment:
      POSTGRES_USER: invoicerr
      POSTGRES_PASSWORD: invoicerr
      POSTGRES_DB: invoicerr_db
    volumes:
      - db_data:/var/lib/postgresql/data

  # TODO_PRODUIT.md T5(c) — OPT-IN, CLOUD mode (Compose `profiles`: only starts with
  # `docker compose --profile ocr up`, never with a plain `docker compose up`). The ONLY process in
  # this whole deployment that ever holds a real Mistral API key — the main "invoicerr" service above
  # only ever knows OCR_SERVICE_URL. Same image, third ROLE (see entrypoint.sh's own "one image, N
  # roles" switch) — no new Dockerfile, no new dependency.
  #
  # SaaS mode: an operator enables this ONE service, ONCE, with THEIR OWN Mistral key — every company
  # on the instance then gets OCR with nothing further to configure ("personne a besoin de le
  # configurer" — the mandant's own wording). Self-host mode: leave this service (and
  # OCR_SERVICE_URL above) commented out — full local, no data ever leaves the instance for OCR — or
  # use the "ocr-local"/"tika" pair below for full-local OCR instead of no OCR at all.
  ocr:
    image: ghcr.io/invoicerr-app/invoicerr:latest
    profiles: ["ocr"]
    environment:
      - ROLE=ocr
      - OCR_ENGINE=mistral # the default even if omitted — explicit here for symmetry with "ocr-local" below
      - MISTRAL_API_KEY=your_mistral_api_key # https://console.mistral.ai — NEVER commit a real value
    restart: unless-stopped

  # TODO_PRODUIT.md T5(c) follow-up — MANDANT DECISION (verbatim): "J'ai pas de clé Mistral, pour moi
  # en local faut lancer un service Docker qui fait ça." OPT-IN, LOCAL mode (Compose profile
  # "ocr-local": only starts with `docker compose --profile ocr-local up`, together with the "tika"
  # service right below it). ZERO API key anywhere, ZERO data leaving this machine — every byte of
  # every received PDF stays on this instance, reaching only the "tika" container over the internal
  # compose network. Meaningfully WEAKER than the cloud "ocr" service above: a heuristic text-scrape,
  # not a model reading the invoice — `backend/src/ocr-service/local-client.ts`'s own header
  # documents exactly what that can and cannot get right (a wrong/missing field only ever lands on
  # an EDITABLE proposal, never silently accepted downstream).
  ocr-local:
    image: ghcr.io/invoicerr-app/invoicerr:latest
    profiles: ["ocr-local"]
    environment:
      - ROLE=ocr
      - OCR_ENGINE=local
      - LOCAL_OCR_URL=http://tika:9998
    depends_on:
      - tika
    restart: unless-stopped

  # The local OCR engine itself — apache/tika:latest-full (Apache Software Foundation, Apache-2.0,
  # the most actively maintained of the three candidates this task evaluated — see `local-client.ts`'s
  # own header for the full comparison, including WHY a bare Tesseract-server image was ruled out
  # despite broader language coverage: it cannot read a PDF at all, and converting one ourselves would
  # need a new dependency this task's own root instruction forbids). Tika reads the PDF NATIVELY —
  # it rasterizes any page with no text layer and OCRs it with its own bundled Tesseract, with zero
  # extra code on either side of this HTTP call. Ships eng/fra/deu/ita/spa/jpn OCR language packs —
  # NOT Polish or Dutch out of the box (verified: an unsupported language falls back silently to
  # Tika's own default guess rather than erroring). An operator who needs those two builds a tiny
  # custom image instead of the stock one:
  #   FROM apache/tika:latest-full
  #   RUN apt-get update && apt-get install -y tesseract-ocr-pol tesseract-ocr-nld && rm -rf /var/lib/apt/lists/*
  # — then points the "ocr-local" service's `image:` at that build instead of `apache/tika:latest-full`.
  tika:
    image: apache/tika:latest-full
    profiles: ["ocr-local"]
    restart: unless-stopped

  redis:
    image: bitnami/redis:latest
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # bitnami/redis refuses to start with an empty REDIS_PASSWORD unless this is set.
      # Self-host default is no password (single-host docker network); set REDIS_PASSWORD
      # to enable auth.
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_AOF_ENABLED: "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - redis-data:/bitnami

volumes:
  db_data:
    driver: local
  redis-data:
    driver: local
