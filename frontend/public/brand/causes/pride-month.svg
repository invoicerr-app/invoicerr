<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><!-- Progress Pride flag (Daniel Quasar, 2018): the classic 6-stripe rainbow field plus the chevron's 5 colours (black + brown for people of colour, the trans flag's light blue/pink/white) — all 11, in chevron-then-field reading order, since the rounded-square shape has no hoist-side triangle to actually carry a chevron. Geometry is the unmodified "07 Faille" mark (brand-mark.tsx) — only the two shapes' fill changed, never the paths. .cd-edge is a low-opacity hairline in the fixed brand ink / dark-mode foreground pair (same literal hexes and same prefers-color-scheme technique as favicon.svg, which can't reach index.css custom properties either) so a pale band stays legible on a same-toned page background in either theme, without adding any geometry of its own. --><style>.cd-edge{stroke:#0f1f2a;stroke-opacity:.35}@media (prefers-color-scheme: dark){.cd-edge{stroke:#ebeff2;stroke-opacity:.4}}</style><defs><clipPath id="cd-a-pride-month"><path d="M533.494 -600.41 L-61.136 1098.535 L-910.609 801.22 L-315.978 -897.725 Z"/></clipPath><clipPath id="cd-b-pride-month"><path d="M573.136 -586.535 L-21.494 1112.41 L827.978 1409.725 L1422.609 -289.22 Z"/></clipPath><linearGradient id="cd-g-pride-month" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#000000"/><stop offset="9.090909090909092%" stop-color="#000000"/><stop offset="9.090909090909092%" stop-color="#613915"/><stop offset="18.181818181818183%" stop-color="#613915"/><stop offset="18.181818181818183%" stop-color="#74D7EE"/><stop offset="27.27272727272727%" stop-color="#74D7EE"/><stop offset="27.27272727272727%" stop-color="#F5A9B8"/><stop offset="36.36363636363637%" stop-color="#F5A9B8"/><stop offset="36.36363636363637%" stop-color="#FFFFFF"/><stop offset="45.45454545454545%" stop-color="#FFFFFF"/><stop offset="45.45454545454545%" stop-color="#E40303"/><stop offset="54.54545454545454%" stop-color="#E40303