<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><!-- No single flag is attached to this UN day (3 December); purple is its own long-running association (Purple Light Up and similar disability-awareness campaigns), in two tones so the fault stays visible. Geometry is the unmodified "07 Faille" mark (brand-mark.tsx) — only the two shapes' fill changed, never the paths. .cd-edge is a low-opacity hairline in the fixed brand ink / dark-mode foreground pair (same literal hexes and same prefers-color-scheme technique as favicon.svg, which can't reach index.css custom properties either) so a pale band stays legible on a same-toned page background in either theme, without adding any geometry of its own. --><style>.cd-edge{stroke:#0f1f2a;stroke-opacity:.35}@media (prefers-color-scheme: dark){.cd-edge{stroke:#ebeff2;stroke-opacity:.4}}</style><defs><clipPath id="cd-a-international-day-of-persons-with-disabilities"><path d="M533.494 -600.41 L-61.136 1098.535 L-910.609 801.22 L-315.978 -897.725 Z"/></clipPath><clipPath id="cd-b-international-day-of-persons-with-disabilities"><path d="M573.136 -586.535 L-21.494 1112.41 L827.978 1409.725 L1422.609 -289.22 Z"/></clipPath></defs><g clip-path="url(#cd-a-international-day-of-persons-with-disabilities)"><path class="cd-edge" stroke-width="3" d="M168 96H344A72 72 0 0 1 416 168V344A72 72 0 0 1 344 416H168A72 72 0 0 1 96 344V168A72 72 0 0 1 168 96Z" fill="#6A1B9A"/></g><g transform="translate(18.5 -52.856)" clip-path="url(#cd-b-international-day-of-persons-with-disabilities)"><path class="cd-edge" stroke-width="3" d="M168 96H344A72 72 0 0 1 416 168V344A72 72 0 0 1 344 416H168A72 72 0 0 1 96 344V168A72 72 0 0 1 168 96Z" fill="#9C27B0"/></g></svg>