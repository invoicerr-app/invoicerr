<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><!-- International Women's Day's own colours (internationalwomensday.com/About): purple for justice and dignity, white, green for hope — traced to the UK's Women's Social and Political Union, 1908. Geometry is the unmodified "07 Faille" mark (brand-mark.tsx) — only the two shapes' fill changed, never the paths. .cd-edge is a low-opacity hairline in the fixed brand ink / dark-mode foreground pair (same literal hexes and same prefers-color-scheme technique as favicon.svg, which can't reach index.css custom properties either) so a pale band stays legible on a same-toned page background in either theme, without adding any geometry of its own. --><style>.cd-edge{stroke:#0f1f2a;stroke-opacity:.35}@media (prefers-color-scheme: dark){.cd-edge{stroke:#ebeff2;stroke-opacity:.4}}</style><defs><clipPath id="cd-a-international-womens-day"><path d="M533.494 -600.41 L-61.136 1098.535 L-910.609 801.22 L-315.978 -897.725 Z"/></clipPath><clipPath id="cd-b-international-womens-day"><path d="M573.136 -586.535 L-21.494 1112.41 L827.978 1409.725 L1422.609 -289.22 Z"/></clipPath><linearGradient id="cd-g-international-womens-day" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#7F1084"/><stop offset="33.33333333333333%" stop-color="#7F1084"/><stop offset="33.33333333333333%" stop-color="#FFFFFF"/><stop offset="66.66666666666666%" stop-color="#FFFFFF"/><stop offset="66.66666666666666%" stop-color="#00843D"/><stop offset="100%" stop-color="#00843D"/></linearGradient></defs><g clip-path="url(#cd-a-international-womens-day)"><path class="cd-edge" stroke-width="3" d="M168 96H344A72 72 0 0 1 416 168V344A72 72 0 0 1 344 416H168A72 72 0 0 1 96 344V168A72 72 0 0 1 168 96Z" fill="url(#cd-g-international-womens-day)"/></g><g transform="translate(18.5 -52.856)" clip-path="url(#cd-b-international-womens-day)"><path class="cd-edge" stroke-width="3" d="M168 96H344A72 72 0 0 1 416 168V344A7