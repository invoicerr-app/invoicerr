name: nginx config smoke test

# Serves a stand-in web root through nginx.conf, on the same nginx base the image is built from
# (ghcr.io/invoicerr-app/server-image is FROM nginx:bookworm), and checks every location that serves
# files answers from /usr/share/nginx/html: the SPA shell, a hashed bundle under /assets/, and the
# runtime /config.json written by entrypoint.sh. A location without a `root` falls back to
# /etc/nginx/html on this base and answers 404 for files that exist, which is a blank page in the
# browser. It also keeps the 404 rules of /assets/ and /config.json: a miss must not get index.html.
on:
  pull_request:
    paths:
      - nginx.conf
      - .github/workflows/nginx-smoke.yml
  workflow_dispatch:

concurrency:
  group: nginx-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start nginx with nginx.conf and a stand-in web root
        run: |
          mkdir -p web/assets
          echo '<!doctype html><title>spa-shell</title><script type="module" src="/assets/index-smoke.js"></script>' > web/index.html
          echo 'console.log("bundle")' > web/assets/index-smoke.js
          echo '{"VITE_OIDC_PROVIDER_ID": ""}' > web/config.json
          docker run -d --name web -p 8080:80 \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/web:/usr/share/nginx/html:ro" \
            nginx:bookworm
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && exit 0; sleep 1; done
          docker logs web; exit 1

      - name: Files are served from the web root
        run: |
          check() { # path, expected status, text the body must contain
            body=$(curl -sS -o - -w '\n%{http_code}' "http://localhost:8080$1")
            code=${body##*$'\n'}
            echo "$1 -> $code"
            test "$code" = "$2"
            grep -q -- "$3" <<<"$body"
          }
          check / 200 spa-shell
          check /some/client/route 200 spa-shell
          check /assets/index-smoke.js 200 'console.log("bundle")'
          check /config.json 200 VITE_OIDC_PROVIDER_ID
          # Misses stay 404 and never get the SPA shell.
          check /assets/missing-chunk.js 404 '404'

      - name: nginx logs
        if: always()
        run: docker logs web 2>&1 | tail -50
