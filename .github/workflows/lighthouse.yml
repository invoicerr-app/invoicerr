name: Lighthouse CI

# Audits the logged-in screens of a seeded instance. Informative only: no score fails the build, but a
# page that ends on another path than the one requested does (the score would describe a redirect).
# Runs when dev is merged into main, and by hand from the Actions tab.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      REDIS_URL: redis://localhost:6379
      LH_API_URL: http://localhost:4000
      LH_APP_URL: http://localhost:6284
      LH_EMAIL: john.doe@acme.org
    services:
      postgres-test:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: invoicerr
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: invoicerr_db
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 10
      mailpit:
        image: axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports:
          - "8025:8025"
          - "1025:1025"
      redis:
        image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # `--ignore-scripts` keeps dependency lifecycle scripts out of the job (SonarCloud S6505).
      - name: Install backend dependencies
        working-directory: backend
        env:
          DATABASE_URL: postgresql://invoicerr@localhost:5433/invoicerr_db
        run: |
          npm ci --ignore-scripts
          export PATH="$PWD/node_modules/.bin:$PATH"
          ./node_modules/.bin/prisma generate
          ./node_modules/.bin/prisma migrate deploy
          ./node_modules/.bin/prisma db seed

      - name: Install and build the frontend
        working-directory: frontend
        env:
          VITE_BACKEND_URL: ${{ env.LH_API_URL }}
        run: |
          npm ci --ignore-scripts
          npm run build

      # Installed once into a throwaway prefix, pinned, and called directly: no npx on-demand install.
      # puppeteer-core drives the login; the runner's own Chrome is used, nothing is downloaded.
      - name: Install CI-only tooling, pinned and without lifecycle scripts
        run: |
          mkdir -p /tmp/ci-tools
          npm install --prefix /tmp/ci-tools --no-save --ignore-scripts wait-on@9.5.1 @lhci/cli@0.15.1 puppeteer-core@24.10.0

      - name: Start the backend and the frontend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          (cd backend && npm run start:test > "$GITHUB_WORKSPACE/logs/backend.log" 2>&1 &)
          (cd frontend && ./node_modules/.bin/vite preview --port 6284 --strictPort > "$GITHUB_WORKSPACE/logs/frontend.log" 2>&1 &)
          /tmp/ci-tools/node_modules/.bin/wait-on http-get://localhost:4000/api/health http://localhost:6284/auth/sign-in --timeout 180000

      - name: Seed the audit account
        run: |
          secret="Aa1!$(openssl rand -hex 16)"
          echo "LH_PASSWORD=$secret" >> "$GITHUB_ENV"
          LH_PASSWORD="$secret" .github/lighthouse/seed.sh

      - name: Run Lighthouse CI
        run: |
          base="$LH_APP_URL"
          /tmp/ci-tools/node_modules/.bin/lhci collect \
            --url="$base/dashboard" \
            --url="$base/documents/invoice" \
            --url="$base/documents/quote" \
            --url="$base/documents/invoice/$LH_INVOICE_ID" \
            --url="$base/documents/quote/$LH_QUOTE_ID" \
            --url="$base/settings/company" \
            --numberOfRuns=1 \
            --puppeteerScript=.github/lighthouse/login.cjs \
            --chromePath="$(command -v google-chrome)" \
            --puppeteerLaunchOptions='{"args":["--no-sandbox"]}' \
            --settings.disableStorageReset=true
          /tmp/ci-tools/node_modules/.bin/lhci upload --target=filesystem --outputDir=.lighthouseci

      - name: Build the score table
        if: always()
        run: |
          [ -f .lighthouseci/manifest.json ] || { echo "No report was produced." ; exit 1; }
          status=0
          node .github/lighthouse/report.cjs || status=$?
          cat .lighthouseci/comment.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-report
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the backend log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-backend-log
          path: logs
          if-no-files-found: warn
          retention-days: 7

      - name: Comment the scores on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('.lighthouseci/comment.md') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('.lighthouseci/comment.md', 'utf8')
            const marker = '<!-- lighthouse-ci-comment -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
