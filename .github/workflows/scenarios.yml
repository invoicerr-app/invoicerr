name: Business Scenarios

on:
  pull_request:

jobs:
  scenario:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [fr-be, de-fr, it-it, es-pt, mx-us, us-us]
    services:
      postgres-test:
        image: postgres:16
        env:
          POSTGRES_USER: invoicerr
          POSTGRES_PASSWORD: invoicerr
          POSTGRES_DB: invoicerr_db
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - "8025:8025"
          - "1025:1025"
      # The backend requires Redis (BullMQ) to boot — WORKER_INLINE defaults to true, so the inline
      # compliance processors + registerRepeatables() connect at startup. Without it the Nest app
      # fails to boot and the scenario times out on a hung /api. redisConnection() defaults to
      # localhost:6379, so no backend env change is needed.
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
          DATABASE_URL="postgresql://invoicerr:invoicerr@localhost:5433/invoicerr_db" npx prisma generate
          DATABASE_URL="postgresql://invoicerr:invoicerr@localhost:5433/invoicerr_db" npx prisma migrate deploy
          # See the same step in cypress.yml: `migrate deploy` never runs the seed hook, and
          # `npm run start:test` doesn't call syncDatabaseSchema() (production-only) either — without
          # this, the document country-action policy table stays empty and every document action
          # 403s for the whole scenario.
          DATABASE_URL="postgresql://invoicerr:invoicerr@localhost:5433/invoicerr_db" npx prisma db seed

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install e2e dependencies
        run: |
          cd e2e
          npm ci

      - name: Wait for DB
        run: |
          npx wait-on tcp:5433 --timeout 60000
          npx wait-on tcp:8025 --timeout 60000
          npx wait-on tcp:1025 --timeout 60000
          npx wait-on tcp:6379 --timeout 60000

      - name: Run backend, frontend & scenario
        run: |
          mkdir -p $GITHUB_WORKSPACE/logs
          npm install -D dotenv-cli
          # The schema is already applied: the install step ran `prisma migrate deploy`
          # against this same database. `migrate dev` used to run again here — it is a
          # developer-machine command that can prompt or fail without a TTY as soon as
          # the migrations drift from schema.prisma.
          (cd $GITHUB_WORKSPACE/backend && npm run start:test > $GITHUB_WORKSPACE/logs/backend-${{ matrix.scenario }}.log 2>&1 &)
          (cd $GITHUB_WORKSPACE/frontend && npm run start:test > /dev/null 2>&1 &)
          # wait-on above only checked the DB/mail/Redis ports were open, not that the
          # Nest app itself finished booting — a slow boot or a startup crash used to
          # go unnoticed until the scenario failed with a confusing auth error.
          npx wait-on http-get://localhost:4000/api/health --timeout 120000
          (cd $GITHUB_WORKSPACE/e2e && CYPRESS_scenario=${{ matrix.scenario }} npx cypress run --spec "cypress/e2e/scenarios/full-lifecycle.cy.ts")

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs-${{ matrix.scenario }}
          path: ${{ github.workspace }}/logs/backend-${{ matrix.scenario }}.log

      - name: Upload Cypress videos and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ matrix.scenario }}-artifacts
          path: |
            ${{ github.workspace }}/e2e/cypress/videos
            ${{ github.workspace }}/e2e/cypress/screenshots
