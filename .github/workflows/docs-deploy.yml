name: Build and Deploy Documentation

# The github-pages environment's protection rules only allow deployments from
# the `main` branch, so pull requests can build/verify the site but cannot
# deploy (deploying from a PR merge ref is rejected by GitHub).
on:
  push:
    branches:
      - dev
    paths:
      - "documentation/**"
      # A backend route/DTO change moves what `/openapi.json` (below) should say, even when nothing
      # under documentation/ itself changed — without this, the published spec would only ever catch
      # up to the API the next time someone happened to also touch a doc page.
      - "backend/src/**"
      - "backend/prisma/schema.prisma"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only `openapi-dump` (below) needs these — see that step's own comment for why generating the
    # spec is a real backend boot (Postgres + Redis both required), not a static file read. Same
    # throwaway-credentials pattern `queue-integration` in cypress.yml already uses: this database and
    # this Redis exist only for the life of this job, so a hardcoded, publicly-visible key here is not
    # a secret leak.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoicerr_openapi?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: docs-deploy-openapi-dump-throwaway-secret-0000000000000000
      CREDENTIALS_ENCRYPTION_KEY: e2896d60a5fe20415931030ea7eadb3352f2698948ba29948a9f2e04b8840e6d
      APP_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoicerr_openapi
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: documentation/package-lock.json

      - name: Install dependencies
        run: |
          cd documentation
          npm ci

      # The published OpenAPI spec (docs/developer-guide/api-reference.md links to it) — generated by
      # actually booting the backend (`nest build` then `node dist/src/openapi-dump.js`, see that
      # file's own header for why a full compile is required rather than `ts-node`/`tsx`), which is
      # also why this job carries the Postgres/Redis services above. `npx prisma generate` first: the
      # Prisma client is gitignored (backend/.gitignore) and CLAUDE.md's own note applies here exactly
      # as it does to every other backend job in this repo. `migrate deploy` against the fresh, empty
      # database above: the app fails to boot against un-migrated schema, and generating a Swagger
      # document never writes a row, so there is nothing to seed.
      - name: Setup Node.js for the backend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Apply migrations (empty ephemeral DB)
        run: cd backend && npx prisma migrate deploy

      - name: Generate the OpenAPI spec
        run: cd backend && npm run openapi:dump

      - name: Publish the OpenAPI spec as a documentation static asset
        run: cp backend/openapi.json documentation/static/openapi.json

      - name: Build documentation site
        run: |
          cd documentation
          npm run build

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
