name: Publish Docker Image to GitHub Container Registry

on:
  push:
    tags:
      # Every tag, not only digit-led ones: a SemVer tag such as v2.0.0-alpha.8 must fail loudly in
      # the validation step below, not be ignored silently. The validation refuses anything that is
      # not CalVer, so no image is ever built or published for it.
      - '*'

env:
  REGISTRY: ghcr.io

# The floor every job inherits, and deliberately NOT the union of what the three jobs below need:
# only two of them push to GHCR, so `packages: write` stays on those two and never becomes something
# `prepare` carries for free. `contents: read` rather than an empty `{}` because two jobs genuinely
# read through GITHUB_TOKEN — `prepare` runs `gh release view` (releases live under the `contents`
# scope, they have no scope of their own) and `build` runs `actions/checkout`.
# Without a block here a job falls back to the repository-wide default workflow permissions, which is
# a SETTING rather than a property of this file: read-only today, one click from write for every
# workflow at once. Stating the floor caps that blast radius and makes a job added later start
# read-only, having to ask for more in writing.
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Read-only: this job only validates the tag and computes tag/cache variables — it never pushes
    # an image or a package, so it needs neither `packages: write` (that's `build`/`merge`, which
    # actually push to GHCR) nor any other scope. The checkout needs `contents: read` only to fetch
    # main and dev for the branch rule. Restating the inherited floor rather than leaning on it: this
    # block is what makes the job read-only even if the top-level one is ever widened for the sake of
    # another job.
    permissions:
      contents: read
    outputs:
      repo-name-lower: ${{ steps.set-vars.outputs.repo-name-lower }}
      image-tag: ${{ steps.set-vars.outputs.image-tag }}
      cache-ref: ${{ steps.set-vars.outputs.cache-ref }}
      registry-image: ${{ steps.set-vars.outputs.registry-image }}
      channel: ${{ steps.set-vars.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The branch rule below needs the real history: a tagged commit has to be contained in
          # main (stable) or dev (beta/rc), not merely exist somewhere.
          fetch-depth: 0

      - name: Set variables
        id: set-vars
        run: |
          REPO_NAME_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          REGISTRY_IMAGE="${REGISTRY}/${REPO_NAME_LOWER}"
          IMAGE_TAG="${GITHUB_REF_NAME}"
          CALVER='^[0-9]{2}\.(1[0-2]|[1-9])\.[0-9]+(-(beta|rc)\.[0-9]+)?$'

          if [[ ! "$IMAGE_TAG" =~ $CALVER ]]; then
            echo "::error::'${IMAGE_TAG}' is not a CalVer tag. Expected AA.M.N, AA.M.N-beta.N or AA.M.N-rc.N (for example 26.11.0). SemVer tags such as v2.0.0-alpha.8 are refused; nothing is built or published for this tag."
            exit 1
          fi

          git fetch --no-tags origin main dev
          if [[ "$IMAGE_TAG" == *-beta.* || "$IMAGE_TAG" == *-rc.* ]]; then
            CHANNEL=beta
            CACHE_REF=beta
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::pre-release '${IMAGE_TAG}' must be tagged on a commit contained in dev (or main)."
              exit 1
            fi
          else
            CHANNEL=stable
            CACHE_REF=release
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::stable '${IMAGE_TAG}' must be tagged on a commit contained in main; tag a beta or rc on dev first."
              exit 1
            fi
          fi

          echo "Current Tag: $IMAGE_TAG"
          echo "Channel: $CHANNEL"

          {
            echo "repo-name-lower=$REPO_NAME_LOWER"
            echo "image-tag=$IMAGE_TAG"
            echo "cache-ref=$CACHE_REF"
            echo "registry-image=$REGISTRY_IMAGE"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    # `contents: read` for `actions/checkout` below — the build context IS this repository, and a
    # job-level block REPLACES the top-level floor instead of adding to it, so the line has to be
    # here and not only up there.
    # `packages: write` for the push: `docker/login-action` authenticates to ghcr.io with
    # GITHUB_TOKEN and the build step's `outputs: …,push=true` uploads the per-platform image by
    # digest. `actions/upload-artifact`, at the end of this job, needs NEITHER — it authenticates
    # with the Actions runtime token, not with GITHUB_TOKEN, which is why the digest hand-off to
    # `merge` costs no scope here.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux/arm/v7 dropped: Node 26 ships no linux-armv7l build.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Stamps the commit into the image (Dockerfile's own trailing LABEL/ENV block explains why).
          # `github.sha` is the exact commit this run checked out, so the deployed image always names
          # its own source — a branch tag like `:compliance-engine-v2` moves, a revision does not.
          build-args: |
            GIT_REVISION=${{ github.sha }}
            GIT_REF_NAME=${{ github.ref_name }}
          outputs: type=image,name=${{ needs.prepare.outputs.registry-image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ needs.prepare.outputs.cache-ref }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.cache-ref }}-${{ matrix.platform }}

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    # `packages: write` because THIS is the job that creates the published tag: `docker buildx
    # imagetools create` reads back the per-platform digests `build` pushed and writes the manifest
    # list at `:<image-tag>` (plus `:latest` when `prepare` said so), all against ghcr.io under
    # GITHUB_TOKEN.
    # And NOTHING else — no `contents: read`, unlike its two siblings, because a job-level block
    # REPLACES the top-level floor rather than adding to it and this job never reads the repository:
    # it does not check out (the manifest is assembled from digests, not from source), and none of
    # its four steps reaches GITHUB_TOKEN for anything but the registry. Each was checked against its
    # own action definition rather than assumed: `actions/download-artifact` leaves `github-token`
    # with NO default and needs it only for a different repository or a different run — this one
    # downloads from its own run, over the Actions runtime token, like its upload counterpart in
    # `build`; `docker/setup-buildx-action` and `docker/login-action` declare no token input at all
    # (login takes the password explicitly, below), and neither is `docker/build-push-action`, whose
    # `github-token` default IS the reason `build` above keeps its own `contents: read`.
    # If that ever stops holding, the symptom is a 403 on repository metadata in this job alone, and
    # the fix is to add the line back here — not to widen the floor for all three.
    # `security-events: write` was added on top of that reasoning for the Trivy scan at the end of
    # this job: `github/codeql-action/upload-sarif` needs it to write findings to the Security tab,
    # and nothing else in the job touches repository metadata because of it.
    permissions:
      packages: write
      security-events: write
    # The image tag is the release's tag name: it reaches the scripts below as data, never as
    # interpolated shell.
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.registry-image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - working-directory: /tmp/digests
        run: |
          tags=(-t "$REGISTRY_IMAGE:$IMAGE_TAG")
          # Exactly one moving tag per channel: a stable release moves `latest`, a tagged beta/rc
          # moves `beta`, and neither ever touches the other. `nightly` is docker-dev.yml's, never
          # this workflow's. A pre-release is therefore never reachable through `latest`.
          if [[ "$CHANNEL" == "stable" ]]; then
            tags+=(-t "$REGISTRY_IMAGE:latest")
            echo "Stable release: adding the 'latest' tag"
          elif [[ "$CHANNEL" == "beta" ]]; then
            tags+=(-t "$REGISTRY_IMAGE:beta")
            echo "Pre-release: adding the 'beta' tag"
          fi
          refs=()
          for digest in *; do refs+=("$REGISTRY_IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - run: docker buildx imagetools inspect "$REGISTRY_IMAGE:$IMAGE_TAG"

      # Scans the manifest list just created, the same two-run pattern as docker-dev.yml's own
      # Trivy steps (see that file's comment for why there are two): a full report to the Security
      # tab, then a gate that only fails on a fixable CRITICAL finding.
      - name: Trivy scan (report, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.prepare.outputs.registry-image }}:${{ needs.prepare.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy report to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4 (4.38.2)
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release

      - name: Trivy scan (gate on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.prepare.outputs.registry-image }}:${{ needs.prepare.outputs.image-tag }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'