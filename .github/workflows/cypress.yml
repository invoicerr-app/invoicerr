name: Tests

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Biome is the only linter/formatter (eslint+prettier removed). biome ci = check without writes.
      - name: Lint backend (biome ci)
        run: cd backend && npx --yes @biomejs/biome@2.5.2 ci .

      - name: Lint frontend (biome ci)
        run: cd frontend && npx --yes @biomejs/biome@2.5.2 ci .

      # The frontend unit tests (vitest + testing-library) ride along in this job rather than
      # claiming a runner of their own: they take seconds, and this is already the "static checks on
      # both projects" job. `npm ci` is needed here — the biome steps above deliberately use npx and
      # install nothing, but vitest and jsdom have to come from the lockfile.
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend unit tests (vitest)
        run: cd frontend && npm test

  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check i18n catalogs (used keys must exist in EN)
        run: node frontend/scripts/i18n-check.mjs

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && DATABASE_URL="postgresql://unused:unused@localhost:5432/unused" npx prisma generate

      - name: Run backend unit tests
        run: cd backend && npm test -- --ci

  queue-integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoicerr_test?schema=public
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoicerr_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - "8025:8025"
          - "1025:1025"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      # Apply the full migration chain to the empty CI Postgres — the same path production runs via
      # syncDatabaseSchema() (prisma migrate deploy). The integration specs below create their own
      # document/company fixtures against this schema.
      - name: Apply migrations (empty dev DB)
        run: cd backend && npx prisma migrate deploy

      # `migrate deploy` does NOT run the seed hook (only `migrate dev`/`migrate reset`/`db seed`
      # do) — without this, the document country-action policy table stays EMPTY and every "send"
      # below 403s before ever reaching the queue (country-policy.ts blocks everything for a country
      # with no rows). Same gotcha the cypress-run job's own install step already documents.
      - name: Seed reference data (country policy, ...)
        run: cd backend && npx prisma db seed

      # The document-action queue's real end-to-end proof (TODO.md item 22): enqueue -> a REAL BullMQ
      # worker consumes -> the email genuinely lands in Mailpit -> the document reaches "sent"; a
      # forced failure (SMTP pointed nowhere) exhausts retries and lands on "send_failed" with the
      # error recorded, then a re-`send` succeeds. Self-gated on REDIS_URL (same pattern the
      # pre-refonte compliance queue's own specs used), so it self-skips in the offline
      # backend-tests job and only executes here. --runInBand because every spec shares one Redis/
      # Postgres/Mailpit and would otherwise race; --forceExit because BullMQ/ioredis keep
      # connections open past the last assertion.
      - name: Run document-action queue integration specs (real Redis + Postgres + Mailpit)
        env:
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_SECURE: 'false'
          SMTP_FROM: queue-integration@invoicerr.test
        run: cd backend && npx jest --ci --runInBand --forceExit --testPathPattern 'modules/documents/queue/__tests__'

  cypress-run:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:16
        env:
          POSTGRES_USER: invoicerr
          POSTGRES_PASSWORD: invoicerr
          POSTGRES_DB: invoicerr_db
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - "8025:8025"
          - "1025:1025"
      # The backend requires Redis (BullMQ) to boot at all — TODO.md item 22's document-action
      # queue's own DocumentQueueRedisRequiredGuard fails the whole boot loudly without it, and
      # WORKER_INLINE defaults to true, so the inline document-action processor connects at startup
      # too. Without this service the Nest app fails to boot and every e2e times out on a hung /api.
      # redisConnection() defaults to localhost:6379, so no backend env change is needed.
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
          DATABASE_URL="postgresql://invoicerr:invoicerr@localhost:5433/invoicerr_db" npx prisma generate
          DATABASE_URL="postgresql://invoicerr:invoicerr@localhost:5433/invoicerr_db" npx prisma migrate deploy
          # `migrate deploy` does NOT run the seed hook (only `migrate dev`/`migrate reset`/`db seed`
          # do — see prisma.config.ts) — without this, the document country-action policy table stays
          # EMPTY and every document action 403s in every spec below (country-policy.ts blocks
          # everything for a country with no rows). `npm run start:test` doesn't call
          # syncDatabaseSchema() either (production-only, see main.ts), so nothing else seeds it here.
          DATABASE_URL="postgresql://invoicerr:invoicerr@localhost:5433/invoicerr_db" npx prisma db seed

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install e2e dependencies
        run: |
          cd e2e
          npm ci

      - name: Wait for DB
        run: |
          npx wait-on tcp:5433 --timeout 60000
          npx wait-on tcp:8025 --timeout 60000
          npx wait-on tcp:1025 --timeout 60000
          npx wait-on tcp:6379 --timeout 60000

      - name: Run backend, frontend & tests
        run: |
          mkdir -p $GITHUB_WORKSPACE/logs
          npm install -D dotenv-cli
          # The schema is already applied: the install step ran `prisma migrate deploy`
          # against this same database. `migrate dev` used to run again here — it is a
          # developer-machine command that can prompt or fail without a TTY as soon as
          # the migrations drift from schema.prisma.
          (cd $GITHUB_WORKSPACE/backend && npm run start:test > $GITHUB_WORKSPACE/logs/backend.log 2>&1 &)
          (cd $GITHUB_WORKSPACE/frontend && npm run start:test > /dev/null 2>&1 &)
          # wait-on above only checked the DB/mail/Redis ports were open, not that the
          # Nest app itself finished booting — a slow boot or a startup crash used to
          # go unnoticed until 15 Cypress specs failed with confusing auth errors.
          npx wait-on http-get://localhost:4000/api/health --timeout 120000
          (cd $GITHUB_WORKSPACE/e2e && npm run e2e:run)

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: ${{ github.workspace }}/logs/backend.log

      - name: Upload Cypress videos and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-screenshots
          path: |
            ${{ github.workspace }}/e2e/cypress/videos
            ${{ github.workspace }}/e2e/cypress/screenshots
