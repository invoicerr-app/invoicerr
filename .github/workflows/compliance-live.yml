name: Compliance live tests

# Live (real-API) e-invoicing round-trips. SKIPPED by default everywhere — each spec self-gates on
# its <CHANNEL>_LIVE flag AND the presence of its credential env vars (see live-gate.ts /
# documentation/docs/developer-guide/live-testing.md).
#
# NOT run on pull_request: GitHub does NOT expose repository secrets to workflows triggered by PRs from
# forks, so live secrets would be empty there. Run it manually (workflow_dispatch) or on a schedule.
#
# Secrets live in: repo Settings → Secrets and variables → Actions → "New repository secret".
# (GitLab equivalent: Settings → CI/CD → Variables. Forgejo/Gitea: Settings → Actions → Secrets.)
# A channel with no secrets set is silently skipped — fill them in channel by channel.
#
# CRON CAVEAT: GitHub only fires `schedule` triggers from the repository's DEFAULT branch, which in
# this repository is `dev`, not `main`. The nightly cron below is therefore LIVE already - it fired on
# 2026-09-23 and 2026-09-24 (runs 35835437074 and 35972649692), both red. On any other branch it stays
# inert and the "Run workflow" button (workflow_dispatch) is the way in. See
# documentation/docs/developer-guide/live-testing.md for the full list of repo secrets needed for a
# completely green (real round-trip) run. With NONE of them set, every creds-gated spec below
# self-skips; the only row that still runs is the RFC 3161 TSA one, which needs no credential (the
# Peppol channel, whose peppol.sh leg used to be the other creds-free spec here, was removed from the
# product 2026-09-15 - see live-testing.md/credentials-guide.md for the current channel list). The
# last step of the job fails if even that one did not run, so a green here always means at least one
# real round-trip happened.

on:
  workflow_dispatch:        # manual button in the Actions tab
  schedule:
    - cron: '0 3 * * *'     # nightly 03:00 UTC - only fires from the default branch (`dev` here); see cron caveat above

# Every step below only checks out this repo, runs Vitest, and reads secrets already scoped to this
# job's own env block — nothing here pushes a package, comments on a PR, or otherwise needs the
# GITHUB_TOKEN for anything beyond cloning. `contents: read` is the whole ask.
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    # Optional: a GitHub Environment named "live-tests" lets you require a reviewer before each run.
    environment: live-tests
    # Real Postgres only. pdp-conformity.live.spec.ts, sequence.live.spec.ts and send-quote.live.spec.ts
    # create real Company/DocumentInstance rows through the `prisma` singleton (never a mocked client) —
    # every other spec in this job is provider-level (no DB) and simply ignores this service. No Redis
    # service: none of the 31 `*.live.spec.ts` files the run step below matches instantiates a
    # BullMQ/ioredis connection or boots a Nest module that would (verified file-by-file, 2026-09-13;
    # re-checked 2026-09-24 against the exact file list the current filter produces) - it used to be
    # needed by a queue-driven pipeline spec that no longer exists in this codebase (see below).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoicerr_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # *_LIVE / *_ENV / *_CHANNEL are constants set here, NOT secrets — only credentials are secrets.
      # Flags ON — the per-spec credential gate decides what actually runs.
      KSEF_LIVE: '1'
      PDP_LIVE: '1'
      IOPOLE_LIVE: '1'        # FR - Iopole, see its own block below
      SDI_LIVE: '1'
      TSA_LIVE: '1'           # RFC 3161 -T timestamping (e.g. FreeTSA)
      CHORUSPRO_LIVE: '1'     # FR B2G (PISTE OAuth2) — see its own block below
      STRIPE_LIVE: '1'        # Online payment — see its own block below
      MOLLIE_LIVE: '1'        # Online payment — see its own block below
      PAYPAL_LIVE: '1'        # Online payment — see its own block below
      INVOPOP_LIVE: '1'       # Invopop (GOBL pivot) - see its own block below

      # --- Real Postgres for the specs that touch the `prisma` singleton directly (see the
      # `services:` comment above for which ones and why) — a fresh, empty, freshly-migrated DB is
      # enough; those specs create and clean up their own rows.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoicerr_test?schema=public

      # --- TSA (RFC 3161) — e.g. https://freetsa.org/tsr ---
      # The ONLY row here that needs no credential at all: FreeTSA is public and anonymous, so the
      # fallback below is a constant, not a secret leaking into the file. It is deliberate - it is
      # what makes this job's green mean something. With every other row gated on a real credential,
      # a repository that lost or never set them would run ZERO live specs and still exit 0; the
      # "assert at least one live spec actually executed" step at the end turns that state red, and
      # this fallback is what keeps it from being red for the wrong reason. `secrets.TSA_URL` still
      # wins when set, so pointing the job at another RFC 3161 responder stays a secret change.
      TSA_URL: ${{ secrets.TSA_URL || 'https://freetsa.org/tsr' }}

      # --- PL KSeF ---
      KSEF_AUTH_TOKEN:   ${{ secrets.KSEF_AUTH_TOKEN }}
      KSEF_NIP:          ${{ secrets.KSEF_NIP }}

      # --- FR PDP (superpdp) ---
      PDP_BASE_URL:      ${{ secrets.PDP_BASE_URL }}
      PDP_CLIENT_ID:     ${{ secrets.PDP_CLIENT_ID }}
      PDP_CLIENT_SECRET: ${{ secrets.PDP_CLIENT_SECRET }}

      # --- FR Iopole ---
      # The round trip is PROVEN against the `ppd` sandbox (2026-09-24, see live-testing.md's own
      # Iopole section), but these three repository secrets do NOT exist yet: until someone sets
      # them, the gate self-skips silently, exactly like every other unfilled row here. No
      # PDP_IOPOLE_API_BASE / PDP_IOPOLE_TOKEN_URL on purpose - both hosts are fixed constants in
      # `iopole-transport.ts#IOPOLE_URLS`, and the spec's env overrides exist for a local operator,
      # not for CI.
      PDP_IOPOLE_CLIENT_ID:     ${{ secrets.PDP_IOPOLE_CLIENT_ID }}
      PDP_IOPOLE_CLIENT_SECRET: ${{ secrets.PDP_IOPOLE_CLIENT_SECRET }}
      PDP_IOPOLE_CUSTOMER_ID:   ${{ secrets.PDP_IOPOLE_CUSTOMER_ID }}

      # --- FR B2G — Chorus Pro (PISTE OAuth2) ---
      # Still-live, still-wired channel (transports/chorus-pro/) — moved here from the now-deleted
      # national-portals-live job, since its own live spec is matched by THIS job's `.live.spec.ts`
      # pattern already and only needed its flag/creds actually declared somewhere to ever fire.
      # HONEST STATUS (see choruspro.live.spec.ts's own header): skipped, always, today — this repo
      # holds no PISTE account of any kind. CHORUSPRO_TECH_LOGIN/PASSWORD are read too but are NOT part
      # of the gate's required list: the spec runs the OAuth half alone and skips only the deposit half
      # when the technical-account pair is absent.
      CHORUSPRO_CLIENT_ID: ${{ secrets.CHORUSPRO_CLIENT_ID }}
      CHORUSPRO_CLIENT_SECRET: ${{ secrets.CHORUSPRO_CLIENT_SECRET }}
      CHORUSPRO_TECH_LOGIN: ${{ secrets.CHORUSPRO_TECH_LOGIN }}
      CHORUSPRO_TECH_PASSWORD: ${{ secrets.CHORUSPRO_TECH_PASSWORD }}
      CHORUSPRO_ENVIRONMENT: 'SANDBOX'

      # --- IT SdI (SDI_CERTIFICATE is the PFX encoded base64, passed directly — no file) ---
      SDI_ID_TRASMITTENTE: ${{ secrets.SDI_ID_TRASMITTENTE }}
      SDI_ENDPOINT:        ${{ secrets.SDI_ENDPOINT }}
      SDI_CERTIFICATE:     ${{ secrets.SDI_CERTIFICATE }}
      SDI_CERT_PASSWORD:   ${{ secrets.SDI_CERT_PASSWORD }}

      # --- Online payment — Stripe → Mollie → PayPal (2026-09-15). All
      # three self-skip with no secrets set, same as every other row here; none has ever run for real
      # in this repo (see live-testing.md's own table).
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      MOLLIE_API_KEY:    ${{ secrets.MOLLIE_API_KEY }}
      PAYPAL_CLIENT_ID:     ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID:    ${{ secrets.PAYPAL_WEBHOOK_ID }}
      PAYPAL_ENVIRONMENT: 'sandbox'

      # --- Invopop (GOBL pivot, any country the workspace is set up for) ---
      # INVOPOP_API_KEY is a workspace token and carries the workspace with it: there is no separate
      # sandbox host, so the token itself is what decides sandbox or live. The spec refuses to run
      # against a workspace whose own `sandbox` flag is not true, which is the only guard there is.
      # INVOPOP_WORKFLOW_ID names a PUBLISHED workflow in that same workspace - without one there is
      # nothing to run a deposited entry through. INVOPOP_BASE_URL is optional and normally unset.
      INVOPOP_API_KEY:     ${{ secrets.INVOPOP_API_KEY }}
      INVOPOP_WORKFLOW_ID: ${{ secrets.INVOPOP_WORKFLOW_ID }}

      # Encryption key for any credential-store round-trip the specs may touch.
      CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      # Apply the full migration chain to the empty CI Postgres — same as cypress.yml's
      # queue-integration job. pdp-conformity.live.spec.ts, sequence.live.spec.ts and
      # send-quote.live.spec.ts create their own Company/DocumentInstance fixtures against this
      # schema and clean them up themselves (afterAll, or inline once done with them).
      - name: Apply migrations (empty dev DB)
        run: cd backend && npx prisma migrate deploy

      # Vitest, not Jest. Jest and ts-jest were removed from backend/package.json by the 2026-09-19
      # migration (see backend/vitest.config.ts's own header), so the `npx jest live` this step used
      # to run had no local binary to resolve: npx silently DOWNLOADED jest@30 from the registry and
      # ran it with no config and no TypeScript transform. Every suite then died on a parse error and
      # ZERO tests executed - measured on the 2026-09-24 nightly, run 35972649692: "Test Suites: 35
      # failed, 35 total / Tests: 0 total".
      #
      # `.live.spec.ts` and not `live`: a bare `live` is a substring match over the whole path, and it
      # also swept in `src/live-spec-naming.spec.ts` plus the three webhook `*delivery*` specs (de-LIVE-ry)
      # - one of which needs a real Redis this job deliberately does not provision. The dot form matches
      # exactly the 31 files the repo's own naming convention guarantees (`src/live-spec-naming.spec.ts`
      # is the tripwire that keeps that convention true).
      #
      # --no-file-parallelism: the same flag live-testing.md prescribes for every single-spec run.
      # Live specs deposit real documents on real platforms and several create real Company rows in the
      # Postgres above; running them concurrently would interleave authority calls and fixtures.
      #
      # Jest's --no-coverage/--ci/--forceExit have no place here: coverage is off unless asked for,
      # Vitest detects CI on its own, and the `forks` pool already terminates each spec's child process
      # (with it, the real Prisma connection pool that made --forceExit necessary under Jest).
      #
      # --reporter=json feeds the next step. Do not drop it: the exit code alone cannot distinguish
      # "every gate opened and passed" from "every gate self-skipped".
      - name: Run gated live specs
        run: |
          cd backend
          npx vitest run .live.spec.ts \
            --no-file-parallelism \
            --reporter=default \
            --reporter=json \
            --outputFile.json=live-results.json

      # A green that proves nothing is worse than a red. Vitest exits 0 when all 31 suites self-skip,
      # which is precisely the state a repository with no credentials left would sit in forever, in
      # silence. Executed == 0 therefore fails the job: it means no *_LIVE flag above reached a spec
      # with its credentials present, not that everything is fine. A row that skips because its own
      # secret is absent stays correct and expected - this only fires when NOTHING ran at all.
      - name: Assert at least one live spec actually executed
        run: |
          cd backend
          node -e '
            const report = require("./live-results.json");
            const executed = report.numPassedTests + report.numFailedTests;
            console.log(
              `live specs: ${executed} executed (${report.numPassedTests} passed, ` +
                `${report.numFailedTests} failed), ${report.numPendingTests} skipped by their gate.`,
            );
            if (executed === 0) {
              console.error(
                "No live spec executed: every gate self-skipped. This job proved nothing. Check the " +
                  "*_LIVE flags in this workflow and the repository secrets each one depends on " +
                  "(documentation/docs/developer-guide/live-testing.md lists them channel by channel).",
              );
              process.exit(1);
            }
          '
