name: Verify Docker Build (PR)

# A pull request labelled `preview` publishes `pr-<number>`, rebuilt on every push while the label
# stays. `workflow_dispatch` builds a branch with no pull request open, tagged with its name.
#
# Multi-arch, the same shape as docker-publish.yml: one job per platform on its own NATIVE runner
# (the Scaleway nodes a branch image gets tested on are ARM, the dev instance is x86; emulating an
# ARM Node build through QEMU on an x86 runner multiplies its time several times over), each pushing
# its image by digest, then `merge` assembles one manifest list under the tag. One tag, one digest,
# pulled by either architecture. arm/v7 is not built anywhere any more (Node 24 ships no build for it).
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to the sanitised branch name)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io

# Adding any other label must not land in the preview's group, or it would cancel a build in progress.
concurrency:
  group: docker-pr-${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The floor every job inherits. Without a block here a job falls back to the repository-wide default
# workflow permissions -- a SETTING, not a property of this file: it reads read-only today and one
# click flips it to write for every workflow in the repository at once. Stating the floor means the
# next job added below starts read-only whatever that setting says, and has to ask for more in
# writing. `build` and `merge` below are the jobs that ask, and say why.
permissions:
  contents: read

jobs:
  prepare:
    # A fork's pull request gets a read-only token and could not push: skipped, not failed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action == 'labeled' && github.event.label.name == 'preview' ||
          github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Set variables
        id: vars
        # `INPUT_TAG` below: `inputs.tag` is workflow_dispatch-only, already gated behind repo write
        # access, so a hostile value here would require that access anyway — hardened regardless, as
        # cheap CI hygiene. Passed via `env:` rather than interpolated directly into the script
        # (`TAG="${{ inputs.tag }}"`), which GitHub substitutes BEFORE bash ever sees the line: a value
        # containing shell metacharacters would execute in the job's own context. `env:` hands it to
        # bash as an ordinary environment variable instead, which is never re-parsed as shell syntax.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPO_NAME_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${REPO_NAME_LOWER}" >> "$GITHUB_OUTPUT"

          # The default tag is the branch name with every character a Docker tag rejects turned into
          # a dash -- `feat/compliance-engine-v2` is not a legal tag, `feat-compliance-engine-v2` is.
          TAG="$INPUT_TAG"
          if [[ -n "$PR_NUMBER" ]]; then
            TAG="pr-$PR_NUMBER"
          elif [[ -z "$TAG" ]]; then
            TAG=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/-*$//')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    # `contents: read` for `actions/checkout` below -- a job-level block REPLACES the top-level floor
    # instead of adding to it. `packages: write` for the push by digest: `docker/login-action`
    # authenticates to ghcr.io with GITHUB_TOKEN, and a token without it logs in successfully and
    # then fails at the first layer upload.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Same stamping as docker-publish.yml — a PR image is the one most likely to be deployed
          # somewhere and later wondered about, so it needs the revision at least as much.
          build-args: |
            GIT_REVISION=${{ github.sha }}
            GIT_REF_NAME=${{ github.ref_name }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ needs.prepare.outputs.tag }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.tag }}-${{ matrix.platform }}

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    # `packages: write` only: this job writes the tag's manifest list from the digests `build`
    # pushed, and never reads the repository -- see docker-publish.yml's own `merge` for the
    # action-by-action check behind leaving `contents: read` out.
    permissions:
      packages: write
    # The tag can come from the workflow_dispatch input: it reaches the scripts below as data, never
    # as interpolated shell.
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - working-directory: /tmp/digests
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE_NAME@sha256:$digest"); done
          docker buildx imagetools create -t "$IMAGE_NAME:$TAG" "${refs[@]}"

      - name: Publish pull command
        run: |
          IMAGE="$IMAGE_NAME:$TAG"
          docker buildx imagetools inspect "$IMAGE"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "### Pull this build"
            echo ""
            echo '```'
            echo "docker pull $IMAGE"
            echo "$IMAGE_NAME@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
