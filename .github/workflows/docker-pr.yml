name: Verify Docker Build (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          REPO_NAME_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${REPO_NAME_LOWER}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

          if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.vars.outputs.push }}
          tags: ${{ steps.vars.outputs.image }}:test-pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,mode=max,scope=pr-${{ github.event.pull_request.number }}

      - name: Publish pull command
        if: steps.vars.outputs.push == 'true'
        run: |
          {
            echo "### Test this PR's Docker image"
            echo ""
            echo '```'
            echo "docker pull ${{ steps.vars.outputs.image }}:test-pr-${{ github.event.pull_request.number }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "docker pull ${{ steps.vars.outputs.image }}:test-pr-${{ github.event.pull_request.number }}"
