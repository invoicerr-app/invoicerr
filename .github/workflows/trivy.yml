name: Trivy vulnerability scan (pull request proof)

# docker-dev.yml and docker-publish.yml now each scan the real image they push, right after they
# push it (see the Trivy steps added to both). Neither of them builds anything on a pull_request
# event though, so a PR touching the Dockerfile or either workflow would otherwise merge unproven.
#
# This workflow closes that gap by building the same Dockerfile, with the same build-args, on the
# pull request itself -- single platform, loaded into the local Docker daemon, never pushed
# anywhere -- and running the exact same two-run Trivy pattern against that local image. It is the
# "image built in the PR job" option from issue #612, not "the latest dev image": a locally built
# image proves the Dockerfile and the Trivy step work together without depending on what is
# currently sitting in the registry, and does not need registry credentials to read someone else's
# published tag.
on:
  pull_request:
    branches: [ dev ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-dev.yml'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/trivy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04
    # `contents: read` for `actions/checkout`. `security-events: write` for
    # `github/codeql-action/upload-sarif`, same reasoning as the two publish workflows. No
    # `packages: write`: this job never logs into a registry, the built image stays local.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64
          # Same stamping as docker-dev.yml and docker-publish.yml, for consistency -- this image
          # is never deployed anywhere, but a mismatched build-arg shape would be a silent
          # difference between what this workflow proves and what the other two actually build.
          build-args: |
            GIT_REVISION=${{ github.sha }}
            GIT_REF_NAME=${{ github.head_ref || github.ref_name }}
          tags: invoicerr:pr-scan
          load: true
          push: false
          cache-from: type=gha,scope=trivy-pr-linux-amd64
          cache-to: type=gha,mode=max,scope=trivy-pr-linux-amd64

      - name: Trivy scan (report, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: invoicerr:pr-scan
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy report to the Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4 (4.38.2)
        with:
          sarif_file: trivy-results.sarif
          category: trivy-pr

      - name: Trivy scan (gate on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: invoicerr:pr-scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
